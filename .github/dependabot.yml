version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  # web/ React+TS monitor dashboard (npm, committed package-lock.json).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # vitest and @vitest/coverage-v8 pin each other with an EXACT peer
      # version, so a lone bump of either can never pass npm ci (PRs
      # #114/#119 both died on ERESOLVE). Tailwind's core + vite plugin
      # move in lockstep releases the same way (#150/#152).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # react and react-dom must be the EXACT same version at runtime --
      # react-dom refuses to initialise otherwise ("Incompatible React
      # versions") -- and @types/react-dom peers on "@types/react": "^19.x"
      # of its own minor. With all four pinned exactly, Dependabot split one
      # React release into #397 (react + @types/react) and #393 (react-dom +
      # @types/react-dom); neither half could ever pass, one dying on
      # ERESOLVE at npm ci and the other on all 83 vitest suites plus every
      # browser e2e leg. They move as one group.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The react-aria family ships lockstep releases that all depend on the
      # same @internationalized/date. Bumping one alone leaves our direct
      # @internationalized/date pin behind, so npm installs a SECOND nested
      # copy — and CalendarDate/CalendarDateTime declare `#private`, which
      # makes them nominally typed. Two structurally identical copies are then
      # mutually unassignable, and tsc fails with "Type 'CalendarDateTime' is
      # not assignable to type 'DateValue'" (run 31254709238: 9 errors that
      # took out check-ts, docs and all three dashboard-e2e legs, since every
      # one of them runs `make web`). tailwindcss-react-aria-components is
      # deliberately NOT listed: it is a Tailwind plugin on its own cadence.
      react-aria:
        patterns:
          - "react-aria"
          - "react-aria-components"
          - "react-stately"
          - "@react-aria/*"
          - "@react-stately/*"
          - "@internationalized/*"
