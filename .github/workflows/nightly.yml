name: Nightly

# Nightly flake-flush: re-runs otto's NON-DETERMINISTIC lanes at high
# iteration count to catch timing/order races a single push run can miss —
# the SessionManager concurrency + telnet-deadlock stability tests, the
# hostless unit matrix under pytest-repeat, the single-process test-isolation
# repeat (`unit-repeat`), and the 3-engine browser e2e.
# Also runs the tier-2 real-signal chaos suite (tests/integration/chaos) once
# per night, against a throwaway loopback sshd the suite starts and tears
# down itself — real SIGINT/SIGTERM against real otto subprocesses, still no
# Vagrant VMs in GHA. Also runs the tier-3 docker chaos slice
# (tests/e2e/chaos/test_docker_chaos.py) once per night, over the same kind
# of loopback sshd but wrapping the RUNNER's own docker daemon
# (OTTO_CHAOS_DOCKER=loopback) rather than a bed host — real `docker
# kill`/`pause`/`restart`/daemon-restart, safe only on a disposable runner.
# The manager interleaving above still runs via FakeSession (mocked
# transports); the VM-dependent Python tiers are still out.
#
# Also runs the host-contract conformance suite (tests/conformance) once per
# night in its hermetic venue — no lab, no VMs — for a different reason from
# the lanes above: it does not flake, it SAMPLES. Each run draws its
# (host, term, transfer) cells off the session seed, so what a run covers is
# decided per run and a per-push gate could fail an unrelated PR on
# pre-existing breakage in a cell nothing had drawn before.
#
# Also runs the next-Python canary (`python-canary` below): a ratchet that
# probes how far the interpreter AFTER the supported ceiling gets — install,
# import, collect, test — and reds only when that changes. It belongs here
# and not in ci.yml because it is the slow probe of an interpreter otto does
# not support yet: most of what moves it moves on PyPI's clock (a wheel lands
# or is pulled). A commit here can break it too, and that shows up the next
# night, not on the pull request.
#
# Also runs the probe-line cut sweep (`probe-cut-sweep` below, #853), and it
# is the one DETERMINISTIC lane here: every tail of the readiness handshake
# and the resync probe, typed into a fresh interactive shell on a controlling
# pty, then the line whole once. It gives the same answer every run; it is
# here because it is exhaustive and slow (~12k cases, each a fresh shell and
# the session's 0.5 s probe interval), which the per-push unit lane cannot
# afford. Its fast fixed hazard cases run on every push in ci.yml.
#
# Deterministic gates (lint-python, typecheck-python, check-ts, docs) are
# deliberately NOT duplicated here — they run on every push in ci.yml and
# produce the same result each time, so a nightly rerun adds no signal. What
# belongs in this workflow is a lane whose result can differ between two runs
# of the same commit: the flaky ones above, and the sampled one below; the cut
# sweep is the one exception (above).
on:
  schedule:
    # Nightly at 06:00 UTC. cron is in UTC regardless of repo timezone.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'pytest-repeat iteration count (stability tests)'
        required: false
        default: '100'
      nox_count:
        description: 'pytest-repeat iteration count (nox unit matrix + dashboard e2e)'
        required: false
        default: '5'

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NO_COLOR: "1"
  TERM: dumb
  FORCE_COLOR: ""
  CLICOLOR_FORCE: ""
  PY_COLORS: ""
  CLICOLOR: ""

jobs:
  stability-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    # `make stability-unit` is a plain `uv run pytest`, and uv picks the
    # project interpreter from `.python-versions` -- whose FIRST line is 3.10
    # -- unless told otherwise. Without this every cell soaked 3.10 under its
    # own label. UV_PYTHON outranks the version file for `uv sync` and every
    # `uv run` below, including the ones the Makefile spells.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Confirm the environment runs Python ${{ matrix.python-version }}
        run: uv run python -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python-version }}', f'the environment runs Python {v}'"

      # No BusyBox artifact cache here, on purpose: `make stability-unit` is
      # `pytest -m concurrency`, four fast no-VM files, none of which reaches
      # the artifacts. tests/unit/host/test_busybox_artifacts.py derives the
      # caching lanes from what each job runs; this job is not one of them.
      - name: Run unit stability tests
        run: make stability-unit COUNT=${{ inputs.count || '100' }}

  # Re-run the no-testbed CI gate matrix several times under pytest-repeat to
  # flush flakes anywhere in the suite (not just the stability tests). Runs
  # each interpreter's hostless sessions (tests_hostless_unit everywhere,
  # tests_hostless_e2e on the bookends, tests_hostless_guards on 3.10) and
  # loops each with --count via pytest-repeat.
  unit-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.10"
            sessions: tests_hostless_unit-3.10 tests_hostless_e2e-3.10 tests_hostless_guards-3.10
          - python-version: "3.11"
            sessions: tests_hostless_unit-3.11
          - python-version: "3.12"
            sessions: tests_hostless_unit-3.12
          - python-version: "3.13"
            sessions: tests_hostless_unit-3.13
          - python-version: "3.14"
            sessions: tests_hostless_unit-3.14 tests_hostless_e2e-3.14
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Same tree as ci.yml's hostless legs, so the same artifact dependency:
      # tests/unit/test_support_matrix.py spawns a hermetic conformance run
      # whose BusyBox cells are built from the artifacts, and this job repeats
      # that `nox_count` times (default 5) on the 3.10 leg — the module is
      # `interpreter_agnostic`, so every other leg deselects it; the cache step
      # stays on every leg, harmlessly. Same rule — exact key on
      # the pins, no `restore-keys`, detection stays in ci.yml's `busybox` job,
      # which is where the rationale is written.
      - name: Cache the BusyBox artifacts this lane consumes (detection stays in `busybox`)
        uses: actions/cache@v6
        with:
          path: ~/.cache/otto/busybox
          key: busybox-artifacts-${{ hashFiles('tests/_fixtures/busybox_pins.json') }}

      - name: Install strace (the import budget counts stat syscalls through it)
        run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }

      # tests/unit/cov/test_kmodcov_reader.py builds otto_kmodcov's C with a gcc
      # before 12, the gcc and clang, and reads what each writes with its own
      # gcov; the runner image may lack gcc-11, clang or llvm-cov.
      - name: Install gcc-11, clang and llvm-cov (the kmodcov reader tests)
        run: command -v gcc-11 && command -v clang && command -v llvm-cov || { sudo apt-get update && sudo apt-get install -y gcc-11 clang llvm; }

      - name: Run nox unit tests ${{ inputs.nox_count || '5' }}x
        run: >-
          uv run nox -s ${{ matrix.sessions }} --
          --count=${{ inputs.nox_count || '5' }} --repeat-scope=session

  # The test-isolation guard: tests/unit twice in ONE process (the
  # tests_unit_repeat session, see noxfile.py), so a test that leaves
  # process-global state behind — a tmp-path import, a loop-bound lock, a
  # module identity — breaks on the second pass. It ran on every push and
  # pull request until #795: at ~60 min it was the longest CI job by a factor
  # of two and set every PR's wall clock, while the leak classes it was built
  # for are now restored per test by the root conftest (`_isolate_registries`)
  # or purged by their fixtures. What it still catches is the class nobody has
  # named yet, which is nightly's job. Single-process is deliberate: under
  # `-n auto` the repeats scatter across workers and mask cross-module leaks.
  # Not under pytest-repeat's `nox_count`: the session fixes --count=2, the
  # check is pass/fail, not a soak.
  unit-repeat:
    name: unit-repeat (test-isolation guard)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      # Same tree as `unit-matrix`, same artifact dependency, same rule: exact
      # key on the pins, no `restore-keys`, detection stays in ci.yml's `busybox`.
      - name: Cache the BusyBox artifacts this lane consumes (detection stays in `busybox`)
        uses: actions/cache@v6
        with:
          path: ~/.cache/otto/busybox
          key: busybox-artifacts-${{ hashFiles('tests/_fixtures/busybox_pins.json') }}

      - name: Install strace (the import budget counts stat syscalls through it)
        run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }

      # tests/unit/cov/test_kmodcov_reader.py builds otto_kmodcov's C with a gcc
      # before 12, the gcc and clang, and reads what each writes with its own
      # gcov; the runner image may lack gcc-11, clang or llvm-cov.
      - name: Install gcc-11, clang and llvm-cov (the kmodcov reader tests)
        run: command -v gcc-11 && command -v clang && command -v llvm-cov || { sudo apt-get update && sudo apt-get install -y gcc-11 clang llvm; }

      - name: Repeat tests/unit in one process (test-isolation leak guard)
        run: uv run nox -s tests_unit_repeat

  # The Playwright image the browser jobs run in, named by
  # scripts/playwright_version.py from the playwright version locked in
  # uv.lock: the one place that reads the lock and spells the image, so a
  # Dependabot bump of the lock moves the image with it. The helper needs only
  # tomli, so `--no-project` keeps the project out of this job.
  playwright-version:
    name: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.lock.outputs.version }}
      image: ${{ steps.lock.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - id: lock
        run: uv run --no-project --with tomli python scripts/playwright_version.py uv.lock

  # Browser e2e is the flakiest lane — real Playwright engines, timing-
  # sensitive DOM — so nightly re-runs the full 3-engine matrix under
  # pytest-repeat, the same flake-flush unit-matrix does for the hostless
  # suite. Mirrors ci.yml's per-push `dashboard` job (the Playwright image
  # tagged from uv.lock, then the dist built with `make web`), then loops the
  # session with --count.
  dashboard:
    needs: [playwright-version]
    name: dashboard-e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-version.outputs.image }}
      # --ipc=host: Chromium shares memory through /dev/shm, which a container
      # sizes at 64 MB by default; --init reaps the zombie browser processes
      # a test run leaves. Both are Playwright's own guidance for its image.
      options: --ipc=host --init
    env:
      # GitHub mounts /github/home as HOME in a container job, owned by
      # another user than root; Firefox refuses to start as root with such a
      # HOME. Playwright points at HOME=/root, and the job-level env applies
      # before checkout.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.10
      # The image ships git and the browsers (PLAYWRIGHT_BROWSERS_PATH) but
      # not make or jq, which `make web` below needs (jq for
      # scripts/typecheck_web.sh). Only the missing ones are installed. It
      # runs as root: no sudo.
      - name: Install the build tools the Playwright image lacks (make, jq)
        run: missing=""; for tool in make jq; do command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"; done; [ -z "$missing" ] || { apt-get update && apt-get install -y --no-install-recommends $missing; }
      # actions/checkout trusts the workspace (git safe.directory) only in a
      # throwaway HOME. This container runs as root in a workspace the
      # runner's user owns, so without this every later git command refuses
      # the checkout, and `make web`'s `git diff --exit-code a b` silently
      # turns into a --no-index diff of the two files against each other.
      # HOME=/root (above) makes the global config last for every step.
      - name: Trust the checkout for git (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the React dashboard (npm ci + type-drift + air-gap gates)
        run: make web
      - name: Run dashboard browser e2e (${{ matrix.browser }}) ${{ inputs.nox_count || '5' }}x
        env:
          # Per-file browser-suite shard groups — see ci.yml's dashboard job.
          OTTO_BROWSER_SHARD: "1"
        run: >-
          uv run nox -k ${{ matrix.browser }} --
          --count=${{ inputs.nox_count || '5' }} --repeat-scope=session

  # Tier-2 real-signal chaos suite (tests/integration/chaos): real SIGINT/
  # SIGTERM delivered to real otto subprocesses (mid-run host command, login,
  # monitor serve), driven over a throwaway loopback sshd the suite starts
  # and tears down itself (tests/integration/chaos/conftest.py) — no Vagrant
  # VMs, no bed host. ubuntu-latest normally ships sshd already; the install
  # step below is a fallback, not the common path. The monitor-serve
  # scenarios start a real MonitorServer, which refuses to start at all
  # without a built React dashboard (src/otto/monitor/server.py's
  # `_dist_index_path()` — see the `dashboard` job below), so this job
  # builds it first, the same way `dashboard` does, minus any browser
  # install (chaos never opens one). Nightly-only (not ci.yml): it forks a
  # real sshd plus a real otto subprocess per test and waits on
  # timing-sensitive phase markers, so it is slower and marginally noisier
  # than the deterministic gates — the same "non-deterministic lanes only"
  # scope as the rest of this workflow.
  chaos-tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build the React dashboard (npm ci + type-drift + air-gap gates)
        run: make web

      - name: Ensure sshd is available
        run: command -v sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }

      - name: Tier-2 real-signal chaos suite (loopback sshd)
        run: uv run pytest tests/integration/chaos -p no:cacheprovider --no-cov

  # Docker chaos slice (tests/e2e/chaos/test_docker_chaos.py): real `docker
  # kill`/`pause`/`restart`/daemon-restart against a real container, driven
  # library-side (no otto subprocess, no signals) through a throwaway
  # loopback sshd wrapping the runner's OWN docker daemon
  # (OTTO_CHAOS_DOCKER=loopback — tests/e2e/chaos/_docker.py). No monitor
  # scenarios live in this module, so unlike chaos-tier2 this job builds no
  # React dashboard and installs no Node toolchain. Nightly-only: this is a
  # tier-3 chaos module (excluded from every default gate via the `chaos`
  # marker), and the loopback venue is docker-daemon-hostile by nature
  # (kills/restarts a real daemon), so it only runs where that is safe to do
  # — a disposable GitHub runner, never the dev VM or the lab bed.
  chaos-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ensure sshd is available
        run: command -v sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }

      - name: Tier-3 docker chaos (loopback sshd, runner daemon)
        run: OTTO_CHAOS_DOCKER=loopback uv run pytest tests/e2e/chaos/test_docker_chaos.py -p no:cacheprovider --no-cov

  # Host-contract conformance (tests/conformance), HERMETIC venue: otto's
  # exec, transfer and timeout contracts asserted against a seeded sample of
  # the (host, term, transfer) cells this runner can build for itself — the
  # runner's own userland via LocalHost, a throwaway non-root sshd on
  # 127.0.0.1, and the five pinned BusyBox artifacts run as local
  # subprocesses (tests/conformance/_cells.py). No lab, no Vagrant VMs, and
  # that is the point of the venue: these contracts are written to hold on
  # any cell otto can reach, and the hermetic venue is the subset a
  # disposable runner can stand up for itself. The BED venue reaches the real
  # lab hosts instead, and it exists now -- `make conformance-bed` is its
  # lane. It is deliberately absent from CI and must stay absent: there is no
  # test1, no BusyBox guest and no Zephyr console on a GitHub runner, so every
  # cell would fail to open for the one reason that says nothing about otto.
  # tests/unit/test_tier_marker_invariants.py's G11j/G11k are what keep that
  # true, rather than this comment.
  #
  # NIGHTLY RATHER THAN PER-PUSH, and that is a property of the lane rather
  # than an omission: the cells are drawn per run off pytest-randomly's
  # session seed, so a per-PR gate could fail an unrelated PR on pre-existing
  # breakage in a cell nothing had drawn before. Same reason the kernel keeps
  # randconfig in -next rather than per-patch CI
  # (docs/superpowers/specs/2026-08-22-test-strategy-and-unix-lab-rename-design.md §4).
  # A failure here is reproduced with the `--randomly-seed=N` this run prints
  # in its own pytest header — the draw is a pure function of that number.
  #
  # DEFAULT SAMPLE SIZE, so this job sets neither conformance knob. The
  # budget defaults to 8 (tests/conformance/_venue.py) and the hermetic space
  # is one local cell plus the loopback host's (term, transfer) menu plus one
  # cell per pinned BusyBox release the runner can execute — measured at 8 on
  # this project's dev VM, where the draw is therefore the whole space. The
  # run logs `venue=… space=N cells drawn=M seed=S` at session start, so a
  # runner that resolves fewer cells than expected is visible in this job's
  # own log rather than hidden behind a full-sized `drawn=`.
  #
  # Fails today on contract violations only. The matrix-drift condition
  # (spec §4) needs schemas/support_matrix.json, which item 5 (§5) builds;
  # it joins THIS job then. Deliberately not stubbed -- an empty matrix
  # nothing writes would be a check that cannot fail.
  conformance-hermetic:
    runs-on: ubuntu-latest
    # ABOVE the Makefile's LANE_TIMEOUT wrap (2400s) around `make
    # conformance`, plus the sync / sshd / `make busybox-cache` setup ahead of
    # it, so a stall reports through `timeout`'s exit 124 rather than a
    # GitHub cancel. Pinned by tests/unit/test_declared_harness_bounds.py.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The loopback cells start a real sshd as the current user and connect
      # otto's real ssh transport to it. ubuntu-latest normally ships one
      # already; this is the same fallback the chaos jobs above carry, not the
      # common path.
      - name: Ensure sshd is available
        run: command -v sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }

      # Priming, in its own step, for the reason the Makefile splits the two
      # targets: the fetch needs the network and the lane does not. Without
      # this the first drawn BusyBox cell fetches inside the run (the release
      # mirror first, busybox.net behind it), so an outage at both, or a slow
      # host, surfaces as a contract
      # test failing rather than as a named priming step failing. It also
      # verifies each artifact against its committed SHA-256 before any
      # contract executes one.
      #
      # No qemu-user-static here, unlike ci.yml's busybox-artifacts job: this
      # runner is x86_64 and the artifacts are i686/x86_64, so they execute
      # natively (tests/_fixtures/busybox.py's `can_run`). A cell whose arch
      # this machine cannot run is dropped from the SPACE rather than skipped,
      # so an arm64 runner would report a smaller `space=` instead of a green
      # run that asserted nothing.
      - name: Prime the BusyBox artifact cache (fetch + SHA-256 verify)
        run: make busybox-cache

      - name: Host-contract conformance, hermetic venue
        run: make conformance

      # What the run leaves behind, uploaded so a failing nightly can be read
      # without re-running it: the JUnit XML `make conformance` writes, which
      # carries every drawn cell's node id (the cell is the parametrize id) and
      # the failure text for any contract that broke.
      #
      # Spec §5 has a conformance run also emit a per-cell observation record in
      # JSON, and it now does: this lane writes 96 of them into
      # reports/conformance-observations/ (48 contract observations + 48
      # positive-control records). They are NOT uploaded, and that is a
      # decision rather than an oversight.
      #
      # THE MATRIX IS BED-ONLY (ruling 2026-08-24). Its profile axis is built
      # from the bed labs' 16 elements; this job's cells are `local`,
      # `loopback` and five BusyBox artifacts, none of which has a lab entry --
      # `axes_for('local')` raises KeyError -- so every record this lane
      # produces names an element no matrix column holds, and
      # scripts/collate_support_matrix.py discards it by design, loudly.
      # Uploading them would advertise evidence that can populate nothing.
      #
      # So §5's "the collate step also accepts observation artifacts downloaded
      # from the nightly conformance-hermetic job, recording venue:
      # ci-hermetic" is a spec requirement this repo consciously does not meet.
      # `ci-hermetic` stays a legal venue in the schema and no code path
      # produces it. The matrix is refreshed by `make conformance-bed` on the
      # dev VM, which is also where the collate step lives.
      - name: Upload the conformance run's records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-hermetic-records
          path: reports/junit/conformance/
          retention-days: 30

  # UPSTREAM DRIFT DETECTION. The one place in this repo that reads
  # busybox.net's own bytes rather than the `ci-assets-busybox-1` mirror.
  #
  # Reading upstream is the only way to notice a rebuild-in-place: the mirror
  # holds bytes taken from upstream at a reviewed moment, so asking it whether
  # upstream changed would always answer "still matches". The sweep fetches
  # EVERY pinned artifact and verifies each against `busybox_pins.json`, so a
  # mismatch here means the file at the upstream URL is no longer the file
  # those pins were taken from — worth an issue and a look, never worth
  # blocking a push.
  #
  # It ran `make busybox-preflight` until 2026-08-27, and that was wrong in a
  # way that reported green: `preflight()` probes `missing[0]` and returns,
  # because reachability is a property of the SOURCE. Drift is a property of
  # each FILE, so the job hash-compared one of five pins and called it a pass.
  #
  # NIGHTLY AND NOT CI, deliberately. Upstream drift cannot affect a byte this
  # repo tests or ships — every consumer fetches mirror-first and verifies
  # against the same pins — so this is monitoring, not gating. It sat on the
  # push gate as ci.yml's `busybox` job env until 2026-08-26, when a
  # busybox.net outage reddened main for a change that had nothing to do with
  # it. Here a failure opens an issue (this job is in `report-failure`'s
  # `needs` below) and blocks nobody. `tests/unit/host/test_busybox_artifacts.py`
  # pins that this job exists, forces upstream, and is reported.
  #
  # AN UNREACHABLE UPSTREAM IS A WARNING, NOT A FAILURE. A third party being
  # down says nothing about any byte, and failing on it opens a fresh issue
  # every night for as long as the outage lasts — issue #267, three days of
  # it — until the red nightly means nothing and a real regression hides
  # inside it. Only a pin mismatch exits non-zero.
  #
  # No cache, for ci.yml's reason: a cache keyed on the pins would skip the
  # fetch in exactly the runs that could detect a rebuild.
  busybox-upstream-drift:
    name: BusyBox upstream drift (pins vs busybox.net)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OTTO_BUSYBOX_SOURCE: upstream
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Only a SHA-256 mismatch fails this step — upstream replaced a
      # published binary, investigate before anything re-mirrors it. A fetch
      # error (busybox.net down) is annotated as a warning and exits 0. The
      # two used to be told apart by reading the log, which no automated
      # consumer could do: both raised `BusyBoxUnavailableError` with the same
      # exit code. `BusyBoxDriftError` is now the machine-readable half.
      - name: Verify every pin against busybox.net's current bytes
        run: make busybox-drift

  # The next-Python canary. NOT a matrix entry, whether or not it passes:
  # PYTHON_VERSIONS in noxfile.py is the supported window, and this job probes
  # the interpreter one past its ceiling so the day it CAN join the window is
  # noticed rather than discovered. Eleven rungs:
  #
  #   1  runtime dependencies install   (published wheels, or sdists that build)
  #   2  the dev group installs too     (tooling gaps kept apart from runtime ones)
  #   3  otto imports                   (`otto --version`; deprecations-as-errors)
  #   4  the hostless suite collects    (every test module + conftest imports, -n0)
  #   5  the hostless session passes    (nox tests_hostless_unit + _e2e via --extra-python,
  #                                      the import budget aside)
  #   6  the concurrency soak passes    (`make stability-unit`)
  #   7  the chaos suites pass          (tier 2 and the Docker slice)
  #   8  the dashboard browser suite    (Chromium)
  #   9  host-contract conformance      (`make conformance`, hermetic)
  #  10  the import budget holds        (its ceilings are per-interpreter)
  #  11  every binary runtime dependency ships a wheel for it
  #                                     (the air-gap readiness rung: `scripts/
  #                                      check_docs_wheel_matrix.py --minor`)
  #
  # Rungs 1-4 are prerequisites and a failure there stops the climb. From
  # rung 5 on every rung runs even after one fails, so one nightly names every
  # lane the new version breaks; `reached` is the highest CONSECUTIVE rung.
  #
  # The verdict is a RATCHET against CANARY_EXPECTED_RUNG, the rung this repo
  # currently expects the canary to reach. Reaching exactly that rung is green.
  # Reaching a HIGHER one is red: the ecosystem moved, bump the constant. Rung
  # 11 is the top, and reaching it is the PROMOTION signal: the interpreter
  # passes every lane AND an air-gapped lab could install otto on it from
  # wheels alone, so it can join PYTHON_VERSIONS (the checklist on #333).
  # Rung 11 reads the LOCK, so a wheel that lands upstream climbs it only once
  # a lock bump picks the release up. Reaching a LOWER one is red too: something regressed — a
  # wheel pulled, a dependency raising its floor, a commit here that broke the
  # next Python or grew its import budget — and silently resetting the climb is
  # exactly what a plain allowed-to-fail job would do. `continue-on-error` is
  # deliberately absent: both reds are the signal, and both open an issue via
  # report-failure. The step summary carries how far it got and what stopped it.
  #
  # Every rung installs with --frozen: the lock is universal over
  # requires-python, so it already covers the canary interpreter and nothing
  # here should re-resolve.
  #
  # Every plain `uv run` -- the rungs' own and the ones inside `make` -- must
  # run on the canary. uv otherwise takes the project interpreter from
  # `.python-versions`, whose first line is the floor, and silently REBUILDS
  # `.venv` on it: the 2026-09-16 nightly "climbed" to rung 10 with rungs 3,
  # 4 and 6-10 running on 3.10 (#334). The climb exports UV_PYTHON, which
  # outranks the version file, and `rung` fails any rung that leaves `.venv`
  # on another interpreter, so that false climb cannot come back unnoticed.
  python-canary:
    name: Next-Python canary (expected-rung ratchet)
    runs-on: ubuntu-latest
    # The climb reaches `make conformance`, wrapped at the Makefile's
    # LANE_TIMEOUT, and runs every other nightly lane's tests besides — so
    # this bound is well above the sum, and above the wrap plus setup that
    # tests/unit/test_declared_harness_bounds.py pins.
    timeout-minutes: 60
    env:
      # The interpreter one past PYTHON_VERSIONS' ceiling in noxfile.py.
      CANARY_PYTHON: "3.15"
      # The rung the canary is EXPECTED to reach today. 10 = every test lane,
      # first reached on CPython 3.15.2 on x86_64 by this workflow dispatched
      # on the branch that set it (#333). Rung 11 is still red: pyyaml 6.0.3
      # publishes no cp315 wheel, so an air-gap bundle for 3.15 would be
      # incomplete and 3.15 is not promoted. Until it climbs, this job guards
      # the climb: any rung that breaks reds it as "regressed".
      #
      # That includes the import budget: rung 10 reads the 3.15 ceilings, so a
      # commit that grows the budget and regenerates only the supported minors'
      # ceilings reds here.
      # docs/contributing.md ("Regenerate per interpreter") has the command.
      CANARY_EXPECTED_RUNG: "10"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ env.CANARY_PYTHON }}
        run: uv python install "$CANARY_PYTHON"

      # Both chaos rungs drive a real loopback sshd, as their own nightly jobs
      # do. Installed here rather than in a rung: it says nothing about 3.15.
      - name: Ensure sshd is available
        run: command -v sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }

      - name: Install strace (the import budget counts stat syscalls through it)
        run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }

      # tests/unit/cov/test_kmodcov_reader.py builds otto_kmodcov's C with a gcc
      # before 12, the gcc and clang, and reads what each writes with its own
      # gcov; the runner image may lack gcc-11, clang or llvm-cov.
      - name: Install gcc-11, clang and llvm-cov (the kmodcov reader tests)
        run: command -v gcc-11 && command -v clang && command -v llvm-cov || { sudo apt-get update && sudo apt-get install -y gcc-11 clang llvm; }

      - name: Climb the rungs and compare with the expected one
        run: |
          set -u
          # See the job comment: without this every plain `uv run` rebuilds
          # `.venv` on the first line of `.python-versions`.
          export UV_PYTHON="$CANARY_PYTHON"
          reached=0
          climbing=1
          echo "## Next-Python canary: $CANARY_PYTHON" >> "$GITHUB_STEP_SUMMARY"

          # rung <n> <label> <command...>: run it, record the rung on success,
          # append the log tail to the step summary on failure. `reached`
          # advances only while nothing has failed yet, so it stays the highest
          # CONSECUTIVE rung even though every test rung below runs.
          #
          # A rung passes only if `.venv` still runs the canary afterwards: a
          # green rung on another interpreter says nothing about this one.
          rung() {
            n=$1; label=$2; shift 2
            echo "::group::rung $n — $label"
            status=0
            "$@" > "rung$n.log" 2>&1 || status=$?
            ran_on=$(.venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>&1 || true)
            if [ "$status" -eq 0 ] && [ "$ran_on" != "$CANARY_PYTHON" ]; then
              echo "rung $n passed, but .venv now runs Python $ran_on, not $CANARY_PYTHON" >> "rung$n.log"
              status=1
            fi
            if [ "$status" -eq 0 ]; then
              if [ "$climbing" -eq 1 ]; then reached=$n; fi
              echo "rung $n PASS — $label" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              return 0
            fi
            climbing=0
            cat "rung$n.log"
            echo "::endgroup::"
            {
              echo "rung $n FAIL — $label"
              echo
              echo '```'
              tail -n 30 "rung$n.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          hostless_marker='not integration and not embedded and not stability and not browser and not busybox and not conformance'
          # Mirrors noxfile.py's DASHBOARD_MARKER_EXPR. The nox `dashboard`
          # session is pinned to PRIMARY_PYTHON, so this rung cannot go through
          # it and spells the same selection itself.
          dashboard_marker='browser and not soak'

          # Lanes that take more than one command, as functions, so `rung` can
          # run each as a single command and log it as one rung.
          canary_web() {
            # A real MonitorServer refuses to start without a built dashboard,
            # and the browser suites drive the built bundles.
            [ -f src/otto/_webassets/monitor/dist/index.html ] || make web
          }
          canary_chaos() {
            canary_web &&
            uv run --frozen pytest tests/integration/chaos -p no:cacheprovider --no-cov &&
            OTTO_CHAOS_DOCKER=loopback uv run --frozen pytest tests/e2e/chaos/test_docker_chaos.py -p no:cacheprovider --no-cov
          }
          canary_dashboard() {
            canary_web &&
            scripts/ci_drop_unused_apt_sources.sh &&
            uv run --frozen --group dev playwright install --with-deps chromium &&
            OTTO_BROWSER_SHARD=1 uv run --frozen pytest tests/e2e/monitor/dashboard tests/e2e/cov/report_browser -m "$dashboard_marker" --browser chromium -p no:cacheprovider --no-cov
          }
          canary_conformance() {
            make busybox-cache && make conformance
          }

          # THE PREREQUISITE RUNGS. Nothing below can run without them, so a
          # failure here stops the climb. The `if` is load bearing: the step
          # shell is `bash -e`, and errexit does not fire inside an `if`
          # condition, so a failing rung still reaches the verdict below.
          if rung 1 "runtime dependencies install" uv sync --frozen --no-default-groups --no-install-project --python "$CANARY_PYTHON" &&
             rung 2 "the dev group installs too" uv sync --frozen --group dev --python "$CANARY_PYTHON" &&
             rung 3 "otto imports" uv run --frozen otto --version &&
             rung 4 "the hostless suite collects" uv run --frozen pytest --collect-only -q -n0 -p no:cacheprovider tests/unit tests/e2e -m "$hostless_marker"; then
            # THE TEST RUNGS, cheapest first, and every one runs even after a
            # failure: one nightly then names every lane 3.15 breaks rather
            # than only the first. The budget is last by design -- its ceilings
            # are per-interpreter, so a next Python's ceilings file is written
            # late, and its absence must not hide a product failure (#333).
            rung 5 "the hostless session passes (budget aside)" uv run --frozen nox -s "tests_hostless_unit-$CANARY_PYTHON" "tests_hostless_e2e-$CANARY_PYTHON" --extra-python "$CANARY_PYTHON" -- --ignore=tests/unit/import_budget || true
            rung 6 "the concurrency soak passes" make stability-unit COUNT=10 || true
            rung 7 "the chaos suites pass" canary_chaos || true
            rung 8 "the dashboard browser suite passes" canary_dashboard || true
            rung 9 "host-contract conformance passes" canary_conformance || true
            rung 10 "the import budget holds (ceilings are per-interpreter)" uv run --frozen pytest tests/unit/import_budget -p no:cacheprovider --no-cov || true
            rung 11 "every binary runtime dependency ships a wheel for it (air-gap readiness)" uv run --frozen python scripts/check_docs_wheel_matrix.py --minor "$CANARY_PYTHON" || true
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo "**Reached rung $reached; expected rung $CANARY_EXPECTED_RUNG.**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$reached" -gt "$CANARY_EXPECTED_RUNG" ]; then
            echo "::error::Python $CANARY_PYTHON climbed to rung $reached (expected $CANARY_EXPECTED_RUNG): bump CANARY_EXPECTED_RUNG in nightly.yml (and tick the checklist on #333); at rung 11, promote it into PYTHON_VERSIONS"
            exit 1
          fi
          if [ "$reached" -lt "$CANARY_EXPECTED_RUNG" ]; then
            echo "::error::Python $CANARY_PYTHON regressed to rung $reached (expected $CANARY_EXPECTED_RUNG): see the step summary for what stopped it"
            exit 1
          fi
          echo "Python $CANARY_PYTHON reached rung $reached, as expected."

  # The dashboard soak is a stability lane, so it is never a gate lane
  # (docs/contributing.md's stability-lanes rule); nightly runs it once, in a
  # browser, so a regression surfaces without waiting for a release campaign.
  dashboard-soak:
    needs: [playwright-version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.playwright-version.outputs.image }}
      # --ipc=host: Chromium shares memory through /dev/shm, which a container
      # sizes at 64 MB by default; --init reaps the zombie browser processes
      # a test run leaves. Both are Playwright's own guidance for its image.
      options: --ipc=host --init
    env:
      # GitHub mounts /github/home as HOME in a container job, owned by
      # another user than root; Firefox refuses to start as root with such a
      # HOME. Playwright points at HOME=/root, and the job-level env applies
      # before checkout.
      HOME: /root
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The image ships git and the browsers (PLAYWRIGHT_BROWSERS_PATH) but
      # not make or jq, which `make web` below needs (jq for
      # scripts/typecheck_web.sh). Only the missing ones are installed. It
      # runs as root: no sudo.
      - name: Install the build tools the Playwright image lacks (make, jq)
        run: missing=""; for tool in make jq; do command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"; done; [ -z "$missing" ] || { apt-get update && apt-get install -y --no-install-recommends $missing; }
      # actions/checkout trusts the workspace (git safe.directory) only in a
      # throwaway HOME. This container runs as root in a workspace the
      # runner's user owns, so without this every later git command refuses
      # the checkout, and `make web`'s `git diff --exit-code a b` silently
      # turns into a --no-index diff of the two files against each other.
      # HOME=/root (above) makes the global config last for every step.
      - name: Trust the checkout for git (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the React dashboard (npm ci + type-drift + air-gap gates)
        run: make web

      # No browser install: the Playwright image already carries Chromium.
      - name: Dashboard soak
        run: make dashboard-soak

  # The every-offset probe-line cut sweep (#853; why a deterministic lane is
  # here: the header). Hostless: no lab, no bed lease. zsh, ksh, mksh and
  # BusyBox join the runner's sh, bash and dash so the sweep covers the shell
  # matrix of tests/_fixtures/interactive_shell.py; a shell the runner lacks
  # is left out of the matrix, never skipped, so its absence shows in the
  # test ids. 16 workers: each case mostly waits on the probe interval.
  probe-cut-sweep:
    runs-on: ubuntu-latest
    # ABOVE the Makefile's LANE_TIMEOUT wrap (2400s) around `make
    # stability-cut-sweep`, plus the sync and apt setup ahead of it, so a
    # stall reports through `timeout`'s exit 124 rather than a GitHub cancel.
    # Pinned by tests/unit/test_declared_harness_bounds.py.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install the interactive shells of the matrix (zsh, ksh, mksh, BusyBox)
        run: sudo apt-get update && sudo apt-get install -y zsh ksh mksh busybox

      - name: Probe-line cut sweep, every offset, every shell
        run: make stability-cut-sweep CUT_SWEEP_WORKERS=16

      # The JUnit XML names every failing case by shell, line, history,
      # nounset and offset, so a red night is readable without a rerun.
      - name: Upload the sweep's JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-cut-sweep-junit
          path: reports/junit/stability-cut-sweep/
          retention-days: 30

  # If any job fails, open (or update) a tracking issue so a flaky nightly
  # surfaces without anyone having to watch the Actions tab.
  report-failure:
    name: Open issue on failure
    needs:
      [
        playwright-version,
        stability-matrix,
        unit-matrix,
        unit-repeat,
        dashboard,
        dashboard-soak,
        chaos-tier2,
        chaos-docker,
        conformance-hermetic,
        busybox-upstream-drift,
        python-canary,
        probe-cut-sweep,
      ]
    # Only a run on main files an issue, the same condition as ci.yml's
    # reporter: a workflow_dispatch on a branch is someone's experiment, and its
    # result is in the run they started.
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write issue body
        run: |
          {
            echo "The nightly run failed (stability, unit matrix, the test-isolation repeat, dashboard browser e2e, the dashboard soak, the tier-2/tier-3 chaos suites, host-contract conformance, BusyBox upstream drift, the probe-line cut sweep, and/or the next-Python canary moving off its expected rung)."
            echo
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "Check the matrix logs for the failing job (stability-matrix /"
            echo "playwright-version / unit-matrix / unit-repeat / dashboard / dashboard-soak / chaos-tier2 / chaos-docker /"
            echo "conformance-hermetic / busybox-upstream-drift / python-canary / probe-cut-sweep),"
            echo "the Python version or browser, and the pytest-repeat iteration that"
            echo "tripped the failure. A conformance-hermetic failure names the"
            echo "cell it drew in the test id; reproduce it with the"
            echo "--randomly-seed=N printed in that job's own pytest header. A"
            echo "probe-cut-sweep failure is deterministic: its test id names the"
            echo "shell, line, history, nounset and offset; rerun that one case."
            echo
            echo "**busybox-upstream-drift is not a test failure.** It reads"
            echo "busybox.net directly, and it fails ONLY when upstream has"
            echo "republished a pinned artifact — the bytes at the URL are no"
            echo "longer the bytes busybox_pins.json was taken from. Nothing"
            echo "this repo tests or ships changed (every consuming lane"
            echo "fetches the ci-assets-busybox-1 mirror and verifies against"
            echo "those same pins), but investigate before anything re-mirrors"
            echo "them: confirm the banner still reports the pinned version and"
            echo "the applet set is unchanged, then update busybox_pins.json in"
            echo "a reviewed commit. An unreachable busybox.net does NOT fail"
            echo "this job; it is annotated as a warning on a green run."
            echo
            echo "**python-canary may not be a failure on a supported Python.** It"
            echo "is red when the next Python's climb stops on a rung other than"
            echo "CANARY_EXPECTED_RUNG: higher means the ecosystem moved (bump the"
            echo "constant), lower means a wheel was pulled, a floor was raised, or"
            echo "a commit here broke that Python or grew its import budget. The"
            echo "job's step summary records the rung reached and what stopped it."
          } > issue-body.md

      - name: Create issue from file
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Nightly run failed"
          content-filepath: issue-body.md
          labels: stability, ci
