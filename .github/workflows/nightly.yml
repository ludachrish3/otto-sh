name: Nightly

# Nightly flake-flush: re-runs otto's NON-DETERMINISTIC lanes at high
# iteration count to catch timing/order races a single push run can miss —
# the SessionManager concurrency + telnet-deadlock stability tests, the
# hostless unit matrix under pytest-repeat, and the 3-engine browser e2e.
# Also runs the tier-2 real-signal chaos suite (tests/integration/chaos) once
# per night, against a throwaway loopback sshd the suite starts and tears
# down itself — real SIGINT/SIGTERM against real otto subprocesses, still no
# Vagrant VMs in GHA. Also runs the tier-3 docker chaos slice
# (tests/e2e/chaos/test_docker_chaos.py) once per night, over the same kind
# of loopback sshd but wrapping the RUNNER's own docker daemon
# (OTTO_CHAOS_DOCKER=loopback) rather than a bed host — real `docker
# kill`/`pause`/`restart`/daemon-restart, safe only on a disposable runner.
# The manager interleaving above still runs via FakeSession (mocked
# transports); the VM-dependent Python tiers are still out.
#
# Deterministic gates (lint-python, typecheck-python, check-ts, docs) are
# deliberately NOT duplicated here — they run on every push in ci.yml and
# produce the same result each time, so a nightly rerun adds no signal. Only
# lanes that can actually flake belong in this workflow.
on:
  schedule:
    # Nightly at 06:00 UTC. cron is in UTC regardless of repo timezone.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'pytest-repeat iteration count (stability tests)'
        required: false
        default: '100'
      nox_count:
        description: 'pytest-repeat iteration count (nox unit matrix + dashboard e2e)'
        required: false
        default: '5'

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NO_COLOR: "1"
  TERM: dumb
  FORCE_COLOR: ""
  CLICOLOR_FORCE: ""
  PY_COLORS: ""
  CLICOLOR: ""

jobs:
  stability-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit stability tests
        run: make stability-unit COUNT=${{ inputs.count || '100' }}

  # Re-run the no-testbed CI gate matrix several times under pytest-repeat to
  # flush flakes anywhere in the suite (not just the stability tests). Mirrors
  # the CI `tests_hostless` job but loops each session with --count via
  # pytest-repeat.
  unit-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run nox unit tests ${{ inputs.nox_count || '5' }}x
        run: >-
          uv run nox -s tests_hostless-${{ matrix.python-version }} --
          --count=${{ inputs.nox_count || '5' }} --repeat-scope=session

  # Browser e2e is the flakiest lane — real Playwright engines, timing-
  # sensitive DOM — so nightly re-runs the full 3-engine matrix under
  # pytest-repeat, the same flake-flush unit-matrix does for the hostless
  # suite. Mirrors ci.yml's per-push `dashboard` job (build the dist with
  # `make web`, install just this engine's system libs), then loops the
  # session with --count.
  dashboard:
    name: dashboard-e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv python install 3.10
      - name: Build the React dashboard (npm ci + type-drift + air-gap gates)
        run: make web
      - name: Install ${{ matrix.browser }} with system dependencies
        run: |
          scripts/ci_drop_unused_apt_sources.sh
          uv run --group dev playwright install --with-deps ${{ matrix.browser }}
      - name: Run dashboard browser e2e (${{ matrix.browser }}) ${{ inputs.nox_count || '5' }}x
        env:
          # Per-file browser-suite shard groups — see ci.yml's dashboard job.
          OTTO_BROWSER_SHARD: "1"
        run: >-
          uv run nox -k ${{ matrix.browser }} --
          --count=${{ inputs.nox_count || '5' }} --repeat-scope=session

  # Tier-2 real-signal chaos suite (tests/integration/chaos): real SIGINT/
  # SIGTERM delivered to real otto subprocesses (mid-run host command, login,
  # monitor serve), driven over a throwaway loopback sshd the suite starts
  # and tears down itself (tests/integration/chaos/conftest.py) — no Vagrant
  # VMs, no bed host. ubuntu-latest normally ships sshd already; the install
  # step below is a fallback, not the common path. The monitor-serve
  # scenarios start a real MonitorServer, which refuses to start at all
  # without a built React dashboard (src/otto/monitor/server.py's
  # `_dist_index_path()` — see the `dashboard` job below), so this job
  # builds it first, the same way `dashboard` does, minus any browser
  # install (chaos never opens one). Nightly-only (not ci.yml): it forks a
  # real sshd plus a real otto subprocess per test and waits on
  # timing-sensitive phase markers, so it is slower and marginally noisier
  # than the deterministic gates — the same "non-deterministic lanes only"
  # scope as the rest of this workflow.
  chaos-tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build the React dashboard (npm ci + type-drift + air-gap gates)
        run: make web

      - name: Ensure sshd is available
        run: command -v sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }

      - name: Tier-2 real-signal chaos suite (loopback sshd)
        run: uv run pytest tests/integration/chaos -p no:cacheprovider --no-cov

  # Docker chaos slice (tests/e2e/chaos/test_docker_chaos.py): real `docker
  # kill`/`pause`/`restart`/daemon-restart against a real container, driven
  # library-side (no otto subprocess, no signals) through a throwaway
  # loopback sshd wrapping the runner's OWN docker daemon
  # (OTTO_CHAOS_DOCKER=loopback — tests/e2e/chaos/_docker.py). No monitor
  # scenarios live in this module, so unlike chaos-tier2 this job builds no
  # React dashboard and installs no Node toolchain. Nightly-only: this is a
  # tier-3 chaos module (excluded from every default gate via the `chaos`
  # marker), and the loopback venue is docker-daemon-hostile by nature
  # (kills/restarts a real daemon), so it only runs where that is safe to do
  # — a disposable GitHub runner, never the dev VM or the lab bed.
  chaos-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ensure sshd is available
        run: command -v sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }

      - name: Tier-3 docker chaos (loopback sshd, runner daemon)
        run: OTTO_CHAOS_DOCKER=loopback uv run pytest tests/e2e/chaos/test_docker_chaos.py -p no:cacheprovider --no-cov

  # If any matrix cell fails, open (or update) a tracking issue so a flaky
  # nightly surfaces without anyone having to watch the Actions tab.
  report-failure:
    name: Open issue on failure
    needs: [stability-matrix, unit-matrix, dashboard, chaos-tier2, chaos-docker]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write issue body
        run: |
          {
            echo "The nightly run failed (stability, unit matrix, dashboard browser e2e, and/or the tier-2/tier-3 chaos suites)."
            echo
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "Check the matrix logs for the failing job (stability /"
            echo "unit-matrix / dashboard / chaos-tier2 / chaos-docker), the"
            echo "Python version or browser, and the pytest-repeat iteration"
            echo "that tripped the failure."
          } > issue-body.md

      - name: Create issue from file
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Nightly run failed"
          content-filepath: issue-body.md
          labels: stability, ci
