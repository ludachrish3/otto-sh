name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Force Rich/typer to render help and error output without ANSI styling.
  # GitHub-Actions runners set PY_COLORS/FORCE_COLOR, which makes Rich emit
  # bold/dim SGR codes that split flag names like '--region' across escapes
  # and break substring assertions in tests.
  NO_COLOR: "1"
  TERM: dumb
  FORCE_COLOR: ""
  CLICOLOR_FORCE: ""
  PY_COLORS: ""
  CLICOLOR: ""

jobs:
  tests:
    name: tests_hostless-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run tests under Python ${{ matrix.python }}
        run: uv run nox -s tests_hostless-${{ matrix.python }}

  # Repeat the whole tests/unit tree twice in one process to catch tests that
  # leak process-global state — registry singletons (INSTRUCTIONS, LOADER_CLASSES,
  # CLI_COMMANDS, SUITES), tmp-path imports, or otto.cli.* module identity. Such a
  # leak passes the single-pass `tests` job above but breaks on the second run, so
  # it only ever surfaced in the nightly `--count` matrix — days after landing
  # (issue #108). This fast, no-VM, single-Python job moves that guard onto the
  # pre-merge fast path. It is kept separate from `tests` because it needs no
  # Python matrix and the tests_unit_repeat session clears addopts to run
  # single-process (under -n auto the repeats scatter across workers and mask
  # cross-module leaks).
  unit-repeat:
    name: unit-repeat (test-isolation guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Repeat tests/unit in one process (test-isolation leak guard)
        run: uv run nox -s tests_unit_repeat

  # One parallel job per browser engine (Blink/Gecko/Safari) — the nox
  # `dashboard` session is parametrized by browser, and this matrix runs each
  # variant on its own runner so wall-clock is a single engine's runtime, not
  # three back-to-back. fail-fast: false so one engine's failure doesn't cancel
  # the others (you want to see all engine results). The Safari-specific test
  # is @only_browser("webkit"), so it runs only in the webkit leg and skips on
  # the others.
  dashboard:
    name: dashboard-e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.10
      # Post-cutover, the browser suite exercises the built React dashboard
      # (src/otto/_webassets/monitor/dist/) through a real MonitorServer — there
      # is no legacy static fallback anymore, so `dist/` must exist before
      # the pytest steps below run. The nox session can't build it itself
      # (its venv is Python-only — see the `dashboard` session docstring), so
      # the build stays here. `make web` also re-runs the type-drift gate
      # (web/src/api/types.gen.ts vs. the live pydantic models) and the
      # air-gap grep, so a wire-contract or CDN-URL regression fails here
      # rather than surfacing later as a flaky e2e test. It pulls in npm ci
      # on its own via the node_modules stamp — no separate install step.
      - name: Build the React dashboard (npm ci + type-drift + air-gap gates)
        run: make web
      # Unit tests + coverage run in the dedicated check-ts job; this job
      # builds the dashboard purely for the browser e2e that follows. Install
      # only this leg's engine (+ its system libs). --with-deps runs apt-get
      # update, which refreshes every source on the runner image — including a
      # Google Chrome repo we never use — so a mirror sync there can fail this
      # step before a single test runs (issue #129). Drop it first.
      - name: Install ${{ matrix.browser }} with system dependencies
        run: |
          scripts/ci_drop_unused_apt_sources.sh
          uv run --group dev playwright install --with-deps ${{ matrix.browser }}
      - name: Run dashboard browser e2e (${{ matrix.browser }})
        env:
          # Per-file xdist groups for the audited browser suites (see
          # tests/e2e/conftest.py's grouping policy): the repo-wide `-n auto`
          # then shards modules across the runner's workers. Never set on the
          # 3GB dev VM — `make dashboard` stays -n 1 serial there.
          OTTO_BROWSER_SHARD: "1"
        run: uv run nox -k ${{ matrix.browser }}

  # The BusyBox artifact tier. Every default lane excludes `-m busybox`
  # (tests/unit/test_tier_marker_invariants.py G8), so without this job the
  # whole tier — five behavioural assertions, and everything later BusyBox
  # work hangs off — runs nowhere but a developer's terminal.
  #
  # No qemu here, deliberately. The artifacts are x86 userland and
  # ubuntu-latest is x86_64, so it executes them natively; the dev VM's
  # qemu-user-static (see docs/guide/hosts/busybox.md) is an aarch64
  # workaround, not a requirement of the tier. That also means CI is the
  # reference environment for these bytes and the dev VM is the emulated one.
  #
  # THE ARTIFACT CACHE IS DELIBERATELY NOT CACHED. Upstream publishes no
  # signatures, so trust rests on a committed SHA-256 whose entire stated
  # value is that "CI re-fetches on every cold cache" — the pin converts
  # per-run trust in busybox.net into one-time trust taken at a reviewed
  # moment. An actions/cache keyed on busybox_pins.json would only ever miss
  # when the pins change, i.e. it would skip the fetch in exactly the runs
  # that could detect upstream having rebuilt an artifact in place. Caching
  # here would keep the pin file and delete the event it exists to check. The
  # cost accepted in exchange is real and worth naming: ~5 MB over five
  # requests per run, and a busybox.net outage reds this job.
  #
  # Invokes the Makefile lane rather than re-listing its pytest invocation,
  # for the same reason check-ts does (see that job): a CI job that copies a
  # gate's steps is a second copy of that gate, and it drifts. G8c pins that
  # this job invokes the lane G8b requires to exist.
  #
  # TWO ARCHITECTURES, AND THE DISAGREEMENT IS THE SIGNAL.
  #
  # The dev VM is aarch64, so its i686/x86_64 artifact rows run under
  # qemu-user; this job's x86_64 leg runs them natively. That is not a
  # cosmetic difference. qemu-user INTERCEPTS `/proc/self/exe` and answers it
  # from its own knowledge of the guest binary — measured inside a chroot with
  # no /proc mounted at all, `readlink /proc/self/exe` returns `/bin/busybox`,
  # rc=0, which no real kernel would ever do. BusyBox `--install -s` resolves
  # its own path that way, so under emulation it bakes a working symlink
  # target and natively (1.16.1) it bakes a dangling one. That divergence
  # reached `main` twice as a red CI run nothing local could reproduce
  # (issues #227 and #228).
  #
  # So the tier now runs on BOTH: native x86_64 here, and emulated on arm64
  # the way a developer's machine sees it. Neither leg is the reference — the
  # point is that a behaviour which depends on being emulated shows up as the
  # two legs disagreeing, on the push that introduces it, instead of as a
  # local green and a remote red. `fail-fast: false` for exactly that reason:
  # cancelling the second leg when the first fails would throw away the
  # comparison this job exists to make.
  #
  # This is the cheap half of the fix. The durable half is that the harness no
  # longer trusts environment-sensitive values it can derive itself — see
  # `_install_applets` in tests/_fixtures/busybox_rootfs.py.
  busybox:
    name: busybox-artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.10
      # The system row (BusyBox 1.36.1) resolves `busybox` via shutil.which and
      # SKIPS when it is absent — and the runner image does not carry it. The
      # `busybox` binary at /usr/bin/busybox comes from `busybox-static`, which
      # is not in the ubuntu-latest manifest; the routinely-present
      # `busybox-initramfs` installs to /usr/lib/initramfs-tools/bin/busybox, a
      # path `which` never sees. So without this the matrix runs 20 of 23 and
      # the one DISTRO-PACKAGED build silently runs nowhere but a developer's
      # machine.
      #
      # That row is worth the two seconds precisely because it is the entry
      # that can diverge through PACKAGING rather than through upstream
      # version — the "build config matters as much as version" case the whole
      # userland layer is built on (docs/superpowers/specs/2026-08-11-busybox-host-support-design.md).
      # It is also the only row served from the distro rather than fetched from
      # busybox.net, so it stays green through a busybox.net outage.
      - name: Install the distro BusyBox so the system row runs rather than skips
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: Register qemu-user handlers, so the x86 rows can run on arm64
        if: matrix.arch == 'arm64'
        # Every row in the matrix is an x86 binary, so on this leg NOTHING runs
        # without a binfmt handler. `require_interpreter` already fails with a
        # named error rather than skipping, but it fails once per test; this
        # fails once, here, where the cause is a missing package rather than a
        # missing artifact.
        #
        # Both handlers are checked, not just one: the matrix has i686 rows and
        # x86_64 rows, and a leg that registered only `qemu-x86_64` would run
        # three rows and fail two with an error about the artifacts.
        run: |
          sudo apt-get install -y qemu-user-static
          for handler in qemu-i386 qemu-x86_64; do
            [ -e "/proc/sys/fs/binfmt_misc/$handler" ] \
              || { echo "::error::$handler binfmt handler is not registered; the x86 artifact rows cannot execute on this arm64 runner"; exit 1; }
          done
      - name: Install dropbear, for the BusyBox Tier 3 ssh tier
        # Tier 3 logs into the Tier 2 BusyBox root over real ssh, against a
        # throwaway rootless dropbear on loopback. BOTH legs need it: the tier
        # runs wherever `make busybox` runs.
        #
        # `dropbear-bin`, not `dropbear` and not `dropbear-run` — measured on
        # 2022.83-4: `-bin` ships only the binaries (dropbear, dbclient,
        # dropbearkey, dropbearconvert) and registers NO service, so
        # `systemctl is-enabled dropbear` reports `not-found` after install
        # and this step leaves nothing listening on the runner. The tier
        # starts its own foreground daemon on 127.0.0.1 at an ephemeral port
        # and reaps it. The package is in `universe` and is NOT preinstalled
        # on the runner images (measured), so this line is doing real work.
        #
        # No `apt-get update` here, matching the qemu step above: the
        # busybox-static step refreshed the index already, and a stale index
        # is what makes an install 404 on the .deb and read like the package
        # does not exist.
        #
        # NO VERIFICATION LINE, unlike the two steps either side of this one,
        # and the asymmetry is deliberate rather than an omission. Those two
        # verify a CAPABILITY that installing a package does not guarantee (a
        # registered binfmt handler; a uid_map write the kernel may refuse).
        # This one has nothing of that kind to check, and the tier's own
        # `test_the_provisioned_host_has_the_dropbear_tier3_needs` runs in
        # THIS lane and fails by name with the apt line if the paths are not
        # where `tests/_fixtures/busybox_dropbear.py` says they are. Re-doing
        # that in shell here would be a second copy of a gate, which is the
        # thing this job's own header warns drifts.
        run: sudo apt-get install -y dropbear-bin
      - name: Allow unprivileged user namespaces, for the BusyBox rootfs tier
        # The tier chroots into a BusyBox-only root from an unprivileged user
        # namespace. Ubuntu 24.04 ships
        # kernel.apparmor_restrict_unprivileged_userns=1, which permits creating
        # a namespace but denies the uid_map write that maps you to uid 0 —
        # leaving no CAP_SYS_CHROOT and no chroot.
        #
        # The existence test is not defensive mush: A MISSING KNOB IS NOT A
        # MISSING CAPABILITY. `sysctl -w` exits non-zero on an image without
        # that key and steps run under `bash -e`, so writing it unconditionally
        # reds the job on precisely the images where the tier would have worked
        # fine. `ubuntu-latest` is 24.04 and has it today, but that pin moves.
        #
        # The verification line carries no `|| true` on purpose, and that
        # asymmetry is the whole point: the capability is what we require, so
        # that is what fails the job. A runner that cannot map to uid 0 must
        # stop here with a reason, not skip the tier into a green report.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -r id -u | grep -qx 0 \
            || { echo "::error::unshare -r cannot map to uid 0 on this runner; the BusyBox rootfs tier cannot build a root"; exit 1; }
      - name: Fetch, verify and run the BusyBox artifact matrix (cold cache)
        run: make busybox

  # web/ TypeScript quality gates — the TS analogue of the lint-python /
  # typecheck-python jobs (those run Python-only nox sessions; this is where
  # Biome/knip/tsc live). Node-only: no Python, no browsers, no dashboard
  # build, so it runs fast and in parallel. Both targets take the node_modules
  # stamp as a prerequisite, so they run npm ci themselves — no explicit
  # install step.
  #
  # TWO GATES, NOT A RE-LISTED UMBRELLA: this job invokes `check-ts` (Biome +
  # knip + tsc) and `coverage-ts-unit` (vitest unit floor) — the two TS gates
  # that can run without browsers. It deliberately does NOT re-enumerate any
  # gate's INTERNALS: a CI job that copies a gate's steps is a second copy of
  # that gate, and it will drift (unsorted imports once sat on main this way).
  # The third TS gate — the merged e2e coverage report (`coverage-ts`) — needs
  # the Playwright browser lane and runs locally via `make coverage`/release,
  # mirroring how the Python 95-gate is local-only while CI gates hostless.
  # `tests/unit/test_ci_web_gate.py` pins this. (The job is named `check-ts`
  # after its headline gate; it also runs the vitest unit floor.)
  check-ts:
    name: check-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: web/ static gates (Biome check + tsc) + vitest unit coverage floor
        run: make check-ts coverage-ts-unit

  # Python static gates. Named -python because they run Python-only nox
  # sessions (ruff / ty); the TS analogues live in the `check-ts` job above.
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.10
      - run: uv run nox -s lint

  typecheck-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.10
      - run: uv run nox -s typecheck

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # graphviz `dot` renders the architecture-docs diagrams. ubuntu-latest
      # images currently preinstall it, but that set is not contractual —
      # install explicitly so the docs gate never depends on image contents.
      - run: sudo apt-get install -y graphviz
      - run: uv python install 3.10
      # scripts/capture_docs_media.py (hooked from docs/conf.py, every HTML
      # build) drives a real MonitorServer to screenshot the dashboard —
      # post-cutover that server refuses to start without a built React
      # dashboard, so `dist/` must exist before `nox -s docs` runs. Building
      # it here (rather than falling back to OTTO_DOCS_MEDIA=placeholder)
      # keeps this gate an honest rehearsal of what Read the Docs' own build
      # does (see .readthedocs.yaml) — placeholder mode stays reserved for
      # its documented emergency case (e.g. a broken Chromium install), not
      # routine CI. `make docs` encodes this same dist prerequisite for local
      # builds; the step stays explicit here because CI runs the nox session,
      # whose Python-only venv can't build the frontend. `make web` runs npm
      # ci itself via the node_modules stamp — no separate install step.
      - name: Build the React dashboard (needed by capture_docs_media.py)
        run: make web
      # Headless Chromium captures the build-time GUI media (screenshots)
      # via scripts/capture_docs_media.py, hooked from docs/conf.py.
      # --with-deps also apt-installs the browser's runtime libraries, so this
      # job carries the same third-party-apt-source exposure as dashboard-e2e
      # (issue #129) and takes the same guard.
      - run: |
          scripts/ci_drop_unused_apt_sources.sh
          uv run playwright install --with-deps chromium
      - run: uv run nox -s docs

  # If any job above fails on a push to main, open (or update) a tracking
  # issue so a broken main surfaces without anyone having to watch the
  # Actions tab. Skipped for pull_request — PR failures are already visible
  # to the PR author in the checks UI.
  report-failure:
    name: Open issue on failure
    needs: [lint-python, tests, unit-repeat, dashboard, busybox, check-ts, typecheck-python, docs]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write issue body
        run: |
          {
            echo "A CI run on \`main\` failed."
            echo
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "Check the job logs to see which of lint-python / tests / unit-repeat / dashboard / busybox / check-ts / typecheck-python / docs failed."
          } > issue-body.md

      - name: Create issue from file
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "CI failed on main"
          content-filepath: issue-body.md
          labels: ci
