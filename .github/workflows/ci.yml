name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Force Rich/typer to render help and error output without ANSI styling.
  # GitHub-Actions runners set PY_COLORS/FORCE_COLOR, which makes Rich emit
  # bold/dim SGR codes that split flag names like '--region' across escapes
  # and break substring assertions in tests.
  #
  # THE "" BELOW ARE STILL SET. GitHub Actions has no way to unset an inherited
  # variable, so the only way to neutralise a runner-provided FORCE_COLOR here
  # is to assign it the empty string -- and a consumer that asks "is it set?"
  # rather than "is it truthy?" then reads that as YES. Node is one: its
  # tty.getColorDepth() tests `env.FORCE_COLOR !== undefined`, so an empty
  # FORCE_COLOR makes it emit colour, IGNORE the NO_COLOR above, and warn
  #   Warning: The 'NO_COLOR' env is ignored due to the 'FORCE_COLOR' env being set.
  # on stderr. That warning failed five jobs' web build step (#387) under the
  # any-stderr web gates, and the NO_COLOR above was not taking effect either.
  #
  # So the empties are dropped on OUR side of the boundary, before any child
  # starts: the Makefile unexports them for every recipe, and
  # scripts/build_web_no_warnings.sh, scripts/gen_web_types.sh and
  # scripts/typecheck_web.sh unset them for a direct (Read the Docs, human)
  # call. tests/unit/test_ci_color_env.py reads the empty-valued names out of
  # THIS block and fails if any of them is not covered there -- so adding a
  # variable here with a "" value means adding it to that sanitation too.
  NO_COLOR: "1"
  TERM: dumb
  FORCE_COLOR: ""
  CLICOLOR_FORCE: ""
  PY_COLORS: ""
  CLICOLOR: ""

jobs:
  # CI's first job, and every other job needs it. It runs on every event so
  # that `needs:` is satisfiable everywhere, but only a pull request polls: the
  # local gate posts the `local-gate` status for the head it gated, and a head
  # nobody gated is refused here before any validation job spends a runner. A
  # push to main has no pull request to admit (the ruleset judged its PR).
  #
  # A Dependabot pull request is admitted without the wait. Its head is a bump
  # nobody has gated yet, and CI's verdict on it is the point: the maintainer
  # gates and lands it once the hostless lanes say it is worth a bed run
  # ("Dependency updates" in docs/contributing.md). The ruleset still requires
  # the `local-gate` status, so nothing Dependabot opens merges ungated, a
  # maintainer's fix commits pushed onto its branch included. The test reads
  # the pull request's AUTHOR, never github.actor, which names whoever
  # triggered the event. AWAIT_LOCAL_GATE is the one place the decision is
  # made; every step below reads it.
  gate-admission:
    name: gate-admission
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      statuses: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      AWAIT_LOCAL_GATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: A push to main or a Dependabot pull request awaits no local-gate status
        if: env.AWAIT_LOCAL_GATE != 'true'
        run: echo "$GITHUB_EVENT_NAME — no local-gate status to await"
      - uses: actions/checkout@v7.0.1
        if: env.AWAIT_LOCAL_GATE == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up uv
        if: env.AWAIT_LOCAL_GATE == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Set up Python 3.10
        if: env.AWAIT_LOCAL_GATE == 'true'
        run: uv python install 3.10
      - name: Wait for the local-gate status that matches this head
        if: env.AWAIT_LOCAL_GATE == 'true'
        run: |
          base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          uv run --no-project --with tomli python scripts/local_gate_status.py await --repo-slug "$GITHUB_REPOSITORY" --sha "${{ github.event.pull_request.head.sha }}" --base "$base"

  # The hostless suite on the primary Python, one leg per nox session, each
  # instrumented: a leg checks that its session wrote the combined data file,
  # then uploads it for `coverage-hostless` to fold and judge against the floor.
  # A healthy session finishes well inside the budget. Without a timeout the job
  # inherits GitHub's 6-hour default, and one stalled runner (2026-09-11: both
  # xdist workers went silent mid-file at 75% with no failure and no
  # pytest-timeout, run 34592801664) then blocks every later push in this
  # branch's concurrency group until it expires. 60, not 30: a slow apt mirror
  # alone once took 8.5 minutes of the budget (run 40372930261).
  tests-primary:
    needs: [gate-admission]
    name: ${{ matrix.session }}-3.10
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        session: [tests_hostless_unit, tests_hostless_e2e, tests_hostless_guards]
        # Each leg's changed-test repeat session: its lane's selection over
        # the test files the pull request adds or modifies.
        include:
          - session: tests_hostless_unit
            repeat: tests_changed_repeat_unit
          - session: tests_hostless_e2e
            repeat: tests_changed_repeat_e2e
          - session: tests_hostless_guards
            repeat: tests_changed_repeat_guards
    steps:
      # Depth 2: on a pull request the checkout is the merge commit, and the
      # changed-test repeat below reads its diff against the first parent.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/hostless-setup
        with:
          python: "3.10"

      - name: Run ${{ matrix.session }} under Python 3.10
        run: uv run nox -s ${{ matrix.session }}-3.10

      # upload-artifact with `if-no-files-found: error` would also catch a
      # missing file, but this names the failure for what it is.
      - name: the session's combined data exists
        run: test -f reports/coverage/.coverage

      # The fold expects reports/coverage/hostless/coverage-<session>-3.10/.coverage:
      # the upload root is reports/coverage/, and the download puts each artifact
      # in a directory named after it. `.coverage` is a dot file, which
      # upload-artifact skips unless told otherwise.
      - name: Upload ${{ matrix.session }}'s coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.session }}-3.10
          path: reports/coverage/.coverage*
          include-hidden-files: true
          if-no-files-found: error

      # A test that fails only sometimes is caught here, on the pull request
      # that adds or changes it, not on `main` under someone else's landing
      # (#1044; docs/contributing.md, "The changed-test repeat"). One failure
      # in any repeat fails the job: nothing is retried. Last, so the leg's
      # coverage data is uploaded whatever the repeat finds.
      - name: Repeat the test files this pull request adds or changes
        if: github.event_name == 'pull_request'
        run: uv run nox -s ${{ matrix.repeat }}-3.10

  # The newest Python, uninstrumented: the sessions whose behaviour can differ
  # by interpreter. Same timeout reasoning as `tests-primary`.
  tests-canary:
    needs: [gate-admission]
    name: ${{ matrix.session }}-3.15
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        session: [tests_hostless_unit, tests_hostless_e2e]
        include:
          - session: tests_hostless_unit
            repeat: tests_changed_repeat_unit
          - session: tests_hostless_e2e
            repeat: tests_changed_repeat_e2e
    steps:
      # Depth 2: on a pull request the checkout is the merge commit, and the
      # changed-test repeat below reads its diff against the first parent.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/hostless-setup
        with:
          python: "3.15"

      - name: Run ${{ matrix.session }} under Python 3.15
        run: uv run nox -s ${{ matrix.session }}-3.15

      - name: Repeat the test files this pull request adds or changes
        if: github.event_name == 'pull_request'
        run: uv run nox -s ${{ matrix.repeat }}-3.15

  # The interior Pythons run the unit session alone. They keep the
  # `tests_hostless-<python>` names because those are required contexts.
  # Same timeout reasoning as `tests-primary`.
  tests:
    needs: [gate-admission]
    name: tests_hostless-${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Depth 2: on a pull request the checkout is the merge commit, and the
      # changed-test repeat below reads its diff against the first parent.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/hostless-setup
        with:
          python: ${{ matrix.python }}

      - name: Run tests under Python ${{ matrix.python }}
        run: uv run nox -s tests_hostless_unit-${{ matrix.python }}

      - name: Repeat the test files this pull request adds or changes
        if: github.event_name == 'pull_request'
        run: uv run nox -s tests_changed_repeat_unit-${{ matrix.python }}

  # Combines the primary legs' data and judges the hostless floor on the fold.
  # Not the hostless-setup action: combining data files needs no BusyBox cache,
  # strace or compilers, only uv and the primary Python.
  coverage-hostless:
    needs: [gate-admission, tests-primary]
    name: coverage-hostless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Download the primary legs' coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: reports/coverage/hostless

      - name: Fold the legs and judge the floor
        run: make coverage-hostless-fold

  # THE BOOKEND CERTIFICATES keep the required contexts `tests_hostless-3.10`
  # and `tests_hostless-3.15`. GitHub treats a SKIPPED required check as
  # passing, so a certificate must never be skipped: `if: always()` makes it
  # run whatever its needs did, and its one step fails unless every need's
  # result is `success` (`failure`, `cancelled` and `skipped` all fail it).
  # A head the admission refuses therefore turns these red within seconds.
  hostless-primary:
    needs: [gate-admission, tests-primary, coverage-hostless]
    name: tests_hostless-3.10
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every primary leg and the fold succeeded
        run: test "${{ needs.gate-admission.result }}" = success && test "${{ needs.tests-primary.result }}" = success && test "${{ needs.coverage-hostless.result }}" = success

  # The same certificate over the canary legs.
  hostless-canary:
    needs: [gate-admission, tests-canary]
    name: tests_hostless-3.15
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every canary leg succeeded
        run: test "${{ needs.gate-admission.result }}" = success && test "${{ needs.tests-canary.result }}" = success

  # The Playwright image the browser jobs run in, named by
  # scripts/playwright_version.py from the playwright version locked in
  # uv.lock: the one place that reads the lock and spells the image, so a
  # Dependabot bump of the lock moves the image with it. The helper needs only
  # tomli, so `--no-project` keeps the project out of this job.
  playwright-version:
    name: playwright-version
    needs: [gate-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.lock.outputs.version }}
      image: ${{ steps.lock.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - id: lock
        run: uv run --no-project --with tomli python scripts/playwright_version.py uv.lock

  # One parallel job per browser engine (Blink/Gecko/Safari) — the nox
  # `dashboard` session is parametrized by browser, and this matrix runs each
  # variant on its own runner so wall-clock is a single engine's runtime, not
  # three back-to-back. fail-fast: false so one engine's failure doesn't cancel
  # the others (you want to see all engine results). The Safari-specific test
  # is @only_browser("webkit"), so it runs only in the webkit leg and skips on
  # the others.
  dashboard:
    needs: [gate-admission, playwright-version]
    name: dashboard-e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-version.outputs.image }}
      # --ipc=host: Chromium shares memory through /dev/shm, which a container
      # sizes at 64 MB by default; --init reaps the zombie browser processes
      # a test run leaves. Both are Playwright's own guidance for its image.
      options: --ipc=host --init
    env:
      # GitHub mounts /github/home as HOME in a container job, owned by
      # another user than root; Firefox refuses to start as root with such a
      # HOME. Playwright points at HOME=/root, and the job-level env applies
      # before checkout.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      # Depth 2: on a pull request the checkout is the merge commit, and the
      # changed-test repeat below reads its diff against the first parent.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.10
      # The image ships git and the browsers (PLAYWRIGHT_BROWSERS_PATH) but
      # not make or jq, which `make web` below needs (jq for
      # scripts/typecheck_web.sh). Only the missing ones are installed. It
      # runs as root: no sudo.
      - name: Install the build tools the Playwright image lacks (make, jq)
        run: missing=""; for tool in make jq; do command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"; done; [ -z "$missing" ] || { apt-get update && apt-get install -y --no-install-recommends $missing; }
      # actions/checkout trusts the workspace (git safe.directory) only in a
      # throwaway HOME. This container runs as root in a workspace the
      # runner's user owns, so without this every later git command refuses
      # the checkout, and `make web`'s `git diff --exit-code a b` silently
      # turns into a --no-index diff of the two files against each other.
      # HOME=/root (above) makes the global config last for every step.
      - name: Trust the checkout for git (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Post-cutover, the browser suite exercises the built React dashboard
      # (src/otto/_webassets/monitor/dist/) through a real MonitorServer — there
      # is no legacy static fallback anymore, so `dist/` must exist before
      # the pytest steps below run. The nox session can't build it itself
      # (its venv is Python-only — see the `dashboard` session docstring), so
      # the build stays here. `make web` also re-runs the type-drift gate
      # (web/src/api/types.gen.ts vs. the live pydantic models) and the
      # air-gap grep, so a wire-contract or CDN-URL regression fails here
      # rather than surfacing later as a flaky e2e test. It pulls in npm ci
      # on its own via the node_modules stamp — no separate install step.
      - name: Build the React dashboard (npm ci + type-drift + air-gap gates)
        run: make web
      # Unit tests + coverage run in the dedicated check-ts job; this job
      # builds the dashboard purely for the browser e2e that follows. There is
      # no browser install step: the Playwright image (tagged from uv.lock)
      # already carries every engine and its system libraries, so the nox
      # session's `playwright install <browser>` finds the engine in place and
      # downloads nothing. That replaces `--with-deps`, whose `apt-get update`
      # refreshed every source on the runner image, including a Google Chrome
      # repo we never use, so a mirror sync there could fail the job before a
      # single test ran (issue #129).
      - name: Run dashboard browser e2e (${{ matrix.browser }})
        env:
          # Per-file xdist groups for the audited browser suites (see
          # tests/e2e/conftest.py's grouping policy): the repo-wide `-n auto`
          # then shards modules across the runner's workers. Never set on the
          # 3GB dev VM — `make dashboard` stays -n 1 serial there.
          OTTO_BROWSER_SHARD: "1"
        run: uv run nox -k ${{ matrix.browser }}
      # The changed-test repeat's browser lane, on this job's engine. A named
      # session, never `-k`: the engine keyword above must keep selecting the
      # `dashboard` session alone. Before the upload, so a repeat's failure
      # leaves its trace too.
      - name: Repeat the browser test files this pull request adds or changes (${{ matrix.browser }})
        if: github.event_name == 'pull_request'
        env:
          OTTO_BROWSER_SHARD: "1"
        run: uv run nox -s tests_changed_repeat_browser-3.10 -- --browser ${{ matrix.browser }}
      # The nox session keeps each failed test's Playwright trace and
      # screenshot under reports/playwright/ (noxfile.py's
      # PLAYWRIGHT_OUTPUT_DIR, --tracing retain-on-failure); this is
      # the only evidence a rare browser failure leaves (#1006). Open one with
      # `npx playwright show-trace <trace.zip>` or at trace.playwright.dev.
      # `ignore`: a failure before any test ran (the build step) has no trace.
      - name: Upload failed tests' Playwright traces (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: reports/playwright/
          if-no-files-found: ignore
          retention-days: 30

  # The BusyBox ARTIFACT tier — the pinned bytes, not the behaviour. Every
  # default lane excludes `-m busybox` (G8 in
  # tests/unit/test_tier_marker_invariants.py), so without this job the tier
  # runs nowhere but a developer's terminal.
  #
  # WHAT THIS LANE IS, NOW THAT IT IS THE NARROW ONE. What otto DOES to a
  # BusyBox userland is measured on the live bed — five QEMU guests behind
  # test1, driven over telnet through a hop (tests/integration/busybox_bed/,
  # plus the busybox rows the generic host/transfer/stability/chaos suites
  # carry). That needs the lab and cannot run on a GitHub runner. What stays
  # here is the question a runner CAN answer, about the artifacts themselves:
  # does each pinned file still hash to its committed SHA-256, does it
  # announce the version it is filed under, and does this build spell
  # `timeout` / `base64` / `stat` / `wc` / `nc` the way
  # `src/otto/host/userland.py` probes for. Argv-level contracts against a
  # local subprocess, no device involved.
  #
  # That remainder is not leftovers — it is the bed's supply chain. The guest
  # images are built from these exact bytes, by
  # `scripts/build_busybox_guest_images.py` through this same fetch/pin layer
  # (tests/_fixtures/busybox.py + busybox_pins.json), so a pin or a banner
  # that drifts here is a bed whose userland is no longer the version its lab
  # entry claims. This job is where that is caught, on the push, rather than
  # as a puzzling behavioural result on a guest weeks later.
  #
  # qemu-user only on the arm64 leg, and only because the runner is not x86:
  # the artifacts are x86 userland, so ubuntu-latest executes them natively
  # while the arm64 leg needs binfmt handlers registered (the step below, and
  # docs/architecture/subsystems/busybox-bed.md for the same instruction to a human).
  #
  # THE ARTIFACT CACHE IS DELIBERATELY NOT CACHED. Upstream publishes no
  # signatures, so trust rests on a committed SHA-256 whose entire stated
  # value is that "CI re-fetches on every cold cache" — the pin converts
  # per-run trust in busybox.net into one-time trust taken at a reviewed
  # moment. An actions/cache keyed on busybox_pins.json would only ever miss
  # when the pins change, i.e. it would skip the fetch in exactly the runs
  # that could detect upstream having rebuilt an artifact in place. Caching
  # here would keep the pin file and delete the event it exists to check. The
  # cost accepted in exchange is ~5 MB over five requests per run.
  #
  # That cold fetch now reads the MIRROR (see the note above the `strategy:`
  # block): the same bytes, verified against the same pins, on the host that
  # already has to be up for this workflow to run at all. So "cold every run"
  # keeps its verification value while an upstream outage can no longer red a
  # push. Reading upstream's own bytes — the only way to catch a
  # rebuild-in-place — moved to nightly's `busybox-upstream-drift`.
  #
  # THE CACHING SPLIT IS UNCHANGED. The lanes that merely CONSUME the
  # artifacts — `tests` here, `unit-matrix` and `unit-repeat` in nightly.yml —
  # verify nothing about them, and they DO cache: `tests` is a default gate on
  # five Pythons, so an outage there reds a push for a reason unrelated to it
  # (issue #261), and `unit-repeat` (a CI job then) reddened the same way on
  # the next push.
  # The reasoning above is about the job that checks the bytes, not every job
  # that reads them, and `tests/unit/host/test_busybox_artifacts.py` pins the
  # split in both directions — every consuming lane caches, this one never
  # does — so neither half can drift into the other.
  #
  # Invokes the Makefile lane rather than re-listing its pytest invocation,
  # for the same reason check-ts does (see that job): a CI job that copies a
  # gate's steps is a second copy of that gate, and it drifts. G8c pins that
  # this job invokes the lane G8b requires to exist.
  #
  # TWO ARCHITECTURES, AND THE DISAGREEMENT IS THE SIGNAL.
  #
  # The dev VM is aarch64, so its i686/x86_64 artifact rows run under
  # qemu-user; this job's x86_64 leg runs them natively. That is not a
  # cosmetic difference. qemu-user INTERCEPTS `/proc/self/exe` and answers it
  # from its own knowledge of the guest binary — measured inside a chroot with
  # no /proc mounted at all, `readlink /proc/self/exe` returns `/bin/busybox`,
  # rc=0, which no real kernel would ever do. BusyBox `--install -s` resolves
  # its own path that way, so under emulation it bakes a working symlink
  # target and natively (1.16.1) it bakes a dangling one. That divergence
  # reached `main` twice as a red CI run nothing local could reproduce
  # (issues #227 and #228).
  #
  # So the tier now runs on BOTH: native x86_64 here, and emulated on arm64
  # the way a developer's machine sees it. Neither leg is the reference — the
  # point is that a behaviour which depends on being emulated shows up as the
  # two legs disagreeing, on the push that introduces it, instead of as a
  # local green and a remote red. `fail-fast: false` for exactly that reason:
  # cancelling the second leg when the first fails would throw away the
  # comparison this job exists to make.
  #
  # This is the cheap half of the fix. The durable half is that the harness no
  # longer trusts environment-sensitive values it can derive itself: the
  # `applet_dir` fixture in tests/busybox/test_applet_contracts.py symlinks
  # each applet name at a path IT chose, rather than asking `busybox
  # --install -s` to resolve `/proc/self/exe`. (The harness that made the
  # original mistake — a chroot built by `_install_applets` in the
  # since-deleted tests/_fixtures/busybox_rootfs.py — is gone with the
  # behaviour tier; the two-leg matrix stays, because "does this depend on
  # being emulated" is a question about every future artifact assertion.)
  busybox:
    needs: [gate-admission]
    name: busybox-artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # ABOVE the Makefile's LANE_TIMEOUT wrap (2400s), plus the minutes of
    # checkout / uv / apt / binfmt setup that precede `make busybox`. A job
    # limit at or under the wrap cancels the job before `timeout` can report
    # exit 124 and the fixture's `make busybox-cache` diagnostic — the
    # attribution this lane exists to deliver on a busybox.net stall.
    # tests/unit/test_declared_harness_bounds.py pins the relation.
    timeout-minutes: 45
    # THIS JOB READS THE MIRROR, like every other lane. It pins no source.
    #
    # It used to force `OTTO_BUSYBOX_SOURCE=upstream`, to notice busybox.net
    # rebuilding an artifact in place. That check is real, but it was in the
    # wrong place, and 2026-08-26 showed the bill: busybox.net went down, this
    # job reddened main, and nothing about the pushed change was wrong — the
    # bytes it would have run were sitting in the mirror, matching the pins.
    #
    # The reasoning that moved it: upstream drift cannot affect a single byte
    # this repo tests or ships. Every fetch verifies against
    # `busybox_pins.json`, so the PIN is the trust root and the mirror is only
    # a second host for the same bytes. Detecting drift is therefore
    # monitoring, not gating — and monitoring enforced as a merge gate fails
    # when a third party is down instead of when the change is bad, which is
    # the definition of a flaky gate. It now runs in nightly.yml's
    # `busybox-upstream-drift`, which opens an issue and blocks nobody.
    #
    # What stays here is the part that gates: the artifact tier itself, cold
    # (see the no-cache note above), so every push still fetches the five
    # binaries fresh, verifies them against the pins, and executes the applet
    # contracts on two architectures. `tests/unit/host/test_busybox_artifacts.py`
    # pins all three sides — no source pin on any push job, one in nightly, and
    # none on a consuming lane.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.10
      # The system row (BusyBox 1.36.1) resolves `busybox` via shutil.which and
      # SKIPS when it is absent — and the runner image does not carry it. The
      # `busybox` binary at /usr/bin/busybox comes from `busybox-static`, which
      # is not in the ubuntu-latest manifest; the routinely-present
      # `busybox-initramfs` installs to /usr/lib/initramfs-tools/bin/busybox, a
      # path `which` never sees. So without this the matrix runs 20 of 23 and
      # the one DISTRO-PACKAGED build silently runs nowhere but a developer's
      # machine.
      #
      # That row is worth the two seconds precisely because it is the entry
      # that can diverge through PACKAGING rather than through upstream
      # version — the "build config matters as much as version" case the whole
      # userland layer is built on (docs/superpowers/specs/2026-08-11-busybox-host-support-design.md).
      # It is also the only row served from the distro rather than fetched from
      # busybox.net, so it stays green through a busybox.net outage.
      - name: Install the distro BusyBox so the system row runs rather than skips
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: Register qemu-user handlers, so the x86 rows can run on arm64
        if: matrix.arch == 'arm64'
        # Every row in the matrix is an x86 binary, so on this leg NOTHING runs
        # without a binfmt handler. `require_interpreter` already fails with a
        # named error rather than skipping, but it fails once per test; this
        # fails once, here, where the cause is a missing package rather than a
        # missing artifact.
        #
        # Both handlers are checked, not just one: the matrix has i686 rows and
        # x86_64 rows, and a leg that registered only `qemu-x86_64` would run
        # three rows and fail two with an error about the artifacts.
        run: |
          sudo apt-get install -y qemu-user-static
          for handler in qemu-i386 qemu-x86_64; do
            [ -e "/proc/sys/fs/binfmt_misc/$handler" ] \
              || { echo "::error::$handler binfmt handler is not registered; the x86 artifact rows cannot execute on this arm64 runner"; exit 1; }
          done
      - name: Fetch, verify and run the BusyBox artifact matrix (cold cache)
        run: make busybox

  # web/ TypeScript quality gates — the TS analogue of the lint-python /
  # typecheck-python jobs (those run Python-only nox sessions; this is where
  # Biome/knip/tsc live). Node-only: no Python, no browsers, no dashboard
  # build, so it runs fast and in parallel. Both targets take the node_modules
  # stamp as a prerequisite, so they run npm ci themselves — no explicit
  # install step.
  #
  # TWO GATES, NOT A RE-LISTED UMBRELLA: this job invokes `check-ts` (Biome +
  # knip + tsc) and `coverage-ts-unit` (vitest unit floor) — the two TS gates
  # that can run without browsers. It deliberately does NOT re-enumerate any
  # gate's INTERNALS: a CI job that copies a gate's steps is a second copy of
  # that gate, and it will drift (unsorted imports once sat on main this way).
  # The third TS gate — the merged e2e coverage report (`coverage-ts`) — needs
  # the Playwright browser lane and runs locally via `make coverage`/release,
  # mirroring how the Python 95-gate is local-only while CI gates hostless.
  # `tests/unit/test_ci_web_gate.py` pins this. (The job is named `check-ts`
  # after its headline gate; it also runs the vitest unit floor.)
  check-ts:
    needs: [gate-admission]
    name: check-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: web/ static gates (Biome check + tsc) + vitest unit coverage floor
        run: make check-ts coverage-ts-unit

  # Python static gates. Named -python because they run Python-only nox
  # sessions (ruff / ty); the TS analogues live in the `check-ts` job above.
  lint-python:
    needs: [gate-admission]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.10
      # Before the first command that syncs an environment: a stale lock is
      # refused before anything is resolved from it.
      - name: lock-check — uv.lock matches pyproject.toml
        run: make lock-check
      - run: uv run nox -s lint
      # This job never runs `make web`, so the web assets are absent exactly as
      # the hostless lanes see them.
      - name: collect-check — every test module imports with the web assets absent
        run: make collect-check
      # Every otto name the docs and shipped examples teach must be declared in
      # api/public.toml, and the declaration must agree with the runtime
      # (scripts/api_teaching.py). It runs before the marking step, which may
      # detach to a pull request's head: like the lint above, it judges the tree
      # the pull request would land.
      - name: check-api-teaching — every taught otto name is declared
        run: make check-api-teaching
      # A pull_request checks out GitHub's synthetic merge commit, which carries
      # no breaking mark. Under a v2 golden merges are judged against their first
      # parent, so a v2-era PR -- the golden at its base OR its head is v2, as in
      # the checker (a missing golden is not v2) -- detaches to its own head
      # first. A v1 PR keeps the merged tree: v1 skips merges and resolves
      # documented paths against the checked-out tree, and those live decisions
      # must not change.
      # tests/unit/scripts/test_ci_breaking_marks_checkout.py pins both paths.
      # Whatever the event, a v2 golden at HEAD must open with exactly its two
      # header lines (dump spec §2.1); the pre-flight below says so, naming the
      # file, before the checker regenerates a single commit.
      - name: check-breaking-marks — a public-API golden deletion must be marked
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git show "${{ github.event.pull_request.base.sha }}:tests/unit/api_snapshot/public_api.txt" 2>/dev/null \
                | grep -qxE '[[:space:]]*# api-snapshot v2[[:space:]]*' \
              || git show "${{ github.event.pull_request.head.sha }}:tests/unit/api_snapshot/public_api.txt" 2>/dev/null \
                | grep -qxE '[[:space:]]*# api-snapshot v2[[:space:]]*'; then
              git checkout -q --detach "${{ github.event.pull_request.head.sha }}"
            fi
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..HEAD"
          else
            RANGE="origin/main..HEAD"
          fi
          golden="$(mktemp)"
          trap 'rm -f "$golden"' EXIT
          if git show "HEAD:tests/unit/api_snapshot/public_api.txt" > "$golden" 2>/dev/null \
              && grep -qxE '[[:space:]]*# api-snapshot v2[[:space:]]*' "$golden" \
              && ! { [ "$(sed -n 1p "$golden")" = "# api-snapshot v2" ] \
                && sed -n 2p "$golden" | grep -qxE '# producer-schema [0-9]+'; }; then
            echo "::error file=tests/unit/api_snapshot/public_api.txt::a v2 golden starts with '# api-snapshot v2' and then '# producer-schema <n>'; regenerate it with make api-snapshot"
            exit 1
          fi
          uv run python scripts/check_breaking_marks.py "$RANGE"

  typecheck-python:
    needs: [gate-admission]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.10
      - run: uv run nox -s typecheck

  docs:
    needs: [gate-admission]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # graphviz `dot` renders the architecture-docs diagrams. ubuntu-latest
      # images currently preinstall it, but that set is not contractual —
      # install explicitly so the docs gate never depends on image contents.
      - run: sudo apt-get install -y graphviz
      - run: uv python install 3.10
      # scripts/capture_docs_media.py (hooked from docs/conf.py, every HTML
      # build) drives a real MonitorServer to screenshot the dashboard —
      # post-cutover that server refuses to start without a built React
      # dashboard, so `dist/` must exist before `nox -s docs` runs. Building
      # it here (rather than falling back to OTTO_DOCS_MEDIA=placeholder)
      # keeps this gate an honest rehearsal of what Read the Docs' own build
      # does (see .readthedocs.yaml) — placeholder mode stays reserved for
      # its documented emergency case (e.g. a broken Chromium install), not
      # routine CI. `make docs` encodes this same dist prerequisite for local
      # builds; the step stays explicit here because CI runs the nox session,
      # whose Python-only venv can't build the frontend. `make web` runs npm
      # ci itself via the node_modules stamp — no separate install step.
      - name: Build the React dashboard (needed by capture_docs_media.py)
        run: make web
      # Headless Chromium captures the build-time GUI media (screenshots)
      # via scripts/capture_docs_media.py, hooked from docs/conf.py.
      # --with-deps also apt-installs the browser's runtime libraries, so this
      # job carries the same third-party-apt-source exposure as dashboard-e2e
      # (issue #129) and takes the same guard.
      - run: |
          scripts/ci_drop_unused_apt_sources.sh
          uv run playwright install --with-deps chromium
      - run: uv run nox -s docs

  # The one lane that runs otto as a user installs it: the built wheel over
  # its locked runtime dependencies, no dev group, nothing from src/. Every
  # other job runs an editable otto in the dev venv, which is how a dev-only
  # pytest-cov option shipped in every `otto test` session (#593). The wheel
  # needs the web assets (the build backend refuses an asset-less one), and
  # `make wheel-smoke` builds them, checks the wheel, then runs the session.
  wheel-smoke:
    needs: [gate-admission]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.10
      - run: make wheel-smoke

  # The API dump is byte-identical on every supported Python and under any hash
  # seed (dump spec §6, D-3). Each leg regenerates HEAD's dump under its own
  # PYTHONHASHSEED, from otto's runtime dependencies alone, and compares it with
  # the committed golden. A declared enum whose records differ across minors
  # fails here, on the minor that disagrees.
  api-dump-invariance:
    needs: [gate-admission]
    name: api-dump-invariance-${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Regenerate the dump under Python ${{ matrix.python }} and compare it with the golden
        run: uv run nox -s api_dump_invariance-${{ matrix.python }}

  # The uv dependency's floor: otto's env code and the `otto env` e2e run
  # against the declared minimum uv (package and binary), so a minor otto
  # claims to support is one it tests.
  uv-floor:
    name: uv-floor
    needs: [gate-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Set up Python 3.10
        run: uv python install 3.10
      - name: Run otto env against the floor uv
        run: uv run nox -s tests_uv_floor

  # The import-budget delta (docs/contributing.md, "Import budget"): the
  # merge-base's file operations against the head's, per Python minor, with the
  # base's records cached. `budget-scope` decides whether the diff can move the
  # budget (scripts/gate_scope.py owns which paths do) and names the base tag
  # through the delta script's own resolver; the legs run only then; the
  # `import-budget` certificate is the one required context and accepts a leg
  # that was skipped (a diff that cannot move the budget).
  budget-scope:
    needs: [gate-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}
      # Only the legs' cache key: the legs resolve the base themselves from
      # --base-rev, through the same resolver (import_budget_delta.base_ref).
      tag: ${{ steps.scope.outputs.tag }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.10
      - name: Ask gate_scope whether the diff can move the budget, and the delta which tag is the base
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            HEAD="${{ github.sha }}"
          fi
          git checkout -q --detach "$HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" "$HEAD")"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse origin/main)"
          fi
          uv run --no-project --with tomli python scripts/gate_scope.py --budget-eligible --base "$BASE" --tip "$HEAD" >> "$GITHUB_OUTPUT"
          TAG="$(uv run --no-project python scripts/import_budget_delta.py base-tag --rev "$BASE")"
          {
            echo "tag=$TAG"
            echo "base=$BASE"
            echo "head=$HEAD"
          } >> "$GITHUB_OUTPUT"

  # One leg per minor, serial inside a leg (the delta measures every side in a
  # pristine worktree and venv). timeout-minutes is a placeholder: re-set it
  # from the first measured leg's elapsed time (reports/budget/run.log in the
  # `budget-<minor>` artifact).
  import-budget-delta:
    needs: [gate-admission, budget-scope]
    if: needs.budget-scope.outputs.run == 'true'
    name: import-budget-delta (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.budget-scope.outputs.head }}
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/hostless-setup
        with:
          python: ${{ matrix.python }}

      # ImageVersion is in the runner's process environment, not the `env` context.
      - name: The runner image version, for the cache key
        id: img
        run: echo "v=$ImageVersion" >> "$GITHUB_OUTPUT"

      # Restore and save are split so the base's records are kept even when the
      # leg stops on growth (actions/cache saves only on success); one key.
      - name: The base's records, cached by the tag, the interpreter and the instrument
        uses: actions/cache/restore@v6
        with:
          path: reports/budget/${{ needs.budget-scope.outputs.tag }}
          key: budget-base-${{ needs.budget-scope.outputs.tag }}-${{ matrix.python }}-${{ hashFiles('scripts/import_budget.py', 'tests/_fixtures/**') }}-${{ runner.os }}-${{ steps.img.outputs.v }}

      - name: Measure the merge-base and the head under Python ${{ matrix.python }}
        run: uv run python scripts/import_budget_delta.py measure --minors "${{ matrix.python }}" --base-rev "${{ needs.budget-scope.outputs.base }}"

      - name: Keep the base's records for the next run, whatever this one concluded
        if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/budget/${{ needs.budget-scope.outputs.tag }}
          key: budget-base-${{ needs.budget-scope.outputs.tag }}-${{ matrix.python }}-${{ hashFiles('scripts/import_budget.py', 'tests/_fixtures/**') }}-${{ runner.os }}-${{ steps.img.outputs.v }}

      - name: Keep the records (the other environment's numbers for a local run)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: budget-${{ matrix.python }}
          path: reports/budget/

  # The required context. A skipped required check counts as passing, so this
  # runs always and turns red on anything but success, a skipped leg excepted
  # (a diff that cannot move the budget skips them).
  import-budget:
    needs: [gate-admission, budget-scope, import-budget-delta]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.gate-admission.result }}" = success && test "${{ needs.budget-scope.result }}" = success && { test "${{ needs.import-budget-delta.result }}" = success || test "${{ needs.import-budget-delta.result }}" = skipped; }

  # If any job above fails on main, open (or update) a tracking issue so a
  # broken main surfaces without anyone having to watch the Actions tab. Keyed
  # on the ref, as nightly.yml's reporter is: a pull request runs on
  # refs/pull/<n>/merge, and its failures are already visible to the author in
  # the checks UI.
  report-failure:
    name: Open issue on failure
    needs: [gate-admission, playwright-version, lint-python, tests-primary, tests-canary, tests, coverage-hostless, hostless-primary, hostless-canary, dashboard, busybox, check-ts, typecheck-python, docs, wheel-smoke, api-dump-invariance, uv-floor, budget-scope, import-budget-delta, import-budget]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # The report reads this run's jobs and their logs, and the checkout.
      actions: read
      contents: read
    steps:
      # The report reads the push range and the commit log: full depth.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # scripts/ci_failure_report.py names the jobs that did not pass, each with
      # its first failing line, and the last green run (#799). `--before` is the
      # push's previous head: the report says whether the landing's diff holds
      # each failing test file, which decides between a revert and a fix
      # (docs/contributing.md, "When main goes red"). It runs on the
      # runner's own Python with nothing installed, and it writes a report
      # whatever GitHub answers; the fallback below is for the script itself
      # failing, because an issue that is never filed is the worst outcome.
      - name: Write the issue's title and body
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ci_failure_report.py \
              --workflow ci.yml \
              --title "CI failed on main" \
              --heading 'A CI run on `main` failed.' \
              --repo "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-url "$RUN_URL" \
              --sha "$GITHUB_SHA" \
              --before "$BEFORE" \
              --title-out issue-title.txt \
              --body-out issue-body.md || {
            echo "CI failed on main" > issue-title.txt
            printf '%s\n\n- Workflow run: %s\n- Commit: %s\n\nThe report script failed: read the run.\n' \
              'A CI run on `main` failed.' "$RUN_URL" "$GITHUB_SHA" > issue-body.md
          }
          echo "title=$(head -n 1 issue-title.txt)" >> "$GITHUB_OUTPUT"

      - name: Create issue from file
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: ${{ steps.report.outputs.title }}
          content-filepath: issue-body.md
          labels: ci
