# ast-grep configuration (Makefile: lint-arch). Rules encode otto-specific
# architecture patterns that neither ruff (no plugin API) nor tach (no
# scope sensitivity) can express. Policy background:
# todo/churn-and-design-review-2026-08-03.md §5.
#
# Scan roots are `src/otto web/src tests` (Makefile lint-arch + noxfile lint —
# keep both in sync). tests/ joined 2026-08-06 so test-suite pattern rules can
# exist (todo/test-infra-remediation-plan-2026-08-06.md, gate G0). Discipline
# that keeps the widening safe: every rule carries an explicit `files:` scope,
# and rules scoped to tests/** must ignore the fixture SUT repos
# (tests/repo1..repo3, repo_broken, repo_e2e) and tests/firmware — those are
# user-example input data, not otto's tests.
ruleDirs:
- .ast-grep/rules
