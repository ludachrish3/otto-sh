id: typer-exit-outside-cli
language: python
severity: error
message: typer.Exit outside src/otto/cli/ couples core code to the CLI framework. Raise a library exception (or return a Result) and translate at the CLI boundary.
note: >
  ZERO baseline violations as of the outcome-convention pass (2026-08-04).
  The last one — otto/suite/register.py's suite runner — now returns a
  CommandResult that the leaf-invoke renderer (cli/invoke.render_leaf_value)
  turns into the process exit code, so no suppression remains anywhere.
  Do not add new ones. thin-CLI series item 1 (2026-09-28) added
  typer.BadParameter to the rule alongside typer.Exit: a library module that
  raises it has the same CLI-coupling problem as one that exits directly.
files:
- src/otto/**
ignores:
- src/otto/cli/**
# examples/ are demonstration CLIs — typer.Exit is the point there, not a leak.
- src/otto/examples/**
rule:
  any:
  - pattern: typer.Exit($$$ARGS)
  - pattern: typer.BadParameter($$$ARGS)
