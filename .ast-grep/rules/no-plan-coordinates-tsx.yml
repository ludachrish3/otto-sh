id: no-plan-coordinates-tsx
language: tsx
severity: error
message: Comment references an SDD plan coordinate ("Task N" / "Plan 5a" / "plan §" / "review finding FN"). The plans were purged (git tag plans-archive-2026-08-03) — restate the rationale in place, or cite the surviving spec by filename.
note: >
  The TypeScript half of the src/otto rule of the same name. It is SPLIT in two
  because ast-grep's `language: tsx` matches .tsx files ONLY — a `tsx` rule
  never sees data/*.ts, charts/options.ts, covapp/format.ts, topo/layout.ts or
  ui/*.ts, which is where most of web/'s plan coordinates lived. One rule would
  have been a gate that cannot fire over the majority of its own subject matter.
  Keep all THREE patterns identical — the src/otto sibling shares this regex.

  Citing a SPEC section ("spec §9") is fine — specs are tracked. Plan
  coordinates are not resolvable by any reader: commit 158a6e81 deleted all 108
  plan files, which turned every one of these citations into a dangling
  reference. The 2026-08-05 sweep cleared all 169 matches this rule pair
  reported — 60 from -ts, 109 from -tsx, across 49 shipped files — taking both
  rules to zero.

  FIVE spellings this regex does NOT catch. They are shared with the src/otto
  sibling, and are owed ONE follow-up covering all three rule files together
  (todo/churn-review-remaining-work-2026-08-05.md §1c):
    1. plural "Tasks 4-6" / "Tasks 5/6" — "Task\s+\d+" cannot match the "s".
    2. letter "Plan C" — "Plan\s+\d+" requires a digit.
    3. lowercase "chaos plan 3" — the alternation is case-sensitive, and only
       the "plan §" branch is lowercase.
    4. hyphenated, no whitespace, EITHER case: "task-12-report.md" AND
       "pre-Task-11". Writing this class up as "lowercase" is what let the
       capitalized form outlive three rounds of cleanup (see below).
    5. a coordinate WRAPPED across two "//" lines ("...(Task" / "// 13's..."):
       each "//" line is its own comment node, so no regex on a single node
       can bridge it. NOTE this one is NOT fixable the way b2ba1a4f fixed the
       same problem in src/otto: there, "\s+" sufficed because a Python
       docstring is ONE node spanning every wrapped line. Here it is a node
       BOUNDARY, so a fix needs a different mechanism (join adjacent line
       comments before matching, or a separate line-based check).
  Class 5 is the dangerous one: it is invisible to this gate AND to a reader
  grepping for "Task 13". One such site survived the first sweep in
  pages/SubjectPage.tsx and was caught only in review.

  Provenance, stated exactly, because it is this repo's own thesis turned on
  itself. Classes 1, 2 and 4 were swept BY HAND in c2db81d8's pass; class 5 was
  checked by the throwaway line-pair detector in 0f633016; class 3 was not
  known until 2026-08-05's final review. Every one of those is a check that
  ran once, and it shows — three rounds of cleanup, each finding what the last
  one missed:
    round 1: one class-5 site (pages/SubjectPage.tsx), caught in review.
    round 2: SEVEN occurrences across five files outlived that review —
      "Plan C" in coverage/renderer/spa_data.py, "chaos plan 3" in
      lifecycle.py, "task-12b-report.md" in topo/routing.ts and
      topo/LinkEdge.tsx (a fully dangling filename; no task-12b report exists
      in the tree or in the plans-archive-2026-08-03 tag), and "task-14" x2 +
      "task-10" in covapp/pages/TicketsPage.tsx.
    round 3: one more, "pre-Task-11" in covapp/format.ts — the same file
      round 1 had already stripped EIGHT coordinates from. It survived because
      class 4 was written up as "lowercase, hyphenated", so a capitalized
      "Task-11" was never in anyone's search space. The ENUMERATION was
      narrower than the blind spot it described, which is the failure mode
      this whole note exists to argue against.
  All are fixed and all five spellings scan clean today, verified by a scan
  that JOINS wrapped comment runs and matches BOTH cases — a line-at-a-time
  grep reproduces blind spot 5, and a case-sensitive one reproduces 3 and 4.
  Nothing FAILS if they come back, which is exactly why 1-5 are a follow-up
  and not a footnote.

  Deliberately OUT of scope, and not swept: web/src test files (~109 blocks
  across 40 files) and tests/**.py (~195 blocks across 74 files). The policy is
  shipped-source-only, matching this rule's src/otto sibling, which has always
  scoped to src/otto/**. Widening it is a policy decision, not a cleanup.
files:
- web/src/**
ignores:
# Test trees — out of policy scope, see the note.
- web/src/**/__tests__/**
- web/src/**/*.test.ts
- web/src/**/*.test.tsx
# Vendored Untitled UI: scripts/check_untitledui_hash.sh forbids hand-editing,
# so a future re-vendor introducing a coordinate must not make this unfixable.
- web/src/components/**
# Generated by scripts/gen_web_types.sh — fix the Python docstring upstream.
- web/src/api/*.gen.ts
rule:
  kind: comment
  regex: '\b(Task\s+\d+|Plan\s+\d+[a-z]?|plan\s+§|review\s+finding\s+F\d)'
