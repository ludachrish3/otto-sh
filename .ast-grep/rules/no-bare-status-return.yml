id: no-bare-status-return
language: python
severity: error
message: Function returns a bare `Status`. otto's outcome convention is a Result-family value (otto.result) or a raised OttoError — a naked enum drops the retcode, the output, and the diagnostic the caller needs.
note: >
  The returns half of the outcome convention, converted from prose into a gate
  (the raises half is tests/unit/test_error_base.py). `Status` is the shared
  VOCABULARY carried inside a result (docs/architecture/utilities/results.md),
  never the return type itself: a caller handed a bare `Status` cannot see the
  exit code, the command, or the output. Swept to zero when docker's
  compose_down / cleanup_project converted — they were the last two, and were
  a regression from an earlier Result-family shape, which is exactly the drift
  this rule now prevents. The regex matches `Status` ANYWHERE in a return
  annotation, so composites are covered too: `tuple[Status, str]`,
  `dict[str, tuple[Status, str]]`, `Status | None`, `list[Status]`. The last
  legacy pairs (docker/build.py, host/product.py) converted 2026-08-04, so
  the baseline is zero for every shape that names `Status` directly. Being
  syntactic, it cannot see through a type alias (`Pair = tuple[Status, str]`;
  `-> Pair` is invisible) — none exists today, and the fix for one would be
  to inline it, not to loosen this.
  Note ast-grep is syntactic: `otto/config/dependencies.py` defines an
  unrelated `Status` Literal, currently used only by private functions. If
  one is ever made public this rule will fire on it wrongly — rename that
  alias rather than loosening this.
files:
- src/otto/**
rule:
  kind: function_definition
  all:
  - has:
      field: return_type
      regex: "\\bStatus\\b"
  - not:
      has:
        field: name
        regex: "^_"
