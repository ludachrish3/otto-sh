id: no-cli-import-outside-cli
language: python
severity: error
message: A library module imports otto.cli. The CLI projects the libraries; nothing below it may reach up. Move the logic into the library and let otto.cli call it.
note: >
  No debt: the completion cache's walkers of the command tree moved into
  otto.cli.registry, and the CLI hands them, its root app and its dispatch
  key to otto.config (spec 2026-10-11 placement-and-phases §3.1). The ignores
  below are the package's own CLI entry points, which are permanent. An
  ignore earns its place by naming a real import; do not add one on the
  strength of "it might someday."
files:
- src/otto/**
ignores:
- src/otto/cli/**
# The package's own CLI entry points: permanent.
- src/otto/__init__.py
- src/otto/_shim.py
rule:
  any:
  - pattern: from otto.cli import $$$X
  - pattern: from otto.cli.$M import $$$X
  - pattern: import otto.cli
  - pattern: import otto.cli.$M
  - pattern: from ..cli import $$$X
  - pattern: from ..cli.$M import $$$X
  - pattern: from .cli import $$$X
  - pattern: from .cli.$M import $$$X
  - pattern: from otto import cli
  - pattern: from . import cli
  - pattern: from .. import cli
  - pattern: from ...cli import $$$X
  - pattern: from ...cli.$M import $$$X
  - pattern: from ... import cli
  - pattern: from .. import cli as $A
  - pattern: from . import cli as $A
  - pattern: from ... import cli as $A
  - pattern: import otto.cli as $A
  - pattern: import otto.cli.$M as $A
