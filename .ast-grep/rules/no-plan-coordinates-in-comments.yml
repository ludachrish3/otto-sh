id: no-plan-coordinates-in-comments
language: python
severity: error
message: Comment references an SDD plan/spec coordinate that is unresolvable without docs/superpowers. Restate the rationale in place or point at docs/architecture.
note: Policy from todo/churn-and-design-review-2026-08-03.md §5.4 — plan coordinates die at merge. Existing backlog is the Tier 2.11 sweep.
files:
- src/otto/**
# Baseline files holding the pre-rule backlog (25 sites on 2026-08-03).
# The Tier 2.11 sweep rewrites those comments; delete each entry here as its
# file is swept. Do NOT add entries — new plan coordinates are a gate failure.
ignores:
- src/otto/cli/tunnel.py
- src/otto/config/completion_cache.py
- src/otto/coverage/attribution.py
- src/otto/coverage/colors.py
- src/otto/coverage/renderer/spa_data.py
- src/otto/coverage/reporter.py
- src/otto/coverage/store/model.py
- src/otto/host/app_shell.py
- src/otto/host/session.py
- src/otto/link/__init__.py
- src/otto/link/netem.py
- src/otto/monitor/collector.py
- src/otto/tunnel/manage.py
rule:
  kind: comment
  regex: '\b(Task \d+|spec §|design §|plan §|review finding F\d)'
