id: pydantic-models-through-ottomodel
valid:
# The house shape: a model through OttoModel, keeping its own config.
- |
  from pydantic import ConfigDict

  from otto.models.base import OttoModel


  class RowModel(OttoModel):
      model_config = ConfigDict(extra="ignore")
# OttoModel itself is the one direct BaseModel subclass.
- |
  from pydantic import BaseModel, ConfigDict


  class OttoModel(BaseModel):
      model_config = ConfigDict(extra="forbid", defer_build=True)
# A TypeAdapter or a rebuild inside the function that needs it.
- |
  def parse_hosts(raw: bytes) -> list[HostSpec]:
      from pydantic import TypeAdapter

      HostSpec.model_rebuild()
      return TypeAdapter(list[HostSpec]).validate_json(raw)
