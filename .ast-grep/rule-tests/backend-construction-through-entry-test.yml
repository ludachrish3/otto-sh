# A parameter that only mentions Configured inside another type is not a
# factory: a registration wrapper taking a factory callable, and an
# orchestration loop over prepared states.
- |
  def register_thing(name, factory: "Callable[[Configured[X, Y]], Z]"):
      return JsonFileLabRepository(paths=[name])
- |
  def build_from_states(states: "list[Configured[A, B]]"):
      return [JsonFileLabRepository(paths=s.config.paths) for s in states]
# A factory-shaped helper that takes no Configured is still a direct call.
- |
  def _power(config: CommandPowerConfig) -> CommandPowerController:
      return CommandPowerController(config)
