# Rule test for .ast-grep/rules/backend-construction-through-entry.yml.
# `valid` snippets must NOT match, `invalid` snippets must. Run by
# `make lint-arch` (`ast-grep test`), whose test dir is sgconfig.yml's
# testConfigs entry. ast-grep test does not apply the rule's `files:`
# scope, so every snippet here is judged as if it sat in an orchestration
# module.
id: backend-construction-through-entry
valid:
# The registered factory: the one place the constructor belongs (the
# json_backend.py shape, and power.py's own factory).
- |
  def _json_inventory(c: "Configured[JsonInventoryConfig, InventoryEnv]") -> JsonInventory:
      return JsonInventory(path=c.config.path, supplies=c.config.supplies)
- |
  def _command_power(c: Configured[CommandPowerConfig, PowerEnv]) -> CommandPowerController:
      return CommandPowerController(c.config)
# Building through the registry.
- |
  def build_inventory(prepared):
      return INVENTORY_BACKENDS.build(prepared)
# A config model, a type check and a class reference are not construction.
