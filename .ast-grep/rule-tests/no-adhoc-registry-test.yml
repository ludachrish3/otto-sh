# Rule test for .ast-grep/rules/no-adhoc-registry.yml.
# `valid` snippets must NOT match, `invalid` snippets must. Run by
# `make lint-arch` (`ast-grep test`), whose test dir is sgconfig.yml's
# testConfigs entry.
id: no-adhoc-registry
valid:
# An operational cache written by a lock helper (otto.tunnel.manage's shape).
- |
  import asyncio

  _ADD_LOCKS: dict[str, asyncio.Lock] = {}


  def _lock_for(tunnel_id: str) -> asyncio.Lock:
      return _ADD_LOCKS.setdefault(tunnel_id, asyncio.Lock())
# Indexed writes to a stat cache from a non-registration method
# (otto.suite.plugin's shape).
- |
  _LIB_DEP_STATS: dict[str, list[int] | None] = {}


  class Plugin:
      def library_stats(self, deps):
          found = {}
          for dep in sorted(deps):
              if dep in _LIB_DEP_STATS:
                  found[dep] = _LIB_DEP_STATS[dep]
              else:
                  _LIB_DEP_STATS[dep] = _stat_pair(dep)
          return found
# A static table read by a registration function.
- |
  DEFAULT_PARSERS = [CpuParser(), MemParser()]


  def register_defaults(*, overwrite=False):
      register_parsers(DEFAULT_PARSERS, overwrite=overwrite)
# A registration function writing a local, or an engine table.
- |
  def register_product_provider(provider):
      seen = []
      seen.append(provider)
      PRODUCT_PROVIDERS.subscribe(provider)
invalid:
