# git-cliff configuration for otto-sh.
#
# Renders CHANGELOG.md in Keep a Changelog format from Conventional
# Commits. Run via `make changelog`, which puts the project venv's
# git-cliff on PATH (git-cliff is a declared dev dependency) and
# regenerates the WHOLE file — released sections included.

[changelog]
# Header sits above all release sections. Mirrors the prose that was in
# the hand-edited CHANGELOG.md.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# One block per release. `version` is "Unreleased" for unreleased commits
# (when --tag is not passed) or the value passed via --tag.
#
# Each bullet carries its conventional-commit SCOPE and, when the commit
# marked itself `type(scope)!:` or wrote a `BREAKING CHANGE:` footer, a
# **BREAKING** badge. Both were previously dropped: the `!` was inert (a
# `fix(cli)!:` rendered as an ordinary "Fixed" bullet, indistinguishable from
# a routine fix), and without the scope a reader could not tell which
# subsystem a line was about.
#
# The badge is inline rather than a section of its own because a breaking
# change is orthogonal to Keep a Changelog's Added/Changed/Fixed axis — a
# `feat!` is still an addition — and hoisting it would either duplicate the
# entry or hide it from the group a reader is scanning.
#
# The badge is deliberately BARE: it does not carry the `BREAKING CHANGE:`
# footer's text. git-cliff's `commit.breaking_description` is not that text —
# it stops at the first continuation line shaped like `Token: value` and
# ignores every footer after the first. On otto's own history that renders
# `... the lab database file is now lab.json with the shape` and stops dead
# (the next line begins `{"hosts":`), and it drops two of the three migration
# notes on ad0edab3 entirely. A truncated migration instruction under a
# **BREAKING** badge is worse than none, so the badge sends the reader to the
# commit rather than paraphrasing it wrongly.
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{%- if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{- commit.message | split(pat="\\n") | first | trim }}
{% endfor %}
{% endfor %}
"""

# Footer holds the comparison links Keep a Changelog uses. git-cliff
# renders it once at the bottom; we iterate every release in reverse
# chronological order and emit a link per release.
footer = """
{% if releases | length > 0 %}\
{% if releases[0].version %}\
[Unreleased]: https://github.com/ludachrish3/otto-sh/compare/{{ releases[0].version }}...HEAD
{% else %}\
[Unreleased]: https://github.com/ludachrish3/otto-sh/compare/{{ releases[0].previous.version }}...HEAD
{% endif %}\
{% for release in releases %}\
{% if release.version and release.previous.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/ludachrish3/otto-sh/compare/{{ release.previous.version }}...{{ release.version }}
{% elif release.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/ludachrish3/otto-sh/releases/tag/{{ release.version }}
{% endif %}\
{% endfor %}\
{% endif %}\
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# No preprocessors. A rule here used to strip the trailing "(#NN)" PR
# reference from squash-merge subjects, on the theory that the body template
# would otherwise print it twice — once from the message and once from
# `commit.remote.pr_number`. The template never referenced `commit.remote`,
# so there was no second copy, and the rule never fired anyway: its pattern
# was anchored with `$` against the whole message, which ends in a newline
# (and usually a body). 42 bullets in CHANGELOG.md still carry their `(#NN)`,
# which is the useful behaviour; the rule is gone rather than repaired.

# Map Conventional Commit types into Keep a Changelog sections.
# `group` is the section heading; `default_scope` lets dependabot's
# `chore(deps)` land in its own bucket. Order here = order in the rendered
# section list (after sort_commits below sorts within each group).
commit_parsers = [
  # Drop bump-my-version's auto-generated release commits so the changelog
  # doesn't list "bump version X -> Y" entries against itself.
  { message = "^chore\\(release\\):", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  # `^chore\(deps` already matches `chore(deps-dev)`; no separate rule needed.
  { message = "^chore\\(deps", group = "Dependencies" },
  { message = "^build\\(deps", group = "Dependencies" },
  { message = "^chore", group = "Maintenance" },
  # Skip non-user-facing categories. Flip any of these to a group if you'd
  # rather surface them.
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  # Anything that doesn't follow Conventional Commits (e.g. legacy
  # "Added todo items" subjects) is dropped so the rendered file stays
  # opinionated and predictable.
  { message = ".*", skip = true },
]

filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"

# NO `[remote.github]`, deliberately. Declaring it makes git-cliff fetch
# `/repos/<owner>/<repo>/commits` and `/pulls` from api.github.com on EVERY
# render, and it PANICS (Rust exit 101, empty stderr) on any failure —
# including the plain 403 an unauthenticated caller gets when rate-limited.
# GitHub Actions runners share outbound IPs, so that 403 is routine there: it
# broke CI on 3.11/3.12/3.14 while 3.10 got through, and the machines that
# never saw it were the ones with a warm `~/.cache/git-cliff`.
#
# It bought nothing. This template renders the compare/tag links as literal
# strings and never touches git-cliff's `remote` / `github` context, so
# removing the block leaves both `git-cliff -o CHANGELOG.md` and the release
# workflow's `--latest --strip header` byte-identical — verified both ways.
# `make changelog`, `make release` and that workflow were all one rate-limit
# away from a panic for no rendered benefit.
#
# If a future template DOES want PR numbers or contributor handles, add the
# block back together with a token (`GITHUB_TOKEN`), and expect the render to
# need the network — then `tests/unit/test_changelog_rendering.py` must keep
# passing `--offline`, which it already does.
