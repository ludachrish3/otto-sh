[[modules]]
path = "otto.project"
# The project layer sits ABOVE hosts and below the CLI: it drives host verbs
# across the fleet on behalf of one repo. Every edge here points down.
#
# otto.host is imported LAZILY inside the methods that dispatch (BaseHost.install
# and friends) — `import otto.project` must stay cheap, because the default
# instructions import it at CLI startup. tach counts a function-scope import as
# an edge regardless, which is why it is declared.
#
# otto.config and otto.context are TYPE_CHECKING-only in actions.py (Repo,
# OttoContext): the per-repo actions are HANDED both at construction and never
# look either up. The orchestrator DOES look them up -- ambient-context module
# functions are its whole shape -- but only from inside the call
# (orchestrator._lab), for the same reason otto.host is lazy here: `import
# otto.project` must stay cheap, and a module-scope import of either would join
# the config<->context and host<->context cycles.
#
# otto.cli is ONE FILE's edge and points UP, deliberately: project/instructions.py
# imports `@instruction` to register the six first-party `otto run` verbs. They
# are ordinary instructions, so they register through the ordinary decorator --
# the alternative (a second, CLI-side registration path for otto's own verbs)
# would be a private seam nobody else can use, to avoid an edge that costs
# little. It is not free, and this comment used to say it was: otto.cli does
# not import otto.project DIRECTLY (bootstrap reaches this module by name,
# through importlib), but the loop still closes one hop further out — project
# -> cli -> suite -> project, because otto.cli imports otto.suite and the
# suite's ensure_* fixtures import this package. It is not a RUNTIME circular
# import (nothing in otto.suite imports otto.cli, and the fixture import is
# inside the fixture body), which is why it survives; the retirement is the
# same one the config<->cli DEBT edge needs — a home for instruction
# registration that is not otto.cli. See otto.suite below, which carries the
# other half of this note. Every OTHER module in the package stays CLI-free,
# which is what lets a fixture or a suite call the orchestrator without
# dragging typer in.
#
# otto.link and otto.tunnel are `cleanup`'s last two steps and `is_clean`'s
# last two questions (2026-08-17): a netem impairment and a tunnel belong to
# the LAB rather than to any repo, so the orchestrator resets and reaps them
# once, exactly as it does the debug sweep and the toolchain. BOTH EDGES POINT
# DOWN and both are function-scope, in orchestrator.py alone — the four calls
# are `link.manage.repair_all` / `read_link_states` and
# `tunnel.manage.remove_all_tunnels` / `tunnel.discovery.discover_tunnels`,
# each handed `ctx.lab` and nothing else. Neither package knows this one
# exists, so neither edge is a mutual pair; the component is unchanged at
# sixteen (re-measured, see the header). What DID move is the header's
# both-cuts figure: project->tunnel is now tunnel's only cli-free way back
# into the component.
#
# otto.errors is the exception hierarchy's root and a zero-import leaf, so it
# cannot invert layering or create a cycle (otto.config, otto.monitor and
# otto.reservations declare it on the same standing). Module-scope in
# orchestrator.py, deliberately: InactiveRequiredDependencyError is a
# module-level class statement and its base has to be resolved at import time.
# The cost is nil -- otto.errors imports nothing -- so `import otto.project`
# stays as cheap as the note above requires.
#
# otto.models is `normalize_name`, the ONE PEP-503 normalizer, reached at
# function scope from orchestrator's activation code. The alternative was
# importing it from otto.config.dependencies, which merely re-exports it: that
# would have satisfied tach with an already-declared edge while hiding the real
# dependency, and the honest edge is the one that survives someone moving the
# re-export. It points DOWN (nothing under otto.models imports otto.project)
# and every module otto.models itself depends on is already reachable here.
#
# BOTH RE-MEASURED with forbid_circular_dependencies (2026-08-23), because the
# header says never to quote those numbers by guess: SIXTEEN with these two
# edges and sixteen without them; FIFTEEN with both cli edges cut, either way.
# Neither figure in the header moves. project already reached the component
# without cli (project -> config -> suite -> project), so a second cli-free
# loop through models adds no member and strands nobody new.
depends_on = [
    "otto.registry",
    "otto.result",
    "otto.utils",
    "otto.host",
    "otto.config",
    "otto.context",
    "otto.cli",
    "otto.link",
    "otto.tunnel",
    "otto.errors",
    "otto.models",
]

[[modules]]
path = "otto.registry"

[[modules]]
path = "otto.reservations"
depends_on = ["otto.registry", "otto.utils", "otto.models", "otto.config", "otto.errors"]

[[modules]]
path = "otto.result"
# otto.errors is for CommandNotRunError's OttoError base. Like config's edge
# below, this cannot invert layering or create a cycle: otto.errors is a
# zero-import leaf. The error is defined HERE, not in otto.host.errors with its
# two peers, precisely to avoid a result->host edge -- otto.host depends on
# otto.result, so that direction is both a runtime circular import and one more
# mutually-importing pair added to the inventory the header measures and this
# file is trying to shrink.
depends_on = ["otto.utils", "otto.errors"]

[[modules]]
path = "otto.suite"
# otto.project is the `ensure` marker's converge steps (`_converge` in
# pytest_plugin.py resolves the otto.project function at call time). The edge
# points DOWN — project drives hosts on behalf of a repo, a suite consumes
# that — and it is the point of the layer: `otto run install` and the marker
# call the same function, so the CLI and the suites cannot diverge on what
# "installed" means.
#
# It does complete a LOOP in this file's graph — otto.project -> otto.cli ->
# otto.suite -> otto.project — the one loop in the header's inventory that is
# not a mutually-importing pair, and the reason the header counts loops
# separately from pairs. It is not a runtime cycle:
# only project/instructions.py reaches otto.cli (for the `@instruction`
# decorator), and nothing in otto.suite imports it. Retiring it means giving
# instruction registration a home that is not otto.cli, which is the same fix
# the config<->cli DEBT edge needs and belongs with it, not here.
depends_on = ["otto.context", "otto.config", "otto.lifecycle", "otto.registry", "otto.monitor", "otto.version", "otto.models", "otto.host", "otto.coverage", "otto.params", "otto.errors", "otto.result", "otto.utils", "otto.project"]

[[modules]]
path = "otto.testing"
# otto.inventory / otto.models: assert_inventory_conforms (spec §14, added
# alongside the json backend) checks a candidate against the Inventory
# protocol and its InventoryRecord fields.
depends_on = ["otto.config", "otto.inventory", "otto.labs", "otto.models", "otto.reservations", "otto.host", "otto.suite"]

[[modules]]
path = "otto.tunnel"
# NOTE: no otto.link here (and none the other way) — see otto.link above.
depends_on = ["otto.host", "otto.models", "otto.registry", "otto.lifecycle", "otto.logger", "otto.errors"]

[[modules]]
path = "otto.utils"

[[modules]]
path = "otto.version"

[[modules]]
path = "otto._webassets"
