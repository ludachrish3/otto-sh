# survey) and otto.monitor (the collector) both depend on it; the monitor
# depends on the host, so the GET could not live in either without a cycle.
# pysnmp is function-local, so importing this costs only the stdlib.
depends_on = []

[[modules]]
path = "otto.result"
layer = "foundation"
