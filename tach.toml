[[modules]]
path = "otto.project"
layer = "workflows"
# The project layer sits ABOVE hosts and below the CLI: it drives host verbs
# across the fleet on behalf of one project. Every edge here points down.
#
# otto.host is imported LAZILY inside the methods that dispatch (BaseHost.install
# and friends) — `import otto.project` must stay cheap, because the default
# instructions import it at CLI startup. tach counts a function-scope import as
# an edge regardless, which is why it is declared.
#
# otto.config is TYPE_CHECKING-only here (Project), and otto.context is in
# actions.py (OttoContext): the per-project actions are HANDED both at
# construction and never look either up. The orchestrator DOES look the context
# up -- ambient-context module functions are its whole shape -- but only from
# inside the call (orchestrator._lab), for the same reason otto.host is lazy
# here: `import otto.project` must stay cheap. The scope predicates the
# orchestrator reads come from otto.config.scope, a foundation module, imported
# inside the calls that use them (its ProjectScope annotation is
# TYPE_CHECKING-only). Importing it also runs otto/config/__init__.py, which
# loads otto.config.env.
#
# otto.cli: no edge. The `@instruction` decorator lives in
# otto.instruction_catalog (since the thin-CLI series, 2026-09-28, in
# otto.instructions; since spec 2026-10-11 placement-and-phases §3.2, in the
# catalog below this layer); the loop project -> cli -> suite -> project that
# used to close through it is gone.
#
# otto.instruction_catalog: the tables the project layer reads and the
# first-party slot actions.py fills (declare_first_party_actions, its one
# installer). The catalog sits in foundation and never imports this layer.
#
# otto.link and otto.tunnel are `cleanup`'s last two steps and `is_clean`'s
# last two questions (2026-08-17): a netem impairment and a tunnel belong to
# the LAB rather than to any project, so the orchestrator resets and reaps them
# once, exactly as it does the debug sweep and the toolchain. BOTH EDGES POINT
# DOWN and both are function-scope, in orchestrator.py alone — the four calls
# are `link.manage.repair_all` / `read_link_states` and
# `tunnel.manage.remove_all_tunnels` / `tunnel.discovery.discover_tunnels`,
# each handed `ctx.lab` and nothing else. Neither package knows this one
# exists, so neither edge is a mutual pair, and neither added a member to the
# import cycle. What they did change: project->tunnel is tunnel's one way back
# into the cycle that does not run through otto.cli.
#
# otto.errors is the exception hierarchy's root and a zero-import leaf, so it
# cannot invert layering or create a cycle (otto.config, otto.monitor and
# otto.reservations declare it on the same standing). Module-scope in
# orchestrator.py, deliberately: InactiveRequiredDependencyError is a
# module-level class statement and its base has to be resolved at import time.
# The cost is nil -- otto.errors imports nothing -- so `import otto.project`
# stays as cheap as the note above requires.
#
# otto.models.dependencies is `normalize_name`, the ONE PEP-503 normalizer,
# reached at function scope from orchestrator's activation code. The
# alternative was importing it from otto.config.dependencies, which merely
# re-exports it: that would have satisfied tach with an already-declared edge
# while hiding the real dependency, and the honest edge is the one that
# survives someone moving the re-export. It is a foundation module with no
# dependencies.
#
# Neither edge added a member to the import cycle: otto.project was already
# in it.
#
# otto.docker: `cleanup`'s last per-project step removes what otto staged for
# the project on each docker parent, and the cleanup preview names that step.
# Both reach the docker layer at function scope
# (actions._dispatch_remove_docker_staging, plan._docker_staging_gap); the edge
# points down (workflows -> run), and otto.docker never imports this layer.
depends_on = [
    "otto.registry",
    "otto.docker",
    "otto.result",
    "otto.utils",
    "otto.host",
    "otto.run_context",
    "otto.link",
    "otto.tunnel",
    "otto.errors",
    "otto.instruction_catalog",
    "otto.params",
    # otto.layout: the run-tree paths (a pure leaf).
    "otto.layout",
    "otto.config.scope",
    "otto.models.dependencies",
]

[[modules]]
path = "otto.registry"
layer = "foundation"
# otto.errors: RegistrationRefused roots at OttoError like every named class.
# otto.errors is a leaf with no imports, so no cycle can form.
depends_on = ["otto.errors"]

[[modules]]
path = "otto.reservations"
layer = "sources"
# The reservation gate reads the active run, not the fleet (`otto.fleet`), so the
# package imports nothing of otto.config (spec 2026-10-11 placement-and-phases §3.8).
# otto.invocation: the active run (the slot otto.context installs), which the gate
# reads its lab and its hosts in play from.
# otto.host: the gate leaves the built-in `local` host out of play through the
# owner's identity test, otto.host.builtin_hosts.is_builtin_host. Function-local.
depends_on = ["otto.registry", "otto.utils", "otto.models", "otto.models.base", "otto.errors", "otto.host", "otto.invocation"]

[[modules]]
path = "otto.snmp"
layer = "foundation"
