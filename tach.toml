    # split (Tier 2.5).
    "otto.lifecycle",
    "otto.result",
    "otto.context",
    "otto.instructions",
    # DEBT: the last core->cli backward edge — completion_cache.py imports
    # CLI_COMMANDS + the private _typer_app_flattens (:682/:735) to serialize
    # the command tree. Remove with the completion-cache snapshot() redesign
    # (Tier 2.10). (INSTRUCTIONS moved to otto.instructions 2026-08-03,
    # retiring repo.py's backward import and the sys.modules dodge.)
    "otto.cli",
    "otto.labs",
    # completion_cache resolves the process inventory function-locally, twice:
    # `_inventory_fingerprint` mixes its freshness signal into the digest and
    # `_enumerate_host_summaries` passes it to the enumeration, so a referenced
