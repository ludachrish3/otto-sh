    # NEW CYCLE — otto.inventory imports otto.config for the user settings
    # file — so it is the FOURTEENTH mutually-importing pair and it brings
    # otto.inventory into the strongly connected component as its SEVENTEENTH
    # member. The header's enumeration is the 2026-08-17 snapshot and does not
    # list either; see the correction there. Lazy at both ends, which buys
    # import cost and nothing else: tach and the SCC both count a
    # function-scope import as an edge.
    "otto.inventory",
    # DEBT: survives on fleet.py's DEFAULT_COMMAND_TIMEOUT (Tier 1.7),
    # lab.py's RemoteHost/slug/builtin_hosts, and repo.py's os_profile
    # registration. completion_cache's host-CONSTRUCTION import is gone —
    # it enumerates through LabRepository now — leaving only the
    # import-light builtin_hosts and the term/transfer registries.
    "otto.host",
    "otto.logger",
    # completion_cache reads SUITES; acceptable direction once INSTRUCTIONS
    # joins it in core — revisit with Tier 1.5.
    "otto.suite",
    "otto.link",
    "otto.reservations",
    "otto.bootstrap",
]

