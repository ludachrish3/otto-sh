# consumer; a user's reservation/creds/inventory backend is the second.
depends_on = []

[[modules]]
path = "otto.tunnel"
layer = "topology"
# NOTE: no otto.link here (and none the other way) — see otto.link above.
# otto.check IS allowed: it's the shared check core (otto tunnel check uses
# it the same way otto link check does), and otto.check imports neither.
depends_on = ["otto.host", "otto.models", "otto.registry", "otto.lifecycle", "otto.logger", "otto.errors", "otto.check", "otto.utils"]

[[modules]]
path = "otto.utils"
layer = "foundation"
# Status and the validation errors root at OttoError.
depends_on = ["otto.errors"]

[[modules]]
path = "otto.version"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto._webassets"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.layout"
layer = "foundation"
# The run-tree contract: where each run's directory sits under the xdir, and
# where per-host and per-product artifacts land in it. Pure, and imports no
# other otto module. otto.logger, otto.host, otto.coverage, otto.models,
# otto.project and otto.init read it.
depends_on = []

[[modules]]
path = "otto._shim_complete"
layer = "foundation"
# The TAB answerer: standard library only, imported by the console shim before
# anything else in otto on every TAB. `otto cache` inspects it.
depends_on = []

# The last files to join a module (spec 2026-10-11 placement-and-phases §3.11,
# §5.1): the root package's facade, the lab facade, the env verbs' module and
# the console entry. tach sees no import a file outside every module makes.

[[modules]]
path = "otto"
# The root facade: `import otto` binds a lazy table only; its aliases resolve
# through the namespace facades (tests/unit/test_dynamic_import_audit.py).
layer = "entry"
depends_on = []

[[modules]]
path = "otto.lab"
# The lab and fleet facade: strings only, no import tach sees.
layer = "entry"
depends_on = []

[[modules]]
path = "otto.env"
# The project environments `otto env` manages: settings work, beside discovery,
# which it reads to find the projects.
layer = "composition"
depends_on = [
    "otto.errors",
    "otto.version",
    "otto.config",
    "otto.config.home",
    "otto.models.dependencies",
]

[[modules]]
path = "otto._shim"
# The console entry: answers --version and a warm TAB before importing the CLI.
layer = "entry"
depends_on = ["otto.version", "otto._shim_complete", "otto.cli"]

[[modules]]
path = "otto.__main__"
layer = "entry"
depends_on = ["otto._shim"]
