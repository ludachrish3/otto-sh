# Module-boundary contracts, enforced by `tach check` (Makefile: lint-arch).
#
# This file is the RATCHET BASELINE recorded from the real import graph on
# 2026-08-03 (tach sync), including known-bad edges — marked "DEBT:" below with
# a pointer to the finding in todo/churn-and-design-review-2026-08-03.md.
# The contract is: no NEW cross-module edge may appear without editing this
# file in the same PR; DEBT edges are removed here as their fixes land.
# lint-arch runs `tach check --exact`, so the reverse holds too: an edge no
# import uses fails the gate, and comes out of this file with its last import.
# (tach does not count an `if TYPE_CHECKING:` import as an edge.)
#
# Maintain BY HAND. `tach sync` REWRITES this file and strips every comment —
# never run it to "fix" a check failure; add or (preferably) question the edge.
#
# forbid_circular_dependencies = true: the declared graph has no import cycle
# (#590 took the old one apart), and every file is in a module, so tach fails
# on any new one. docs/architecture/modules.md draws the graph.
#
# Note tach counts function-scope (lazy) imports as edges, same as module
# scope. Scope-sensitive rules (e.g. "models may import config lazily but
# never at module scope") are enforced by ast-grep instead — see
# .ast-grep/rules/.
#
# Layers (spec 2026-10-11 placement-and-phases §2). `layers` lists otto's ten
# role layers, highest first. A module may import its own layer and the ones
# below it, never one above. `layers_explicit_depends_on = true` keeps every
# depends_on list binding downward too: without it tach lets any import into a
# lower layer through undeclared. Every module has a `layer`, and
# tests/unit/test_tach_layers.py fails on one that has none. Every module
# spells its depends_on, [] for one that imports no other: tach reads a
# missing list as "may import anything", and
# scripts/render_module_graph.py refuses one.
#
# tach reads `import` statements only. Imports by string (a facade's lazy
# table, a registry Ref, importlib.import_module) are audited by
# tests/unit/test_dynamic_import_audit.py.

source_roots = ["src"]
forbid_circular_dependencies = true
exclude = ["tests", "docs", "web", "scripts"]

layers_explicit_depends_on = true
layers = [
    "entry",        # cli, testing, examples, the package facades, the shim
    "root",         # the composition root, and the workflows that can start it
    "workflows",    # instructions, project, init, the monitor service
    "run",          # the live run: context, session, fleet accessors, docker
    "composition",  # settings, Project, discovery, the completion cache, env
    "sources",      # where labs, inventory, creds and reservations come from; the lab model and its loader
    "topology",     # link, check, tunnel, the monitor's lower files
    "specs",        # pydantic models for lab, settings and inventory data
    "host",         # connections, transfer, host classes and host specs
    "foundation",   # leaf definitions, slots filled from above, catalogs
]

[[modules]]
path = "otto.bootstrap"
# The composition root (spec 2026-10-11 placement-and-phases §3.9): nothing
# below this layer imports it; the run layer composes through the initiator
# it installs in otto.declared.
layer = "root"
depends_on = [
    "otto.config",
    # bootstrap() declares otto's first-party actions before any project init and
    # checks the merged instruction options after them, each read off its
    # module when called. Function-scope; otto.project sits a layer below.
    "otto.project",
    "otto.errors",
    # Phase-2 registration wraps each project's init imports in
    # `registry.registering_project(name)` so registration seams can attribute an
    # entry to the project that registered it. otto.registry is a foundation
    # leaf (it depends only on otto.errors), so this cannot invert layering or
    # create a cycle.
    "otto.registry",
    # The D2 scope check (2026-08-18) reads the provider registries — the
    # question "did this project register a product/dev-tool provider?" can only
    # be answered by the lists those registration seams append to, and reading
    # them THERE is what keeps one source of truth (a mirrored ledger in a
    # lower module would drift the moment a test cleared one and not the
    # other). Function-scope inside the check, so `import otto.bootstrap`
    # stays as cheap as the import-budget snapshots say it is, and no earlier
    # than after phase 2, when a bootstrap() call has already pulled otto.host
    # in via config's os_profile registration anyway. Adds NO new mutual pair
    # (otto.host does not import otto.bootstrap) and no new module to the
    # import cycle — both ends were already in it.
    "otto.host",
    # otto.config.scope: the error types this module re-exports. otto.declared:
    # the composed-projects catalog bootstrap() publishes into, and the initiator
    # slot this module fills when it is imported (its one installer).
    "otto.config.scope",
    "otto.declared",
    # otto.utils: invalidate() clears the cached root keys (root_key),
    # function-scope; a foundation leaf, so no layer inverts and no cycle closes.
    "otto.utils",
]

[[modules]]
path = "otto.check"
layer = "topology"
# Shared by otto.link and otto.tunnel, so it may import NEITHER (they stay
# decoupled; see the otto.link entry). Host probing only.
depends_on = ["otto.host", "otto.version", "otto.errors", "otto.result"]

[[modules]]
path = "otto.cli"
layer = "entry"
# otto.session: the root callback and invoke.py render the library's typed
# refusals and call its project, lab, dependency and logging decisions.
# otto.inventory: inventory.py's `otto inventory` verbs build, query and cache
# the process inventory. (The lab load's inventory is otto.session.build_lab's.)
# Function-local, because that module is on the budgeted import surfaces.
# otto.kmodcov: cov.py's `kmodcov export`/`kmodcov check` leaves call
# export_tree()/check_tree() to vendor or compare the otto_kmodcov library.
# Function-local, same import-budget reason as otto.inventory above.
# otto.project: run.py's `_project_leaf` reaches `project.commands.body_origins`
# and `project.orchestrator` to dispatch a project instruction. This edge
# points DOWN — the CLI projects the project layer, same as it does every
# other library package — so it is not the loop otto.project's own note
# retires; tach's ratchet just never carried it (the edge is function-scope,
# added when project instructions started registering data instead of a
# make_app factory, and this file was not updated alongside).
# otto.invocation: the root callback installs the run's policy, and
# ensure_lab_context builds the context on it.
# otto._shim_complete: cache.py's inspect verbs read the shim's own answer
# (inspect_shim, inspect_tests).
# otto.labs: the `--lab` grammar (split_lab_names, LAB_SEPARATOR) is the lab
# model's, in otto.labs.loader. Function-local, so no verb's `--help` loads it.
# otto.layout: `otto cov report`'s default --dir and each run dir's cov/ (cov_dir,
# cov_report_dir). Function-local, like otto.labs.
depends_on = ["otto._shim_complete", "otto.invocation", "otto.instruction_catalog", "otto.instructions", "otto.registry", "otto.logger", "otto.link", "otto.link.params", "otto.reservations", "otto.coverage", "otto.tunnel", "otto.utils", "otto.models", "otto.bootstrap", "otto.suite", "otto.monitor", "otto.host", "otto.docker", "otto.config", "otto.inventory", "otto.labs", "otto.kmodcov", "otto.coverage.embedded_gcov", "otto.params", "otto.version", "otto.result", "otto.lifecycle", "otto.run_context", "otto.errors", "otto.check", "otto.project", "otto.init", "otto.env", "otto.session.activation", "otto.session.dependencies", "otto.session.errors", "otto.session.lab", "otto.session.logs", "otto.session.projects", "otto.monitor.errors", "otto.config.scope", "otto.models.dependencies", "otto.config.home", "otto.config.user_settings", "otto.config.corpus_snapshot", "otto.declared", "otto.fleet", "otto.layout"]

[[modules]]
path = "otto.config"
layer = "composition"
depends_on = [
    # completion_cache's containment seam imports `is_containable` to tell a
    # user module that DECLINED to load from one that broke. otto.errors is a
    # zero-import leaf, so this cannot invert layering or create a cycle.
    "otto.errors",
    "otto.models",
    "otto.models.base",
    "otto.instruction_catalog",
    "otto.labs",
    # completion_cache resolves the process inventory function-locally, twice:
    # `_inventory_fingerprint` mixes its freshness signal into the digest and
    # `_enumerate_host_summaries` passes it to the enumeration, so a referenced
    # host completes (spec 2026-08-28 host-inventory §11). A downward edge:
    # otto.inventory reads the user settings file and the home through
    # otto.config.user_settings and otto.config.home, modules of their own, and
    # the settings file's name from the foundation otto.config.scope, so it
    # imports nothing else of otto.config (spec 2026-10-11 placement-and-phases
    # §3.6).
    "otto.inventory",
    # The completion cache and its sections and tree, function-locally:
    # otto.host.os_profile's profile context, host classes and profiles,
    # otto.host.builtin_hosts' ids, and the term and transfer registries
    # (otto.host.connections, otto.host.transfer). completion_cache's
    # host-CONSTRUCTION import is gone — it enumerates through
    # LabRepository now. Downward: the composition layer reads the host layer.
    "otto.host",
    "otto.link",
    "otto.reservations",
    # project.py's collection pass marks itself as loading test files, so a test
    # file or conftest that registers anything is refused there too. A leaf
    # (it depends only on otto.errors), so no cycle can form.
    "otto.registry",
    "otto.config.scope",
    "otto.models.dependencies",
    # otto.utils: the completion cache's collection child spells and collapses
    # the path-list variables with the one rule kept_path_spelling and
    # collapse_path_list define.
    "otto.utils",
    # otto.config.home: the completion cache lives in the workspace home.
    "otto.config.home",
    # otto.config.user_settings: the cache reads cache.enabled, and the shim
    # payload and the names digest the settings file's one memoized stat.
    "otto.config.user_settings",
    # otto.config.corpus_snapshot: the one stat classification every digest
    # and stored stat triple uses.
    "otto.config.corpus_snapshot",
]

[[modules]]
path = "otto.config.corpus_snapshot"
layer = "foundation"
# The one stat classification (absent, unreadable or a stat) and its per-rebuild
# memo. The standard library only, so the settings load and the json sources'
# fingerprints classify a stat exactly as the completion cache does. Its
# ancestor otto/config/__init__.py stays lazy (§4.3) bar one eager import,
# otto.config.env, so importing this module loads that too: every importer
# below otto.config does so inside a function.
depends_on = []

[[modules]]
path = "otto.config.home"
layer = "specs"
# otto's user-level home and the workspace key that shards it: the one owner of
# every path under ~/.otto (spec 2026-10-11 placement-and-phases §2.2, §3.6).
# A module of its own, so the inventory and the suite read it without importing
# otto.config. It reads OTTO_HOME and OTTOPATH through the env settings
# model, and normalizes the workspace slug, inside its functions. Its ancestor
# otto/config/__init__.py stays lazy (§4.3) bar one eager import,
# otto.config.env, so importing this module loads that too.
depends_on = [
    "otto.models",
    "otto.models.dependencies",
    # otto.utils: _normalized() keys the workspace through kept_path_spelling and
    # the cached root_key, function-scope; a foundation leaf, so no cycle closes.
    "otto.utils",
]

[[modules]]
path = "otto.config.scope"
layer = "foundation"
# The one membership predicate, its config and resolver, the composition
# root's error types (spec 2026-10-11 placement-and-phases §3.5), and the
# runtime settings types the project loader holds and the settings specs build
# (§3.6). Foundation, so the host layer's ingest gate and otto.declared may
# import it. Its
# ancestor otto/config/__init__.py stays lazy (§4.3) bar one eager import,
# otto.config.env, so importing this module loads that too.
# otto.models.dependencies is read inside the functions that normalize a project
# name.
depends_on = ["otto.errors", "otto.models.dependencies"]

[[modules]]
path = "otto.config.user_settings"
layer = "specs"
# The user-level ~/.otto/settings.toml, read through its settings model, under
# the home otto.config.home owns (spec 2026-10-11 placement-and-phases §2.2,
# §3.6). A module of its own, so the inventory reads the user file without
# importing otto.config. Its ancestor's one eager import, otto.config.env,
# loads with it (§4.3). otto.models.base parses the file
# (load_toml_settings), so a secret in it is wrapped from the parse on.
# otto.config.corpus_snapshot classifies the file's stat, function-locally;
# otto.utils writes `otto cache enable/disable`'s edit atomically.
depends_on = ["otto.config.home", "otto.models", "otto.models.base", "otto.config.corpus_snapshot", "otto.utils"]

[[modules]]
path = "otto.console"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.context"
# The public facade of the run context (spec 2026-10-11 placement-and-phases
# §3.11, §3.12): a lazy table over otto.run_context and otto.invocation, whose
# resolver imports the composition root before it returns OttoContext or
# open_context, the two names that compose with no run in hand.
layer = "entry"
depends_on = ["otto.bootstrap"]

[[modules]]
path = "otto.run_context"
# The run context itself; otto's own code imports it from here, never through
# the facade (see otto.context for the routes around it). It composes through
# otto.declared's initiator and never imports the composition root.
# run_context -> config is one-way: the fleet, which read the context, left
# otto.config. run_context -> host is one-way: the host layer stopped
# importing the context when each loop's host registry moved to
# otto.invocation.
layer = "run"
depends_on = [
    "otto.config",
    "otto.host",
    # The composed state: compose() starts composition through the initiator.
    "otto.declared",
    # ctx.options resolves the per-verb options registry at call time, and
    # OptionsNotAvailableError now lives there too (otto.params already roots
    # its own OptionsRegistrationError/OptionsCollisionError at OttoError).
    "otto.params",
    # open_context makes the CLI's decisions through otto.session's files: project
    # selection, the bootstrap gate, the lab build and the dependency preflight.
    "otto.session.dependencies",
    "otto.session.errors",
    "otto.session.lab",
    "otto.session.projects",
    # open_context applies the reservation gate the CLI preamble applies
    # (build_reservation_gate + ReservationGate.evaluate). Function-local, and
    # downward: otto.reservations reads the active run, not the context.
    "otto.reservations",
    # The context composes the leaf's run policy, resolver and bindings.
    "otto.invocation",
    "otto.config.scope",
    # open_context splits a lab selection and wraps a given lab with the lab
    # model in otto.labs.loader. Function-local; otto.labs is outside the cycle.
    "otto.labs",
]

[[modules]]
path = "otto.coverage"
layer = "root"
# otto.models.base: the capture artifact's models subclass OttoModel so their
# schema builds on first use, not at import. A foundation leaf, so no cycle.
depends_on = [
    "otto.utils",
    "otto.host",
    "otto._webassets",
    "otto.config",
    "otto.version",
    "otto.errors",
    "otto.models.base",
    # embedded_finish strips with the section list the embedded-gcov area holds once.
    "otto.coverage.embedded_gcov",
    # clean_coverage and the product reset hooks build per-product Result
    # values for the CleanReport. otto.result is a leaf (otto.utils,
    # otto.errors) that otto.docker already depends on, so no cycle.
    "otto.result",
    # get_coverage reads try_get_context() for the per-invocation output
    # directory, function-locally, as otto.suite.run already does.
    # otto.context does not depend on otto.coverage, so no cycle.
    "otto.run_context",
    # otto.layout: the run-tree paths (a pure leaf).
    "otto.layout",
    # otto.logger: the lcov capture runs quiet (LogMode) and names the
    # verbose log its full output went to (verbose_log_path). A foundation
    # module that depends only on otto.console and otto.layout, so no cycle.
    "otto.logger",
    "otto.config.scope",
    # otto.declared: the run's projects when no projects are given (current_projects),
    # the composed state's home (spec 2026-10-11 placement-and-phases §3.9).
    "otto.declared",
    # otto.fleet: the hosts coverage cleans and collects from (all_hosts,
    # do_for_all_hosts), the fleet's walks.
    "otto.fleet",
    # otto.bootstrap: clean_coverage, collect_coverage and get_coverage load the
    # composition root when no projects are given, so their read of the run's projects
    # composes them as it always did (spec 2026-10-11 placement-and-phases
    # §3.12). Same layer: root to root.
    "otto.bootstrap",
]

[[modules]]
path = "otto.creds"
layer = "sources"
# The creds-store seam (spec 2026-09-06 creds-store §5). Sits BENEATH
# otto.inventory, which imports it function-locally from the bootstrap path;
# this package never imports otto.inventory — one-way by construction. Every
# dependency here is a leaf or a boundary-model package.
depends_on = ["otto.errors", "otto.models", "otto.models.base", "otto.registry", "otto.utils"]

[[modules]]
path = "otto.declared"
layer = "foundation"
# The declared-entry core and the composed-projects catalog with its initiator
# slot (spec 2026-10-11 placement-and-phases §2.1, §3.5): otto.bootstrap
# publishes into it and installs the initiator; nothing here imports the root.
# The scope predicate and the run policy are read inside the functions that
# need them.
depends_on = ["otto.config.scope", "otto.invocation", "otto.registry"]

[[modules]]
path = "otto.docker"
layer = "run"
depends_on = [
    "otto.host",
    "otto.models",
    "otto.lifecycle",
    "otto.utils",
    "otto.config",
    "otto.result",
    # UseCaseResolutionError roots on OttoError, because the project's
    # `test_every_public_exception_in_src_is_ottoerror_rooted` guard requires
    # every public exception in src/otto to. Same standing as otto.result's
    # edge below: otto.errors is a zero-import leaf, so this can neither
    # invert layering nor create a cycle.
    "otto.errors",
    # `register_compose_adapter` is a registration seam — it writes into a
    # Registry and attributes the entry to the registering project, exactly as
    # every other registration seam in the tree does (docker use-cases spec
    # §5). otto.registry is a foundation leaf too (see otto.bootstrap's note
    # above), so the same no-cycle argument holds.
    "otto.registry",
    # The observe verbs run docker's own command with LogMode.QUIET so the
    # console does not relay a listing the verb then prints itself. otto.logger
    # depends only on otto.console and otto.layout, so this edge cannot make a cycle.
    "otto.logger",
    "otto.config.scope",
    # otto.declared: the run's projects (current_projects, current_ordered_projects).
    "otto.declared",
    # otto.invocation: the active run's lab (require_run), never the
    # fleet at otto.fleet (spec 2026-10-11 placement-and-phases §3.9).
    "otto.invocation",
]

[[modules]]
path = "otto.errors"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.examples"
layer = "entry"
# otto.inventory: the reference LabRepository resolves each record through
# `resolve_host_entry` — the sample IS the documentation of how a backend
# honours `inventory=` (spec 2026-08-28 host-inventory §6).
# otto.models: the sample lab source's config model subclasses OttoModel, as
# every otto pydantic model does (defer_build), so the copyable sample shows
# the public base a backend's config model uses.
# otto.monitor.parsers: the sample metric parser subclasses MetricParser.
# otto.lab, otto: the samples are taught code, so they spell the public facades
# (`from otto.lab import ...`, `from otto import options`).
depends_on = ["otto.reservations", "otto.host", "otto.monitor.parsers", "otto.labs", "otto.inventory", "otto.models", "otto.lab", "otto"]

[[modules]]
path = "otto.fleet"
layer = "run"
# The fleet: the active lab and its hosts, the walks over the run's fleet of
# interest, and the reservation readers' hosts in play (spec 2026-10-11
# placement-and-phases §3.9). It reads the context (otto.context), the scope
# predicate (otto.config.scope), the host layer (otto.host: otto.host.host's
# DEFAULT_COMMAND_TIMEOUT and the built-in host test in otto.host.builtin_hosts)
# and the gate's own in-play computation (otto.reservations), each within or
# below the run layer.
# DEBT: the otto.host edge's module-scope half is fleet.py's
# DEFAULT_COMMAND_TIMEOUT default (Tier 1.7).
depends_on = ["otto.config.scope", "otto.run_context", "otto.host", "otto.reservations"]

[[modules]]
path = "otto.filesystem"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.init"
layer = "workflows"
# The `otto init` doctor and scaffolder (NOT settings.toml's `init` key, which
# names init modules). Every edge is a real import, added with the code that
# introduced it.
depends_on = [
    "otto.errors",
    "otto.config",
    # otto.config.scope: TOML_SETTINGS_PATH, the settings file the doctor checks
    # and the scaffolder writes.
    "otto.config.scope",
    "otto.utils",
    "otto.models",
    "otto.models.base",
    "otto.labs",
    "otto.inventory",
    "otto.host",
    "otto.kmodcov",
    # otto.coverage.embedded_gcov: the embedded-gcov area exports, detects and
    # compares the shipped patch through library.py.
    "otto.coverage.embedded_gcov",
    # otto.layout: the run-output directory the scaffolded ignore files name.
    "otto.layout",
    # otto.config.user_settings: the doctor reads the user settings file.
    "otto.config.user_settings",
]

[[modules]]
path = "otto.session"
# The facade of the decisions that prepare a run, shared by `otto --lab X <verb>`
# and `otto.open_context` (spec 2026-10-11 placement-and-phases §3.11): a lazy
# table over the six files below, whose bindings tach does not see
# (tests/unit/test_dynamic_import_audit.py audits them).
layer = "entry"
depends_on = []

# Session's six files, one tach module each (spec 2026-10-11 placement-and-phases
# §3.11). They are not one module with the facade: the facade sits at entry,
# above every layer it exports from, and its files sit at their own layers, so
# a binding is a downward edge. Folding them into the facade's module would put
# the run layer's decisions at entry, and otto.run_context, which makes them,
# could no longer import them. Every heavy edge (inventory, docker, labs, env,
# host) is a function-local import, so a Lab-object open_context never pays for
# them.

[[modules]]
path = "otto.session.errors"
layer = "run"
depends_on = ["otto.errors"]

[[modules]]
path = "otto.session.activation"
layer = "run"
depends_on = ["otto.session.errors", "otto.config.scope", "otto.models.dependencies"]

[[modules]]
path = "otto.session.dependencies"
layer = "run"
# otto.env: the dependency preflight reads each project's ``[project]`` table.
depends_on = ["otto.session.errors", "otto.config.scope", "otto.env"]

[[modules]]
path = "otto.session.lab"
layer = "run"
# otto.config: function-local, only when no project was discovered at all, for
# the one no-project message every surface shares (no_project_found_message).
depends_on = ["otto.session.errors", "otto.labs", "otto.inventory", "otto.docker", "otto.config"]

[[modules]]
path = "otto.session.projects"
layer = "run"
depends_on = ["otto.session.errors", "otto.config.scope", "otto.models.dependencies"]

[[modules]]
path = "otto.session.logs"
# Root, not run: install_logging is a library entry point that reads the projects
# with no run in hand, so it imports the composition root when called (spec
# 2026-10-11 placement-and-phases §3.12). Only the CLI and the facade import it.
layer = "root"
depends_on = [
    "otto.session.errors",
    "otto.bootstrap",
    "otto.declared",
    "otto.host",
    "otto.logger",
]
[[modules]]
path = "otto.instruction_catalog"
layer = "foundation"
# The instruction tables, the @instruction decorator and their checks: data and
# rules, read by every layer above (Project's panel, the completion cache, the
# project layer, the CLI). Its first-party slot, FIRST_PARTY_ACTIONS, is filled
# from above by otto.project.actions, its one installer (spec 2026-10-11
# placement-and-phases §2.1, §3.2); the catalog never imports the project layer.
depends_on = ["otto.errors", "otto.registry"]

[[modules]]
path = "otto.instructions"
layer = "workflows"
# The execution face: run_instruction and bind_handler_kwargs, over the catalog.
# otto.context, otto.params and otto.project are all function-scope, inside
# bind_handler_kwargs (context, params) and run_instruction (context, params,
# project): importing the face stays cheap, and only calling an instruction
# pulls the binding machinery and the orchestrator in. run_instruction also
# declares otto's first-party actions (otto.project.actions) before its lookup.
# otto.session.activation: run_instruction asks check_instruction_active whether the owning
# project is active in the context. Function-scope, like the edges above.
depends_on = ["otto.instruction_catalog", "otto.run_context", "otto.params", "otto.project", "otto.session.activation"]

[[modules]]
path = "otto.host"
layer = "host"
depends_on = [
    "otto.logger",
