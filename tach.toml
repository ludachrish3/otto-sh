# Module-boundary contracts, enforced by `tach check` (Makefile: lint-arch).
#
# This file is the RATCHET BASELINE recorded from the real import graph on
# 2026-08-03 (tach sync), including known-bad edges — marked "DEBT:" below with
# a pointer to the finding in todo/churn-and-design-review-2026-08-03.md.
# The contract is: no NEW cross-module edge may appear without editing this
# file in the same PR; DEBT edges are removed here as their fixes land.
#
# Maintain BY HAND. `tach sync` REWRITES this file and strips every comment —
# never run it to "fix" a check failure; add or (preferably) question the edge.
#
# End state: forbid_circular_dependencies = true. Blocked today by far more
# than the four edges this line used to name. MEASURED by setting the flag and
# running `tach check` (2026-08-17): SIXTEEN of the modules below are in one
# strongly connected component — bootstrap, cli, config, context, coverage,
# docker, host, labs, lifecycle, link, models, monitor, project, reservations,
# suite, tunnel. THIRTEEN mutually-importing pairs run through it:
#
#   bootstrap<->config, cli<->config, config<->context, config<->host,
#   config<->labs, config<->lifecycle, config<->models, config<->reservations,
#   config<->suite, context<->host, docker<->host, host<->models, link<->models
#
# THAT ENUMERATION IS A 2026-08-17 SNAPSHOT AND ONE PAIR POST-DATES IT.
# 2026-08-28 (host-inventory §6/§8/§11) added config<->inventory: otto.inventory
# already read otto.config for the user settings file, and otto.config.
# completion_cache now resolves the inventory for the digest and the host
# enumeration. So the component is SEVENTEEN modules (the sixteen above plus
# inventory) and FOURTEEN mutually-importing pairs. Both ends of the new pair
# import lazily, which changes nothing here: tach counts function-scope
# imports as edges (see the note at the end of this header), and so does the
# SCC. NOT re-measured with the flag — the two figures above are arithmetic on
# the snapshot, not a fresh `tach check --forbid-circular` run; re-measure
# before quoting the "cut both cli edges" numbers below, which were.
#
# THOSE PAIRS ARE NOT THE WHOLE FORMATION — they account for only TWELVE of the
# sixteen. The other four join through longer loops that contain no mutual pair
# of their own:
#
#   project  -> cli -> suite -> project          (documented on otto.suite below)
#   coverage -> config -> cli -> coverage
#   monitor  -> host -> config -> cli -> monitor
#   tunnel   -> host -> config -> cli -> tunnel
#   tunnel   -> host -> config -> suite -> project -> tunnel   (2026-08-17)
#
# Every one of those closed through otto.cli until the project->link/tunnel
# edges landed (2026-08-17, `otto run cleanup` resetting impairments and
# reaping tunnels — see otto.project below). The last line is the one that does
# not, and it is why the both-cuts figure below moved.
#
# FOUR OF THOSE PAIRS HAVE OWNERS, and are the ones the DEBT/NOTE comments in
# this file track: cli<->config, config<->context, context<->host and
# docker<->host (spelled host<->context and host<->docker down there). The rest
# is recorded here so that the marked backlog is never mistaken for the whole
# count. EXPECT NO SINGLE-EDGE FIX: otto.cli has exactly two inbound edges from
# inside the component (config->cli and project->cli), and cutting EITHER alone
# leaves it at sixteen — measured. Cutting both drops it to FIFTEEN, which is
# where the real work starts rather than ends. Re-measure with the flag before
# quoting any of these numbers; never adjust them by guess.
#
# THAT LAST FIGURE WAS FOURTEEN until 2026-08-17, and what moved it belongs in
# writing because nothing else in this file would show it: with both cli edges
# cut, otto.cli and otto.tunnel used to leave the component together — tunnel's
# only loop ran through cli. The project->tunnel edge added that day gives it a
# second one that does not (the fifth loop above), so cutting cli out now
# strands cli alone. All four states re-measured the same day: sixteen with the
# new edges, sixteen with either cli edge cut, fifteen with both.
#
# Note tach counts function-scope (lazy) imports as edges, same as module
# scope. Scope-sensitive rules (e.g. "models may import config lazily but
# never at module scope") are enforced by ast-grep instead — see
# .ast-grep/rules/.

source_roots = ["src"]
exclude = ["tests", "docs", "web", "scripts"]

[[modules]]
path = "otto.bootstrap"
depends_on = [
    "otto.config",
    "otto.errors",
    # Phase-2 registration wraps each repo's init imports in
    # `registry.registering_repo(name)` so registration seams can attribute an
    # entry to the repo that registered it. otto.registry is a zero-import
    # leaf (same standing as otto.errors), so this cannot invert layering or
    # create a cycle.
    "otto.registry",
    # The D2 scope check (2026-08-18) reads the provider registries — the
    # question "did this repo register a product/dev-tool provider?" can only
    # be answered by the lists those registration seams append to, and reading
    # them THERE is what keeps one source of truth (a mirrored ledger in a
    # lower module would drift the moment a test cleared one and not the
    # other). Function-scope inside the check, so `import otto.bootstrap`
    # stays as cheap as the import-budget snapshots say it is, and no earlier
    # than after phase 2, when a bootstrap() call has already pulled otto.host
    # in via config's os_profile registration anyway. Adds NO new mutual pair
    # (otto.host does not import otto.bootstrap) and no new module to the
    # sixteen-member component — both ends were already in it.
    "otto.host",
]

[[modules]]
path = "otto.cli"
# otto.inventory: invoke.py's `build_lab_from_repos` resolves the process
