# Module-boundary contracts, enforced by `tach check` (Makefile: lint-arch).
#
# This file is the RATCHET BASELINE recorded from the real import graph on
# 2026-08-03 (tach sync), including known-bad edges — marked "DEBT:" below with
# a pointer to the finding in todo/churn-and-design-review-2026-08-03.md.
# The contract is: no NEW cross-module edge may appear without editing this
# file in the same PR; DEBT edges are removed here as their fixes land.
#
# Maintain BY HAND. `tach sync` REWRITES this file and strips every comment —
# never run it to "fix" a check failure; add or (preferably) question the edge.
#
# End state: forbid_circular_dependencies = true. Blocked today by the cycles
# marked below (host<->docker, config<->cli, config<->context, host<->context).
#
# Note tach counts function-scope (lazy) imports as edges, same as module
# scope. Scope-sensitive rules (e.g. "models may import config lazily but
# never at module scope") are enforced by ast-grep instead — see
# .ast-grep/rules/.

source_roots = ["src"]
exclude = ["tests", "docs", "web", "scripts"]

[[modules]]
path = "otto.bootstrap"
depends_on = ["otto.config", "otto.errors"]

[[modules]]
path = "otto.cli"
depends_on = ["otto.instructions", "otto.registry", "otto.logger", "otto.link", "otto.reservations", "otto.coverage", "otto.tunnel", "otto.utils", "otto.models", "otto.bootstrap", "otto.suite", "otto.monitor", "otto.host", "otto.docker", "otto.config", "otto.params", "otto.version", "otto.labs", "otto.result", "otto.lifecycle", "otto.context", "otto.errors"]

[[modules]]
path = "otto.config"
depends_on = [
    # completion_cache's containment seam imports `is_containable` to tell a
    # user module that DECLINED to load from one that broke. otto.errors is a
    # zero-import leaf, so this cannot invert layering or create a cycle.
    "otto.errors",
    "otto.utils",
    "otto.models",
    # DEBT: repo.py git-description properties trigger run_command from a
    # property getter (cross-cutting review Q8); reconsider with the repo.py
    # split (Tier 2.5).
    "otto.lifecycle",
    "otto.result",
    "otto.context",
    "otto.instructions",
    # DEBT: the last core->cli backward edge — completion_cache.py imports
    # CLI_COMMANDS + the private _typer_app_flattens (:682/:735) to serialize
    # the command tree. Remove with the completion-cache snapshot() redesign
    # (Tier 2.10). (INSTRUCTIONS moved to otto.instructions 2026-08-03,
    # retiring repo.py's backward import and the sys.modules dodge.)
    "otto.cli",
    "otto.labs",
    # DEBT: survives on fleet.py's DEFAULT_COMMAND_TIMEOUT (Tier 1.7),
    # lab.py's RemoteHost/slug/builtin_hosts, and repo.py's os_profile
    # registration. completion_cache's host-CONSTRUCTION import is gone —
    # it enumerates through LabRepository now — leaving only the
    # import-light builtin_hosts and the term/transfer registries.
    "otto.host",
    "otto.logger",
    # completion_cache reads SUITES; acceptable direction once INSTRUCTIONS
    # joins it in core — revisit with Tier 1.5.
    "otto.suite",
    "otto.link",
    "otto.reservations",
    "otto.bootstrap",
]

[[modules]]
path = "otto.console"

[[modules]]
path = "otto.context"
# NOTE: context<->config and context<->host are known cycles held apart by
# lazy imports (context.py:178-184). Dropping `timeout` from run_on_all_hosts
# (Tier 1.7) removes the host edge's worst justification.
depends_on = ["otto.config", "otto.host", "otto.bootstrap"]

[[modules]]
path = "otto.coverage"
depends_on = ["otto.utils", "otto.host", "otto._webassets", "otto.config", "otto.version", "otto.errors"]

[[modules]]
path = "otto.docker"
depends_on = ["otto.host", "otto.models", "otto.lifecycle", "otto.utils", "otto.config", "otto.result"]

[[modules]]
path = "otto.errors"

[[modules]]
path = "otto.examples"
depends_on = ["otto.reservations", "otto.host", "otto.monitor", "otto.labs", "otto.config", "otto.context"]

[[modules]]
path = "otto.filesystem"

[[modules]]
path = "otto.instructions"
depends_on = ["otto.registry"]

[[modules]]
path = "otto.host"
depends_on = [
    "otto.logger",
    "otto.models",
    "otto.lifecycle",
    # DEBT: half of the host<->docker cycle — docker_host.py:251 lazily calls
    # compose_up. The compose bridge belongs above both packages.
    "otto.docker",
    "otto.console",
    "otto.result",
    "otto.utils",
    # DEBT: half of the host<->context cycle — interact imports try_get_context
    # at module scope (context.py:178 documents the workaround).
    "otto.context",
    "otto.config",
    "otto.registry",
    "otto.errors",
]

[[modules]]
path = "otto.labs"
depends_on = ["otto.registry", "otto.link", "otto.config", "otto.models", "otto.host", "otto.errors"]

[[modules]]
path = "otto.lifecycle"
# otto.logger: sync_phase resolves shutdown_listener EAGERLY at entry so the
# forced exit path (os._exit skips atexit) can flush the queue listener
# without importing inside a signal handler.
depends_on = ["otto.config", "otto.context", "otto.logger"]

[[modules]]
path = "otto.link"
# NOTE: no otto.tunnel here — the packages are fully decoupled via
# otto.host.daemon (July finding a1/a3, FIXED). Keep it that way.
depends_on = ["otto.lifecycle", "otto.logger", "otto.registry", "otto.models", "otto.host", "otto.errors"]

[[modules]]
path = "otto.logger"
depends_on = ["otto.console"]

[[modules]]
path = "otto.models"
depends_on = [
    "otto.utils",
    "otto.link",
    # ALLOWED LAZILY ONLY: to_runtime() bodies import config.repo at function
    # scope. The module-scope ban is enforced by ast-grep
    # (models-no-module-scope-config-import) since tach cannot distinguish
    # scope.
    "otto.config",
    "otto.logger",
    # (models -> coverage edge removed 2026-08-03: validate_color moved to
    # otto.models.color, closing the layer inversion.)
    # DEBT: models/__init__.py imports host.os_profile BEFORE .host as an
    # import-order hack (todo/registry_builtin_registration_symmetry.md).
    "otto.host",
]

[[modules]]
path = "otto.monitor"
# NOTE: no otto.tunnel here — tunnel discovery is INJECTED via the
# tunnel_source callable (collector.py:150). Keep it that way.
# otto.utils: server.py's internal uvicorn wait runs through wait_for_async
# (gate G6 — the one sanctioned poll spelling); utils is a foundational leaf
# monitor already reached transitively via otto.host.
depends_on = ["otto.host", "otto.models", "otto._webassets", "otto.result", "otto.link", "otto.filesystem", "otto.registry", "otto.logger", "otto.console", "otto.errors", "otto.utils"]

[[modules]]
path = "otto.params"

[[modules]]
path = "otto.registry"

[[modules]]
path = "otto.reservations"
depends_on = ["otto.registry", "otto.utils", "otto.models", "otto.config", "otto.errors"]

[[modules]]
path = "otto.result"
# otto.errors is for CommandNotRunError's OttoError base. Like config's edge
# below, this cannot invert layering or create a cycle: otto.errors is a
# zero-import leaf. The error is defined HERE, not in otto.host.errors with its
# two peers, precisely to avoid a result->host edge -- otto.host depends on
# otto.result, so that direction is both a runtime circular import and a fifth
# cycle against the four this file is trying to retire.
depends_on = ["otto.utils", "otto.errors"]

[[modules]]
path = "otto.suite"
depends_on = ["otto.context", "otto.config", "otto.lifecycle", "otto.registry", "otto.monitor", "otto.version", "otto.models", "otto.host", "otto.coverage", "otto.params", "otto.errors", "otto.result", "otto.utils"]

[[modules]]
path = "otto.testing"
depends_on = ["otto.config", "otto.labs", "otto.reservations", "otto.host", "otto.suite"]

[[modules]]
path = "otto.tunnel"
# NOTE: no otto.link here (and none the other way) — see otto.link above.
depends_on = ["otto.host", "otto.models", "otto.registry", "otto.lifecycle", "otto.logger", "otto.errors"]

[[modules]]
path = "otto.utils"

[[modules]]
path = "otto.version"

[[modules]]
path = "otto._webassets"
