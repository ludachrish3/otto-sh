# Module-boundary contracts, enforced by `tach check` (Makefile: lint-arch).
#
# This file is the RATCHET BASELINE recorded from the real import graph on
# 2026-08-03 (tach sync), including known-bad edges — marked "DEBT:" below with
# a pointer to the finding in todo/churn-and-design-review-2026-08-03.md.
# The contract is: no NEW cross-module edge may appear without editing this
# file in the same PR; DEBT edges are removed here as their fixes land.
# lint-arch runs `tach check --exact`, so the reverse holds too: an edge no
# import uses fails the gate, and comes out of this file with its last import.
# (tach does not count an `if TYPE_CHECKING:` import as an edge.)
#
# Maintain BY HAND. `tach sync` REWRITES this file and strips every comment —
# never run it to "fix" a check failure; add or (preferably) question the edge.
#
# End state: forbid_circular_dependencies = true. An import cycle keeps it
# off: a set of modules that can all reach each other through the edges below.
# tests/unit/test_import_cycle_ratchet.py (run by lint-arch) is the record of
# that cycle. It pins which modules are in it and which edges run inside it,
# and both lists can only shrink, so a module that joins the cycle, or a new
# edge between two of its members, fails the gate. Read the numbers there, not
# here: this header used to keep them in prose, and the cycle grew from sixteen
# members to twenty-three with nobody deciding it should (#522).
# docs/architecture/modules.md draws the cycle and the pairs of modules that
# import each other; #590 tracks taking it apart.
#
# Note tach counts function-scope (lazy) imports as edges, same as module
# scope. Scope-sensitive rules (e.g. "models may import config lazily but
# never at module scope") are enforced by ast-grep instead — see
# .ast-grep/rules/.
#
# Layers (spec 2026-10-11 placement-and-phases §2). `layers` lists otto's ten
# role layers, highest first. A module may import its own layer and the ones
# below it, never one above. `layers_explicit_depends_on = true` keeps every
# depends_on list binding downward too: without it tach lets any import into a
# lower layer through undeclared. A module in the import cycle has no `layer`
# yet, which exempts it; it takes its layer in the commit that frees it, and
# tests/unit/test_tach_layers.py fails on a module outside the cycle that has
# none. Every module spells its depends_on, [] for one that imports no other:
# tach reads a missing list as "may import anything", and
# scripts/render_module_graph.py refuses one.
#
# tach reads `import` statements only. Imports by string (a facade's lazy
# table, a registry Ref, importlib.import_module) are audited by
# tests/unit/test_dynamic_import_audit.py.

source_roots = ["src"]
exclude = ["tests", "docs", "web", "scripts"]

layers_explicit_depends_on = true
layers = [
    "entry",        # cli, testing, examples, the package facades, the shim
    "root",         # the composition root, and the workflows that can start it
    "workflows",    # instructions, project, init, the monitor service
    "run",          # the live run: context, session, fleet accessors, docker
    "composition",  # settings, Repo, discovery, the completion cache, env
    "sources",      # where labs, inventory, creds and reservations come from; the lab model and its loader
    "topology",     # link, check, tunnel, the monitor's lower files
    "specs",        # pydantic models for lab, settings and inventory data
    "host",         # connections, transfer, host classes and host specs
    "foundation",   # leaf definitions, slots filled from above, catalogs
]

[[modules]]
path = "otto.bootstrap"
depends_on = [
    "otto.config",
    "otto.errors",
    # Phase-2 registration wraps each repo's init imports in
    # `registry.registering_repo(name)` so registration seams can attribute an
    # entry to the repo that registered it. otto.registry is a foundation
    # leaf (it depends only on otto.errors), so this cannot invert layering or
    # create a cycle.
    "otto.registry",
    # The D2 scope check (2026-08-18) reads the provider registries — the
    # question "did this repo register a product/dev-tool provider?" can only
    # be answered by the lists those registration seams append to, and reading
    # them THERE is what keeps one source of truth (a mirrored ledger in a
    # lower module would drift the moment a test cleared one and not the
    # other). Function-scope inside the check, so `import otto.bootstrap`
    # stays as cheap as the import-budget snapshots say it is, and no earlier
    # than after phase 2, when a bootstrap() call has already pulled otto.host
    # in via config's os_profile registration anyway. Adds NO new mutual pair
    # (otto.host does not import otto.bootstrap) and no new module to the
    # import cycle — both ends were already in it.
    "otto.host",
    # otto.config.scope: the error types this module re-exports. otto.declared:
    # the composed-repos catalog bootstrap() publishes into, and the initiator
    # slot this module fills when it is imported (its one installer).
    "otto.config.scope",
    "otto.declared",
]

[[modules]]
path = "otto.check"
layer = "topology"
# Shared by otto.link and otto.tunnel, so it may import NEITHER (they stay
# decoupled; see the otto.link entry). Host probing only.
depends_on = ["otto.host", "otto.logger", "otto.version", "otto.errors", "otto.result"]

[[modules]]
path = "otto.cli"
layer = "entry"
# otto.session: the root callback and invoke.py render the library's typed
# refusals and call its project, repo, lab, dependency and logging decisions.
# otto.inventory: inventory.py's `otto inventory` verbs build, query and cache
# the process inventory. (The lab load's inventory is otto.session.build_lab's.)
# Function-local, because that module is on the budgeted import surfaces.
# otto.kmodcov: cov.py's `kmodcov export`/`kmodcov check` leaves call
# export_tree()/check_tree() to vendor or compare the otto_kmodcov library.
# Function-local, same import-budget reason as otto.inventory above.
# otto.project: run.py's `_project_leaf` reaches `project.commands.body_origins`
# and `project.orchestrator` to dispatch a project instruction. This edge
# points DOWN — the CLI projects the project layer, same as it does every
# other library package — so it is not the loop otto.project's own note
# retires; tach's ratchet just never carried it (the edge is function-scope,
# added when project instructions started registering data instead of a
# make_app factory, and this file was not updated alongside).
# otto.invocation: the root callback installs the run's policy, and
# ensure_lab_context builds the context on it.
# otto._shim_complete: cache.py's inspect verbs read the shim's own answer
# (inspect_shim, inspect_tests).
# otto.labs: the `--lab` grammar (split_lab_names, LAB_SEPARATOR) is the lab
# model's, in otto.labs.loader. Function-local, so no verb's `--help` loads it.
depends_on = ["otto._shim_complete", "otto.invocation", "otto.instruction_catalog", "otto.instructions", "otto.registry", "otto.logger", "otto.link", "otto.link.params", "otto.reservations", "otto.coverage", "otto.tunnel", "otto.utils", "otto.models", "otto.bootstrap", "otto.suite", "otto.monitor", "otto.host", "otto.docker", "otto.config", "otto.inventory", "otto.labs", "otto.kmodcov", "otto.params", "otto.version", "otto.result", "otto.lifecycle", "otto.context", "otto.errors", "otto.check", "otto.project", "otto.init", "otto.session", "otto.monitor.errors", "otto.config.scope", "otto.models.dependencies", "otto.config.home", "otto.config.user_settings"]

[[modules]]
path = "otto.config"
depends_on = [
    # completion_cache's containment seam imports `is_containable` to tell a
    # user module that DECLINED to load from one that broke. otto.errors is a
    # zero-import leaf, so this cannot invert layering or create a cycle.
    "otto.errors",
    "otto.models",
    "otto.models.base",
    "otto.context",
    "otto.instruction_catalog",
    "otto.labs",
    # completion_cache resolves the process inventory function-locally, twice:
    # `_inventory_fingerprint` mixes its freshness signal into the digest and
    # `_enumerate_host_summaries` passes it to the enumeration, so a referenced
    # host completes (spec 2026-08-28 host-inventory §11). A downward edge:
    # otto.inventory reads the user settings file and the home through
    # otto.config.user_settings and otto.config.home, modules of their own, and
    # the settings file's name from the foundation otto.config.scope, so it
    # imports nothing else of otto.config (spec 2026-10-11 placement-and-phases
    # §3.6).
    "otto.inventory",
    # DEBT: survives on fleet.py's DEFAULT_COMMAND_TIMEOUT (Tier 1.7),
    # lab.py's RemoteHost/slug/builtin_hosts, and repo.py's os_profile
    # registration. completion_cache's host-CONSTRUCTION import is gone —
    # it enumerates through LabRepository now — leaving only the
    # import-light builtin_hosts and the term/transfer registries.
    "otto.host",
    "otto.link",
    "otto.reservations",
    "otto.bootstrap",
    # repo.py's collection pass marks itself as loading test files, so a test
    # file or conftest that registers anything is refused there too. A leaf
    # (it depends only on otto.errors), so no cycle can form.
    "otto.registry",
    "otto.config.scope",
    "otto.models.dependencies",
    # otto.utils: the completion cache's collection child splits the path-list
    # variables with the one separator split_path_list uses.
    "otto.utils",
    # otto.config.home: the completion cache lives in the workspace home.
    "otto.config.home",
]

[[modules]]
path = "otto.config.home"
layer = "specs"
# otto's user-level home and the workspace key that shards it: the one owner of
# every path under ~/.otto (spec 2026-10-11 placement-and-phases §2.2, §3.6).
# A module of its own, so the inventory and the suite read it without importing
# otto.config. It reads OTTO_HOME and OTTO_SUT_DIRS through the env settings
# model, and normalizes the workspace slug, inside its functions. Its ancestor
# otto/config/__init__.py stays lazy (§4.3) bar one eager import,
# otto.config.env, so importing this module loads that too.
depends_on = ["otto.models", "otto.models.dependencies"]

[[modules]]
path = "otto.config.scope"
layer = "foundation"
# The one membership predicate, its config and resolver, the composition
# root's error types (spec 2026-10-11 placement-and-phases §3.5), and the
# runtime settings types the repo loader holds and the settings specs build
# (§3.6). Foundation, so the host layer's ingest gate and otto.declared may
# import it. Its
# ancestor otto/config/__init__.py stays lazy (§4.3) bar one eager import,
# otto.config.env, so importing this module loads that too.
# otto.models.dependencies is read inside the functions that normalize a repo
# name.
depends_on = ["otto.errors", "otto.models.dependencies"]

[[modules]]
path = "otto.config.user_settings"
layer = "specs"
# The user-level ~/.otto/settings.toml, read through its settings model, under
# the home otto.config.home owns (spec 2026-10-11 placement-and-phases §2.2,
# §3.6). A module of its own, so the inventory reads the user file without
# importing otto.config. Its ancestor's one eager import, otto.config.env,
# loads with it (§4.3).
depends_on = ["otto.config.home", "otto.models"]

[[modules]]
path = "otto.console"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.context"
# NOTE: context<->config is a known cycle held apart by function-scope
# imports in otto.context. context -> host is one-way: the host layer stopped
# importing the context when each loop's host registry moved to
# otto.invocation. Dropping `timeout` from run_on_all_hosts (Tier 1.7)
# removes the host edge's worst justification.
depends_on = [
    "otto.config",
    "otto.host",
    "otto.bootstrap",
    # ctx.options resolves the per-verb options registry at call time, and
    # OptionsNotAvailableError now lives there too (otto.params already roots
    # its own OptionsRegistrationError/OptionsCollisionError at OttoError).
    "otto.params",
    # open_context makes the CLI's decisions through otto.session: project
    # selection, the bootstrap gate, the lab build and the dependency preflight.
    "otto.session",
    # open_context applies the reservation gate the CLI preamble applies
    # (build_reservation_gate + ReservationGate.evaluate). Function-local.
    # Both modules were already in one import cycle, so this adds no member.
    "otto.reservations",
    # The context composes the leaf's run policy, resolver and bindings.
    "otto.invocation",
    "otto.config.scope",
    # open_context splits a lab selection and wraps a given lab with the lab
    # model in otto.labs.loader. Function-local; otto.labs is outside the cycle.
    "otto.labs",
]

[[modules]]
path = "otto.coverage"
layer = "root"
# otto.models.base: the capture artifact's models subclass OttoModel so their
# schema builds on first use, not at import. A foundation leaf, so no cycle.
depends_on = [
    "otto.utils",
    "otto.host",
    "otto._webassets",
    "otto.config",
    "otto.version",
    "otto.errors",
    "otto.models.base",
    # clean_coverage and the product reset hooks build per-product Result
    # values for the CleanReport. otto.result is a leaf (otto.utils,
    # otto.errors) that otto.docker already depends on, so no cycle.
    "otto.result",
    # get_coverage reads try_get_context() for the per-invocation output
    # directory, function-locally, as otto.suite.run already does.
    # otto.context does not depend on otto.coverage, so no cycle.
    "otto.context",
    # otto.layout: the run-tree paths (a pure leaf).
    "otto.layout",
    "otto.config.scope",
]

[[modules]]
path = "otto.creds"
layer = "sources"
# The creds-store seam (spec 2026-09-06 creds-store §5). Sits BENEATH
# otto.inventory, which imports it function-locally from the bootstrap path;
# this package never imports otto.inventory — one-way by construction. Every
# dependency here is a leaf or a boundary-model package.
depends_on = ["otto.errors", "otto.models", "otto.models.base", "otto.registry", "otto.utils"]

[[modules]]
path = "otto.declared"
layer = "foundation"
# The declared-entry core and the composed-repos catalog with its initiator
# slot (spec 2026-10-11 placement-and-phases §2.1, §3.5): otto.bootstrap
# publishes into it and installs the initiator; nothing here imports the root.
# The scope predicate and the run policy are read inside the functions that
# need them.
depends_on = ["otto.config.scope", "otto.invocation", "otto.registry"]

[[modules]]
path = "otto.docker"
depends_on = [
    "otto.host",
    "otto.models",
    "otto.lifecycle",
    "otto.utils",
    "otto.config",
    "otto.result",
    # UseCaseResolutionError roots on OttoError, because the repo's
    # `test_every_public_exception_in_src_is_ottoerror_rooted` guard requires
    # every public exception in src/otto to. Same standing as otto.result's
    # edge below: otto.errors is a zero-import leaf, so this can neither
    # invert layering nor create a cycle.
    "otto.errors",
    # `register_compose_adapter` is a registration seam — it writes into a
    # Registry and attributes the entry to the registering repo, exactly as
    # every other registration seam in the tree does (docker use-cases spec
    # §5). otto.registry is a foundation leaf too (see otto.bootstrap's note
    # above), so the same no-cycle argument holds.
    "otto.registry",
    # The observe verbs run docker's own command with LogMode.QUIET so the
    # console does not relay a listing the verb then prints itself. otto.logger
    # depends only on otto.console, so this edge cannot make a cycle.
    "otto.logger",
    "otto.config.scope",
    "otto.declared",
]

[[modules]]
path = "otto.errors"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.examples"
layer = "entry"
# otto.inventory: the reference LabRepository resolves each record through
# `resolve_host_entry` — the sample IS the documentation of how a backend
# honours `inventory=` (spec 2026-08-28 host-inventory §6).
# otto.models: the sample lab source's config model subclasses OttoModel, as
# every otto pydantic model does (defer_build), so the copyable sample shows
# the public base a backend's config model uses.
# otto.monitor.parsers: the sample metric parser subclasses MetricParser.
depends_on = ["otto.reservations", "otto.host", "otto.monitor.parsers", "otto.labs", "otto.inventory", "otto.models"]

[[modules]]
path = "otto.filesystem"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.init"
layer = "workflows"
# The `otto init` doctor and scaffolder (NOT settings.toml's `init` key, which
# names init modules). Every edge is a real import, added with the code that
# introduced it.
depends_on = [
    "otto.errors",
    "otto.config",
    # otto.config.scope: TOML_SETTINGS_PATH, the settings file the doctor checks
    # and the scaffolder writes.
    "otto.config.scope",
    "otto.utils",
    "otto.models",
    "otto.models.base",
    "otto.labs",
    "otto.inventory",
    "otto.host",
    "otto.kmodcov",
    # otto.config.user_settings: the doctor reads the user settings file.
    "otto.config.user_settings",
]

[[modules]]
path = "otto.session"
# The decisions that prepare a run, shared by `otto --lab X <verb>` and
# `otto.open_context` (thin-CLI series: the library path makes every decision
# the CLI makes). Every heavy edge (inventory, docker, labs, env, host) is a
# function-local import, so a Lab-object open_context never pays for them.
depends_on = [
    "otto.errors",
    "otto.bootstrap",
    "otto.labs",
    "otto.inventory",
    "otto.docker",
    "otto.logger",
    "otto.host",
    "otto.config.scope",
    "otto.models.dependencies",
]

[[modules]]
path = "otto.instruction_catalog"
layer = "foundation"
# The instruction tables, the @instruction decorator and their checks: data and
# rules, read by every layer above (Repo's panel, the completion cache, the
# project layer, the CLI). Its first-party slot, FIRST_PARTY_ACTIONS, is filled
# from above by otto.project.actions, its one installer (spec 2026-10-11
# placement-and-phases §2.1, §3.2); the catalog never imports the project layer.
depends_on = ["otto.errors", "otto.registry"]

[[modules]]
path = "otto.instructions"
layer = "workflows"
# The execution face: run_instruction and bind_handler_kwargs, over the catalog.
# otto.context, otto.params and otto.project are all function-scope, inside
# bind_handler_kwargs (context, params) and run_instruction (context, params,
# project): importing the face stays cheap, and only calling an instruction
# pulls the binding machinery and the orchestrator in. run_instruction also
# declares otto's first-party actions (otto.project.actions) before its lookup.
# otto.session: run_instruction asks check_instruction_active whether the owning
# repo is active in the context. Function-scope, like the edges above.
depends_on = ["otto.instruction_catalog", "otto.context", "otto.params", "otto.project", "otto.session"]

[[modules]]
path = "otto.host"
layer = "host"
depends_on = [
    "otto.logger",
    # otto.models.base: OttoModel, the credential pair (CredSpec, the runtime
    # Cred) and resources_nonempty, the leaf the host specs share with
    # otto.models (spec 2026-10-11 placement-and-phases §3.3). The host specs
    # live in this package (otto.host.specs, otto.host.option_specs), so the
    # host layer imports nothing else from otto.models.
    "otto.models.base",
    # otto.link.impairer: a host spec's impairer pin and menu are checked
    # against the impairer registry, a foundation module.
    "otto.link.impairer",
    "otto.lifecycle",
    "otto.console",
    "otto.result",
    "otto.snmp",
    "otto.utils",
    "otto.registry",
    "otto.errors",
    # otto.kmodcov: kmod_tool_kind.py's interface_problem() reads
    # modinfo_version / interface_of / KMODCOV_INTERFACE_READ_VERSIONS to check
    # a built otto_kmodcov .ko against the interface numbers this otto reads.
    # Function-local (inside interface_problem), same import-budget reason as
    # otto.cli's otto.kmodcov edge above — the host package must not pull the
    # kmodcov package in at module import time.
    "otto.kmodcov",
    # Hosts read the run's policy, resolve a peer host and register with their
    # event loop's registry through the leaf.
    "otto.invocation",
    # otto.layout: the run-tree paths (a pure leaf).
    "otto.layout",
    # The ingest gate: product.py and dev_tool.py judge a provider's repo with
    # otto.config.scope's repo_targets, after otto.declared's scope_for_repo names
    # its declaration; the declared-entry kinds and listing read otto.declared.
    # Both are foundation modules that never import upward.
    "otto.config.scope",
    "otto.declared",
]

[[modules]]
path = "otto.inventory"
layer = "sources"
# otto.host: InventoryRef lives beside LabInfo on the host so the host package
# does not import upward into this one. This list is what the package imports
# TODAY, per this file's ratchet contract. The snapshot cache (2026-08-28,
# §9.5) reaches otto.config.home for the cache directory and logs through the
# stdlib `logging` module, not otto.logger, because it is a library warning on
# a load path and not console output otto formats.
# otto.config.home, otto.config.user_settings: config.py reads
# ~/.otto/settings.toml through otto.config.user_settings (one owner for the
# user file) and the snapshot cache directory through otto.config.home. Each is
# a module of its own in the specs layer (spec 2026-10-11 placement-and-phases
# §3.6), and the settings file's name comes from the foundation module
# otto.config.scope, so this package imports nothing else of otto.config.
# otto.config imports it back: otto.config.completion_cache calls `build_inventory` for the
# completion digest and the host enumeration (§11), a downward edge now.
# otto.utils: compile_inventory anchors [inventory] paths through the same
# `anchor_path` every other settings path goes through — one authority for the
# rule, not a copy.
# otto.creds (spec 2026-09-06 creds-store §4/§5): `[creds]` resolves
# independently of `[inventory]` in config.py's `_resolve_creds`, and
# construct_inventory/CredsOverlay.lookup build the store and re-raise its
# CredsError as an InventoryError. Every use is function-local — otto.creds
# is only imported once a `[creds]` table is actually declared — so a lab
# with no store configured never pays for the package at all. One-way:
# otto.creds never imports otto.inventory (see its own module note).
# otto.tls (spec 2026-09-14 os-trust-http-helper): the NetBox session's OS-store
# trust and request-timeout bound. Module-level import; otto.tls itself is a
# stdlib-only leaf at import time.
depends_on = [
    "otto.config.home",
    "otto.config.scope",
    "otto.config.user_settings",
    "otto.creds",
    "otto.errors",
    "otto.host",
    "otto.models",
    "otto.models.base",
    "otto.registry",
    "otto.tls",
    "otto.utils",
]

[[modules]]
path = "otto.invocation"
layer = "foundation"
# The run's policy, peer-host resolver and context bindings: a leaf the host
# layer may import (spec 2026-10-06 run-state contracts §3).
depends_on = []

[[modules]]
path = "otto.kmodcov"
layer = "foundation"
# otto.version: export_tree() writes the exporting otto's version into the
# vendored copy's generated header. Function-local (this package sits inside
# an import-budgeted CLI surface, see otto.cli below).
depends_on = ["otto.version"]

[[modules]]
path = "otto.labs"
layer = "sources"
# The lab model and its loader (labs/loader.py) live here, beside the lab
# sources they drive, so the package imports nothing of otto.config (spec
# 2026-10-11 placement-and-phases §3.7).
# otto.utils: sources.py anchors `[[lab.sources]]` json paths through the same
# `anchor_path` every other settings path goes through — one authority for the
# rule, not a copy. A foundation leaf (it depends only on
# otto.errors), so the edge cannot cycle.
# otto.inventory: json_repository.py joins each host entry to its inventory
# record (`resolve_host_entry`) BEFORE the factory sees it — the loader is the
# single join site (spec 2026-08-28 host-inventory §6). One-way: otto.inventory
# does not import otto.labs.
depends_on = [
    "otto.registry",
    "otto.link",
    "otto.inventory",
    "otto.models",
    "otto.models.base",
    "otto.host",
    "otto.errors",
    "otto.utils",
]

[[modules]]
path = "otto.lifecycle"
layer = "foundation"
# otto.logger: sync_phase resolves shutdown_listener EAGERLY at entry so the
# forced exit path (os._exit skips atexit) can flush the queue listener
# without importing inside a signal handler.
# otto.invocation: every teardown-deadline reader reads the installed run policy,
# and run_command holds a cleanup boundary on the command's loop.
depends_on = ["otto.invocation", "otto.logger"]

[[modules]]
path = "otto.link"
layer = "topology"
# NOTE: no otto.tunnel here — the packages are fully decoupled via
# otto.host.daemon (July finding a1/a3, FIXED). Keep it that way.
# otto.link.params, otto.link.impairer, otto.link.netem: the impairment
# vocabulary and contract, the impairer registry and the built-in netem
# impairer, each a foundation module of its own (below). No otto.registry:
# the registry went to otto.link.impairer with IMPAIRERS.
depends_on = ["otto.lifecycle", "otto.logger", "otto.models", "otto.host", "otto.errors", "otto.check", "otto.result", "otto.link.impairer", "otto.link.netem", "otto.link.params"]

# The impairment vocabulary and the impairer registry, carved out of otto.link
# into the foundation layer (spec 2026-10-11 placement-and-phases §3.3), so the
# host specs can read the registry without importing the link layer. The
# contract (LinkImpairer, ScopedState, the selector bands) lives in
# otto.link.params, which is standard library only; otto.link.netem imports
# only that, and otto.link.impairer names netem by reference (a Ref string the
# string audit lists), so the three form no loop. Their public names stay
# exported from the otto.link facade.

[[modules]]
path = "otto.link.impairer"
layer = "foundation"
depends_on = ["otto.link.params", "otto.registry"]

[[modules]]
path = "otto.link.netem"
layer = "foundation"
depends_on = ["otto.link.params"]

[[modules]]
path = "otto.link.params"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.logger"
layer = "foundation"
depends_on = ["otto.console"]

[[modules]]
path = "otto.models"
layer = "specs"
depends_on = [
    "otto.utils",
    "otto.models.base",
    # models/jsonschema.py lists the registered impairer names in the JSON
    # Schema.
    "otto.link.impairer",
    # ALLOWED LAZILY ONLY, and the one otto.config module models reads: the
    # runtime settings types live in the foundation module otto.config.scope
    # (spec 2026-10-11 placement-and-phases §3.6). to_runtime() bodies import
    # them at function scope, and LoggingConfigSpec's removed-`capture`
    # validator imports TOML_SETTINGS_PATH inside its error branch (so the
    # cutover message can name the settings file that carried the dead key —
    # spec 2026-08-30 §4.3). The module-scope ban is enforced by ast-grep
    # (models-no-module-scope-config-import) since tach cannot distinguish
    # scope.
    "otto.config.scope",
    "otto.logger",
    # (models -> coverage edge removed 2026-08-03: validate_color moved to
    # otto.models.color, closing the layer inversion.)
    # DEBT: otto.models re-exports ToolchainSpec and the eight option specs as
    # facade bindings to otto.host.specs / otto.host.option_specs (spec
    # 2026-10-11 placement-and-phases §3.3), and models/{jsonschema,snippets,
    # inventory,settings}.py read those modules.
    "otto.host",
    # models/jsonschema.py stamps `x-otto-version` into every generated schema
    # document (spec 2026-08-27 lab-definition-v2 §12), so `otto init`'s doctor
    # can name the otto that wrote a stale file. otto.version is a
    # dependency-free leaf (importlib.metadata only): no cycle, no new member
    # in any component.
    "otto.version",
    # otto.layout: the run-tree paths (a pure leaf).
    "otto.layout",
    "otto.declared",
    "otto.models.dependencies",
]

[[modules]]
path = "otto.models.base"
layer = "foundation"
# The leaf otto.host and otto.models both build on: OttoModel and
# compact_validation_error, the credential pair (CredSpec and the runtime Cred
# dataclass, with cred_identity) and resources_nonempty. pydantic and the
# standard library only; it imports no other otto module (spec 2026-10-11
# placement-and-phases §3.3).
depends_on = []

[[modules]]
path = "otto.models.dependencies"
layer = "foundation"
# Dependency-spec parsing and repo-name normalization: the standard library and
# packaging only, so the scope predicate below every layer can normalize a name.
depends_on = []

[[modules]]
path = "otto.monitor"
layer = "workflows"
# The monitor facade (otto/monitor/__init__.py) and the monitor service: the
# collector runtime (collector, db, export, factory, session, which import
# each other in a loop), the files that use it (archive_edit, review, server)
# and live.py, the lab-aware runner the facade exports. The facade exports
# live.py's names, so the module that owns it sits at or above live.py's
# layer (spec 2026-10-11 placement-and-phases §3.11), and live.py stays in it:
# as a module of its own it would import factory and session from here while
# the facade's lazy binding imports it back, a loop through a string.
# otto.config, otto.context, otto.tunnel: live.py only. It reads the active
# lab, the repos, the driving repo's scope and full-lab tunnel discovery and
# hands them to the collector, whose tunnel discovery is INJECTED through the
# tunnel_source callable (collector.py). tach cannot tell live.py from the
# rest of this module, so tests/unit/test_monitor_service_reads_no_lab.py
# keeps those three, otto.lab and live.py itself out of every other file under
# otto/monitor, by import or by literal string.
# otto.utils: server.py's internal uvicorn wait runs through wait_for_async
# (gate G6, the one sanctioned poll spelling).
# otto.monitor.*: the lower files this module imports, each a module of its own
# (below).
depends_on = ["otto.host", "otto.models", "otto._webassets", "otto.result", "otto.link", "otto.filesystem", "otto.logger", "otto.console", "otto.errors", "otto.utils", "otto.config", "otto.context", "otto.tunnel", "otto.monitor.broadcast", "otto.monitor.errors", "otto.monitor.event_ops", "otto.monitor.events", "otto.monitor.formats", "otto.monitor.parsers", "otto.monitor.snmp", "otto.monitor.store", "otto.monitor.tls", "otto.config.scope"]

# The monitor's eleven lower files, one tach module each, at topology (spec
# 2026-10-11 placement-and-phases §3.11). They are not one subpackage module:
# that would move the public paths otto.monitor.parsers, otto.monitor.snmp and
# otto.monitor.log_sourced, and the collector runtime's import loop has to stay
# inside otto.monitor. None of them imports otto.monitor's files; tach refuses
# it, since otto.monitor sits a layer above them.

[[modules]]
path = "otto.monitor.broadcast"
layer = "topology"
depends_on = []

[[modules]]
path = "otto.monitor.errors"
layer = "topology"
depends_on = ["otto.errors"]

[[modules]]
path = "otto.monitor.event_ops"
layer = "topology"
depends_on = ["otto.errors", "otto.models"]

[[modules]]
path = "otto.monitor.events"
layer = "topology"
depends_on = ["otto.models"]

[[modules]]
path = "otto.monitor.formats"
layer = "topology"
depends_on = []

[[modules]]
path = "otto.monitor.log_sourced"
layer = "topology"
depends_on = ["otto.monitor.parsers"]

[[modules]]
path = "otto.monitor.parsers"
layer = "topology"
depends_on = ["otto.models", "otto.monitor.rates", "otto.registry"]

[[modules]]
path = "otto.monitor.rates"
layer = "topology"
depends_on = []

[[modules]]
path = "otto.monitor.snmp"
layer = "topology"
depends_on = ["otto.models.base", "otto.monitor.parsers", "otto.monitor.rates", "otto.registry", "otto.snmp"]

[[modules]]
path = "otto.monitor.store"
layer = "topology"
depends_on = ["otto.models", "otto.monitor.events", "otto.monitor.parsers"]

[[modules]]
path = "otto.monitor.tls"
layer = "topology"
depends_on = ["otto.monitor.errors"]

[[modules]]
path = "otto.params"
layer = "foundation"
# OptionsRegistrationError and OptionsCollisionError root at OttoError, and the
# options registry is a Registry of Refs. Both are foundation leaves.
depends_on = ["otto.errors", "otto.registry"]

[[modules]]
path = "otto.project"
layer = "workflows"
# The project layer sits ABOVE hosts and below the CLI: it drives host verbs
# across the fleet on behalf of one repo. Every edge here points down.
#
# otto.host is imported LAZILY inside the methods that dispatch (BaseHost.install
# and friends) — `import otto.project` must stay cheap, because the default
# instructions import it at CLI startup. tach counts a function-scope import as
# an edge regardless, which is why it is declared.
#
# otto.config is TYPE_CHECKING-only here (Repo), and otto.context is in
# actions.py (OttoContext): the per-repo actions are HANDED both at
# construction and never look either up. The orchestrator DOES look the context
# up -- ambient-context module functions are its whole shape -- but only from
# inside the call (orchestrator._lab), for the same reason otto.host is lazy
# here: `import otto.project` must stay cheap. The scope predicates the
# orchestrator reads come from otto.config.scope, a foundation module, imported
# inside the calls that use them (its ProjectScope annotation is
# TYPE_CHECKING-only). Importing it also runs otto/config/__init__.py, which
# loads otto.config.env.
#
# otto.cli: no edge. The `@instruction` decorator lives in
# otto.instruction_catalog (since the thin-CLI series, 2026-09-28, in
# otto.instructions; since spec 2026-10-11 placement-and-phases §3.2, in the
# catalog below this layer); the loop project -> cli -> suite -> project that
# used to close through it is gone.
#
# otto.instruction_catalog: the tables the project layer reads and the
# first-party slot actions.py fills (declare_first_party_actions, its one
# installer). The catalog sits in foundation and never imports this layer.
#
# otto.link and otto.tunnel are `cleanup`'s last two steps and `is_clean`'s
# last two questions (2026-08-17): a netem impairment and a tunnel belong to
# the LAB rather than to any repo, so the orchestrator resets and reaps them
# once, exactly as it does the debug sweep and the toolchain. BOTH EDGES POINT
# DOWN and both are function-scope, in orchestrator.py alone — the four calls
# are `link.manage.repair_all` / `read_link_states` and
# `tunnel.manage.remove_all_tunnels` / `tunnel.discovery.discover_tunnels`,
# each handed `ctx.lab` and nothing else. Neither package knows this one
# exists, so neither edge is a mutual pair, and neither added a member to the
# import cycle. What they did change: project->tunnel is tunnel's one way back
# into the cycle that does not run through otto.cli.
#
# otto.errors is the exception hierarchy's root and a zero-import leaf, so it
# cannot invert layering or create a cycle (otto.config, otto.monitor and
# otto.reservations declare it on the same standing). Module-scope in
# orchestrator.py, deliberately: InactiveRequiredDependencyError is a
# module-level class statement and its base has to be resolved at import time.
# The cost is nil -- otto.errors imports nothing -- so `import otto.project`
# stays as cheap as the note above requires.
#
# otto.models.dependencies is `normalize_name`, the ONE PEP-503 normalizer,
# reached at function scope from orchestrator's activation code. The
# alternative was importing it from otto.config.dependencies, which merely
# re-exports it: that would have satisfied tach with an already-declared edge
# while hiding the real dependency, and the honest edge is the one that
# survives someone moving the re-export. It is a foundation module with no
# dependencies.
#
# Neither edge added a member to the import cycle: otto.project was already
# in it.
depends_on = [
    "otto.registry",
    "otto.result",
    "otto.utils",
    "otto.host",
    "otto.context",
    "otto.link",
    "otto.tunnel",
    "otto.errors",
    "otto.instruction_catalog",
    "otto.params",
    # otto.layout: the run-tree paths (a pure leaf).
    "otto.layout",
    "otto.config.scope",
    "otto.models.dependencies",
]

[[modules]]
path = "otto.registry"
layer = "foundation"
# otto.errors: RegistrationRefused roots at OttoError like every named class.
# otto.errors is a leaf with no imports, so no cycle can form.
depends_on = ["otto.errors"]

[[modules]]
path = "otto.reservations"
depends_on = ["otto.registry", "otto.utils", "otto.models", "otto.models.base", "otto.config", "otto.errors"]

[[modules]]
path = "otto.snmp"
layer = "foundation"
# A leaf: the one pysnmp GET, returning a raw outcome. otto.host (the probe
# survey) and otto.monitor (the collector) both depend on it; the monitor
# depends on the host, so the GET could not live in either without a cycle.
# pysnmp is function-local, so importing this costs only the stdlib.
depends_on = []

[[modules]]
path = "otto.result"
layer = "foundation"
# otto.errors is for CommandNotRunError's OttoError base. Like config's edge
# below, this cannot invert layering or create a cycle: otto.errors is a
# zero-import leaf. The error is defined HERE, not in otto.host.errors with its
# two peers, precisely to avoid a result->host edge -- otto.host depends on
# otto.result, so that direction is both a runtime circular import and one more
# mutually-importing pair added to the import cycle the ratchet pins and this
# file is trying to shrink.
depends_on = ["otto.utils", "otto.errors"]

[[modules]]
path = "otto.suite"
layer = "root"
# otto.project is the `ensure` marker's converge steps (`_converge` in
# pytest_plugin.py resolves the otto.project function at call time). The edge
# points DOWN — project drives hosts on behalf of a repo, a suite consumes
# that — and it is the point of the layer: `otto run install` and the marker
# call the same function, so the CLI and the suites cannot diverge on what
# "installed" means.
#
# No loop: otto.project no longer imports otto.cli (thin-CLI item 1).
# otto.invocation: the runner sweep (suite/loops.py) reads the run policy's teardown deadline.
# otto.labs: run_tests opens a context on an empty lab (otto.labs.loader.Lab)
# when none is active.
depends_on = ["otto.context", "otto.config", "otto.invocation", "otto.lifecycle", "otto.registry", "otto.monitor", "otto.version", "otto.models", "otto.host", "otto.coverage", "otto.params", "otto.errors", "otto.project", "otto.utils", "otto.monitor.errors", "otto.config.scope", "otto.config.home", "otto.labs"]

[[modules]]
path = "otto.testing"
layer = "entry"
# otto.inventory / otto.models: assert_inventory_conforms (spec §14, added
# alongside the json backend) checks a candidate against the Inventory
# protocol and its InventoryRecord fields.
# otto.creds: assert_creds_store_conforms (spec 2026-09-06 §5.3).
# otto.context / otto.invocation: assert_host_conforms probes a host's verbs
# under a dry run, and the dry run is the installed context's RunPolicy --
# installing a context with a dry-run policy is the only way to ask a host what
# it would do without letting it do it.
# otto.result: the OUTCOME of that dry-run probe. A declined verb raises
# CommandNotRunError, so the asserter cannot tell "this family declined the dry
# run, as it should" from "this method is not the shape the protocol names"
# without naming the type; its own docstring says to import it from otto.result
# (it lives there, not in otto.host.errors, to avoid a result->host edge).
# Cannot invert layering or create a cycle: otto.result depends only on
# otto.utils and otto.errors, both foundation leaves, and otto.host already
# depends on it.
depends_on = ["otto.context", "otto.creds", "otto.inventory", "otto.invocation", "otto.labs", "otto.models", "otto.models.base", "otto.reservations", "otto.host", "otto.result", "otto.suite"]

[[modules]]
path = "otto.tls"
layer = "foundation"
# A leaf: the OS trust store and the request-timeout bound for any HTTPS
# client. Imports only the stdlib at module level; requests, truststore and
# typing_extensions are function-local. otto.inventory (NetBox) is its first
# consumer; a user's reservation/creds/inventory backend is the second.
depends_on = []

[[modules]]
path = "otto.tunnel"
layer = "topology"
# NOTE: no otto.link here (and none the other way) — see otto.link above.
# otto.check IS allowed: it's the shared check core (otto tunnel check uses
# it the same way otto link check does), and otto.check imports neither.
depends_on = ["otto.host", "otto.models", "otto.registry", "otto.lifecycle", "otto.logger", "otto.errors", "otto.check"]

[[modules]]
path = "otto.utils"
layer = "foundation"
# Status and the validation errors root at OttoError.
depends_on = ["otto.errors"]

[[modules]]
path = "otto.version"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto._webassets"
layer = "foundation"
depends_on = []

[[modules]]
path = "otto.layout"
layer = "foundation"
# The run-tree contract: where per-host and per-product artifacts land. Pure,
# and imports no other otto module. otto.host, otto.coverage, otto.models and
# otto.project read it.
depends_on = []

[[modules]]
path = "otto._shim_complete"
layer = "foundation"
# The TAB answerer: standard library only, imported by the console shim before
# anything else in otto on every TAB. `otto cache` inspects it.
depends_on = []
