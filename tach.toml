# Module-boundary contracts, enforced by `tach check` (Makefile: lint-arch).
#
# This file is the RATCHET BASELINE recorded from the real import graph on
# 2026-08-03 (tach sync), including known-bad edges — marked "DEBT:" below with
# a pointer to the finding in todo/churn-and-design-review-2026-08-03.md.
# The contract is: no NEW cross-module edge may appear without editing this
# file in the same PR; DEBT edges are removed here as their fixes land.
#
# Maintain BY HAND. `tach sync` REWRITES this file and strips every comment —
# never run it to "fix" a check failure; add or (preferably) question the edge.
#
# End state: forbid_circular_dependencies = true. Blocked today by far more
# than the four edges this line used to name. MEASURED by setting the flag and
# running `tach check` (2026-08-17): SIXTEEN of the modules below are in one
# strongly connected component — bootstrap, cli, config, context, coverage,
# docker, host, labs, lifecycle, link, models, monitor, project, reservations,
# suite, tunnel. THIRTEEN mutually-importing pairs run through it:
#
#   bootstrap<->config, cli<->config, config<->context, config<->host,
#   config<->labs, config<->lifecycle, config<->models, config<->reservations,
#   config<->suite, context<->host, docker<->host, host<->models, link<->models
#
# THOSE PAIRS ARE NOT THE WHOLE FORMATION — they account for only TWELVE of the
# sixteen. The other four join through longer loops that contain no mutual pair
# of their own, every one of them closing through otto.cli:
#
#   project  -> cli -> suite -> project          (documented on otto.suite below)
#   coverage -> config -> cli -> coverage
#   monitor  -> host -> config -> cli -> monitor
#   tunnel   -> host -> config -> cli -> tunnel
#
# FOUR OF THOSE PAIRS HAVE OWNERS, and are the ones the DEBT/NOTE comments in
# this file track: cli<->config, config<->context, context<->host and
# docker<->host (spelled host<->context and host<->docker down there). The rest
# is recorded here so that the marked backlog is never mistaken for the whole
# count. EXPECT NO SINGLE-EDGE FIX: otto.cli has exactly two inbound edges from
# inside the component (config->cli and project->cli), and cutting EITHER alone
# leaves it at sixteen — measured. Cutting both drops it to fourteen, which is
# where the real work starts rather than ends. Re-measure with the flag before
# quoting any of these numbers; never adjust them by guess.
#
# Note tach counts function-scope (lazy) imports as edges, same as module
# scope. Scope-sensitive rules (e.g. "models may import config lazily but
# never at module scope") are enforced by ast-grep instead — see
# .ast-grep/rules/.

source_roots = ["src"]
exclude = ["tests", "docs", "web", "scripts"]

[[modules]]
path = "otto.bootstrap"
depends_on = [
    "otto.config",
    "otto.errors",
    # Phase-2 registration wraps each repo's init imports in
    # `registry.registering_repo(name)` so registration seams can attribute an
    # entry to the repo that registered it. otto.registry is a zero-import
    # leaf (same standing as otto.errors), so this cannot invert layering or
    # create a cycle.
    "otto.registry",
]

[[modules]]
path = "otto.cli"
depends_on = ["otto.instructions", "otto.registry", "otto.logger", "otto.link", "otto.reservations", "otto.coverage", "otto.tunnel", "otto.utils", "otto.models", "otto.bootstrap", "otto.suite", "otto.monitor", "otto.host", "otto.docker", "otto.config", "otto.params", "otto.version", "otto.labs", "otto.result", "otto.lifecycle", "otto.context", "otto.errors"]

[[modules]]
path = "otto.config"
depends_on = [
    # completion_cache's containment seam imports `is_containable` to tell a
    # user module that DECLINED to load from one that broke. otto.errors is a
    # zero-import leaf, so this cannot invert layering or create a cycle.
    "otto.errors",
    "otto.utils",
    "otto.models",
    # DEBT: repo.py git-description properties trigger run_command from a
    # property getter (cross-cutting review Q8); reconsider with the repo.py
    # split (Tier 2.5).
    "otto.lifecycle",
    "otto.result",
    "otto.context",
    "otto.instructions",
    # DEBT: the last core->cli backward edge — completion_cache.py imports
    # CLI_COMMANDS + the private _typer_app_flattens (:682/:735) to serialize
    # the command tree. Remove with the completion-cache snapshot() redesign
    # (Tier 2.10). (INSTRUCTIONS moved to otto.instructions 2026-08-03,
    # retiring repo.py's backward import and the sys.modules dodge.)
    "otto.cli",
    "otto.labs",
    # DEBT: survives on fleet.py's DEFAULT_COMMAND_TIMEOUT (Tier 1.7),
    # lab.py's RemoteHost/slug/builtin_hosts, and repo.py's os_profile
    # registration. completion_cache's host-CONSTRUCTION import is gone —
    # it enumerates through LabRepository now — leaving only the
    # import-light builtin_hosts and the term/transfer registries.
    "otto.host",
    "otto.logger",
    # completion_cache reads SUITES; acceptable direction once INSTRUCTIONS
    # joins it in core — revisit with Tier 1.5.
    "otto.suite",
    "otto.link",
    "otto.reservations",
    "otto.bootstrap",
]

[[modules]]
path = "otto.console"

[[modules]]
path = "otto.context"
# NOTE: context<->config and context<->host are known cycles held apart by
# lazy imports (context.py:178-184). Dropping `timeout` from run_on_all_hosts
# (Tier 1.7) removes the host edge's worst justification.
depends_on = ["otto.config", "otto.host", "otto.bootstrap"]

[[modules]]
path = "otto.coverage"
depends_on = ["otto.utils", "otto.host", "otto._webassets", "otto.config", "otto.version", "otto.errors"]

[[modules]]
path = "otto.docker"
depends_on = ["otto.host", "otto.models", "otto.lifecycle", "otto.utils", "otto.config", "otto.result"]

[[modules]]
path = "otto.errors"

[[modules]]
path = "otto.examples"
depends_on = ["otto.reservations", "otto.host", "otto.monitor", "otto.labs", "otto.config", "otto.context"]

[[modules]]
path = "otto.filesystem"

[[modules]]
path = "otto.instructions"
depends_on = ["otto.registry"]

[[modules]]
path = "otto.host"
depends_on = [
    "otto.logger",
    "otto.models",
    "otto.lifecycle",
    # DEBT: half of the host<->docker cycle — docker_host.py:251 lazily calls
    # compose_up. The compose bridge belongs above both packages.
    "otto.docker",
    "otto.console",
    "otto.result",
    "otto.utils",
    # DEBT: half of the host<->context cycle — interact imports try_get_context
    # at module scope (context.py:178 documents the workaround).
    "otto.context",
    "otto.config",
    "otto.registry",
    "otto.errors",
]

[[modules]]
path = "otto.labs"
depends_on = ["otto.registry", "otto.link", "otto.config", "otto.models", "otto.host", "otto.errors"]

[[modules]]
path = "otto.lifecycle"
# otto.logger: sync_phase resolves shutdown_listener EAGERLY at entry so the
# forced exit path (os._exit skips atexit) can flush the queue listener
# without importing inside a signal handler.
depends_on = ["otto.config", "otto.context", "otto.logger"]

[[modules]]
path = "otto.link"
# NOTE: no otto.tunnel here — the packages are fully decoupled via
# otto.host.daemon (July finding a1/a3, FIXED). Keep it that way.
depends_on = ["otto.lifecycle", "otto.logger", "otto.registry", "otto.models", "otto.host", "otto.errors"]

[[modules]]
path = "otto.logger"
depends_on = ["otto.console"]

[[modules]]
path = "otto.models"
depends_on = [
    "otto.utils",
    "otto.link",
    # ALLOWED LAZILY ONLY: to_runtime() bodies import config.repo at function
    # scope. The module-scope ban is enforced by ast-grep
    # (models-no-module-scope-config-import) since tach cannot distinguish
    # scope.
    "otto.config",
    "otto.logger",
    # (models -> coverage edge removed 2026-08-03: validate_color moved to
    # otto.models.color, closing the layer inversion.)
    # DEBT: models/__init__.py imports host.os_profile BEFORE .host as an
    # import-order hack (todo/registry_builtin_registration_symmetry.md).
    "otto.host",
]

[[modules]]
path = "otto.monitor"
# NOTE: no otto.tunnel here — tunnel discovery is INJECTED via the
# tunnel_source callable (collector.py:150). Keep it that way.
# otto.utils: server.py's internal uvicorn wait runs through wait_for_async
# (gate G6 — the one sanctioned poll spelling); utils is a foundational leaf
# monitor already reached transitively via otto.host.
depends_on = ["otto.host", "otto.models", "otto._webassets", "otto.result", "otto.link", "otto.filesystem", "otto.registry", "otto.logger", "otto.console", "otto.errors", "otto.utils"]

[[modules]]
path = "otto.params"

[[modules]]
path = "otto.project"
# The project layer sits ABOVE hosts and below the CLI: it drives host verbs
# across the fleet on behalf of one repo. Every edge here points down.
#
# otto.host is imported LAZILY inside the methods that dispatch (BaseHost.install
# and friends) — `import otto.project` must stay cheap, because the default
# instructions import it at CLI startup. tach counts a function-scope import as
# an edge regardless, which is why it is declared.
#
# otto.config and otto.context are TYPE_CHECKING-only in actions.py (Repo,
# OttoContext): the per-repo actions are HANDED both at construction and never
# look either up. The orchestrator DOES look them up -- ambient-context module
# functions are its whole shape -- but only from inside the call
# (orchestrator._lab), for the same reason otto.host is lazy here: `import
# otto.project` must stay cheap, and a module-scope import of either would join
# the config<->context and host<->context cycles.
#
# otto.cli is ONE FILE's edge and points UP, deliberately: project/instructions.py
# imports `@instruction` to register the six first-party `otto run` verbs. They
# are ordinary instructions, so they register through the ordinary decorator --
# the alternative (a second, CLI-side registration path for otto's own verbs)
# would be a private seam nobody else can use, to avoid an edge that costs
# little. It is not free, and this comment used to say it was: otto.cli does
# not import otto.project DIRECTLY (bootstrap reaches this module by name,
# through importlib), but the loop still closes one hop further out — project
# -> cli -> suite -> project, because otto.cli imports otto.suite and the
# suite's ensure_* fixtures import this package. It is not a RUNTIME circular
# import (nothing in otto.suite imports otto.cli, and the fixture import is
# inside the fixture body), which is why it survives; the retirement is the
# same one the config<->cli DEBT edge needs — a home for instruction
# registration that is not otto.cli. See otto.suite below, which carries the
# other half of this note. Every OTHER module in the package stays CLI-free,
# which is what lets a fixture or a suite call the orchestrator without
# dragging typer in.
depends_on = [
    "otto.registry",
    "otto.result",
    "otto.utils",
    "otto.host",
    "otto.config",
    "otto.context",
    "otto.cli",
]

[[modules]]
path = "otto.registry"

[[modules]]
path = "otto.reservations"
depends_on = ["otto.registry", "otto.utils", "otto.models", "otto.config", "otto.errors"]

[[modules]]
path = "otto.result"
# otto.errors is for CommandNotRunError's OttoError base. Like config's edge
# below, this cannot invert layering or create a cycle: otto.errors is a
# zero-import leaf. The error is defined HERE, not in otto.host.errors with its
# two peers, precisely to avoid a result->host edge -- otto.host depends on
# otto.result, so that direction is both a runtime circular import and one more
# mutually-importing pair added to the inventory the header measures and this
# file is trying to shrink.
depends_on = ["otto.utils", "otto.errors"]

[[modules]]
path = "otto.suite"
# otto.project is the ensure_installed / ensure_uninstalled / ensure_clean
# fixtures in pytest_plugin.py, imported INSIDE each fixture body (tach counts
# it as an edge anyway). The edge points DOWN — project drives hosts on behalf
# of a repo, a suite consumes that — and it is the point of the layer: `otto
# run install` and the fixture call the same function, so the CLI and the
# suites cannot diverge on what "installed" means.
#
# It does complete a LOOP in this file's graph — otto.project -> otto.cli ->
# otto.suite -> otto.project — the one loop in the header's inventory that is
# not a mutually-importing pair, and the reason the header counts loops
# separately from pairs. It is not a runtime cycle:
# only project/instructions.py reaches otto.cli (for the `@instruction`
# decorator), and nothing in otto.suite imports it. Retiring it means giving
# instruction registration a home that is not otto.cli, which is the same fix
# the config<->cli DEBT edge needs and belongs with it, not here.
depends_on = ["otto.context", "otto.config", "otto.lifecycle", "otto.registry", "otto.monitor", "otto.version", "otto.models", "otto.host", "otto.coverage", "otto.params", "otto.errors", "otto.result", "otto.utils", "otto.project"]

[[modules]]
path = "otto.testing"
depends_on = ["otto.config", "otto.labs", "otto.reservations", "otto.host", "otto.suite"]

[[modules]]
path = "otto.tunnel"
# NOTE: no otto.link here (and none the other way) — see otto.link above.
depends_on = ["otto.host", "otto.models", "otto.registry", "otto.lifecycle", "otto.logger", "otto.errors"]

[[modules]]
path = "otto.utils"

[[modules]]
path = "otto.version"

[[modules]]
path = "otto._webassets"
