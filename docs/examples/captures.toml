project = "quickstart-kmod"
timeout = 300
argv = ["{otto}", "--lab", "example_lab", "run", "install", "--ensure"]
redact = [
    ["\\d{8}_\\d{6}_\\d{3}", "<run>"],
    ["━+ ([\\d.]+/[\\d.]+ [kMG]?B) [\\d.]+ [kMG]?B/s \\d+:\\d{2}:\\d{2}", "━━━━ \\1 <rate>"],
]

[[capture]]
id = "qs-kmod-unit"
project = "quickstart-kmod"
kind = "gtest"
argv = ["{project}/build/tests/unit/unit_tests"]

[[capture]]
id = "qs-kmod-report"
project = "quickstart-kmod"
timeout = 300
