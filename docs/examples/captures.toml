# ---- Kernel-module track (docs/setup/tracks/kmod.md) -------------------------
# One ordered set, listed under [ordered]. In a fresh copy of the example it
# runs init, then copies the sentinels, commits, builds the library, the
# module and the unit tests, checks the builds left the tree clean, installs
# on dut (test1), takes the manual tier, unloads the module so the e2e run's
# ensure loads it after the pre-run clean, takes the e2e tier, puts the lab
# back with --ensure, runs the unit tests, reports, monitors, and cleans the
# host. The module builds on this machine against its own kernel headers;
# test1 runs the same release, so the vermagic matches and insmod accepts it
# (a mismatch fails the install).

# The reader's first step (D1): vendor the library and write the consumer
# starter. The settings already declare the kmodcov entry, so nothing is
# appended. The "Next steps" panel varies with OTTOPATH and the cwd
# (src/otto/cli/init.py:298-299, 317), so it is redacted.
# --path, because captures run from the scratch dir (refresh_docs_captures.py:706).
[[capture]]
id = "qs-kmod-init"
project = "quickstart-kmod"
argv = ["{otto}", "init", "--kmodcov", "--path", "{project}"]
redact = [
    ["╭─ Next steps[\\s\\S]*?╰─+╯", "<next steps: shell completion, then the commands to try>"],
]

[[capture]]
id = "qs-kmod-copy-sentinels"
project = "quickstart-kmod"
record = false
argv = ["cp", "{project}/third_party/otto_kmodcov-consumer/kmodcov_begin.c", "{project}/third_party/otto_kmodcov-consumer/kmodcov_end.c", "{project}/module/"]

[[capture]]
