[[capture]]
id = "monitor-bb1350"
labless = false
project = "getting-started"
timeout = 300
argv = ["{python}", "{project}/collect_metrics.py"]
# How many samples a fixed-duration run collects depends on where the ticks
# fall (and a rate series needs two ticks before its first point), so the
# counts are normalised; which series appear is the point, and is stable.
redact = [["\\t\\d+ samples", "\\tN samples"]]

[[capture]]
id = "zephyr27-run"
labless = false
project = "getting-started"
timeout = 300
argv = ["{otto}", "--lab", "embedded", "host", "zephyr27-fat", "exec", "kernel uptime"]
# Same uptime-casing and run-directory fixes as zephyr37-debug-run; this one
# runs at the default log level so none of the DEBUG-only noise appears. The
# telnet client's own "Connected to <Peer ...>" line is INFO, not DEBUG-only,
# so it appears here too, ephemeral port and all -- it's in every Zephyr
# capture regardless of log level.
redact = [
    ["Uptime: \\d+ ms", "Uptime: <n> ms"],
    ["\\d{8}_\\d{6}_\\d{3}_exec", "<run>_exec"],
    ["<Peer 127\\.0\\.0\\.1 \\d+>", "<Peer 127.0.0.1 <port>>"],
]

