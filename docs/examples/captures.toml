# Captures the docs pages include, for every example project (spec 2026-08-27 §5).
# Artifacts: docs/examples/captures/<id>.txt -- one directory for every project.
# Refresh: python scripts/refresh_docs_captures.py [--only ID]   (bed captures need the lab)
# Check:   python scripts/refresh_docs_captures.py --check [--labless]
#
# labless = true  -> tier 2, checked in the docs gate
# labless = false -> tier 3, checked by `make docs-captures-check` only
# record = false  -> a step later captures need: run and exit-checked, no artifact
#
# Captures run in this file's order and share one scratch copy of the examples,
# so a set whose later captures depend on earlier steps must be selected whole:
# list its project under [ordered] (below), and an --only that names some of
# its captures but not all is refused.
#
# env = { K = "v" } -> variables for this capture alone, set after the caller's
#   OTTO_* variables are stripped (so a set can pin OTTO_COMPOSE_SUFFIX). It may
#   not change what the runner pins for every capture: NO_COLOR, TERM, COLUMNS,
#   LINES, OTTO_HOME, OTTO_XDIR, OTTOPATH.
# always = true   -> a set's teardown: once a capture fails, only the remaining
#   always captures run, unrecorded, and the first failure is the one reported.
#   On a clean run it is an ordinary capture. An always capture may not be
#   followed by an ordinary one of its project: teardown is the tail of a set.
# arms_teardown = true -> the one capture of a set (its preflight) that proves
#   the set owns what its teardown removes. The set's always captures then run
#   only once it has succeeded in this run; if it failed, or never ran because
#   an earlier capture failed, each is skipped, so a refused preflight removes
#   nothing.
#
# unordered = true -> --check ignores the order of the redacted lines, never
#   their count or text: for a command whose log interleaves work otto does on
#   several hosts at once. A refresh still writes the artifact as printed.
# kind = "gtest"  -> argv is a GoogleTest binary: colour off, timings redacted
# [[capture.store]] -> after the run, a hit count the coverage store must hold:
#   path and file (as the store records it) may use {project}/{tmp}/{xdir};
#   line, tier, hits, and optionally product (sum over that product's runs in
#   the tier) and marker (text that line must hold in the committed example,
#   checked before any capture runs; the file is then "{project}/<path>")
# [[capture.store_sources]] -> after the run, the exact set of source files in
#   the tier, whatever their hit count (a file no run in the tier executed
#   counts for every product): path, tier, files (placeholders allowed), and
#   optionally product
#
# [snippets] -> <name> = "<text>": an argv entry spells it {snippet:<name>},
#   and the manifest is read with the text in its place. One decision several
#   captures make is written once, here.
#
# [overlays] -> <project> = "<dir under docs/examples>": copied over that
#   project's scratch copy. A downloadable example ships placeholder hosts; its
#   overlay carries the bed's lab data, so the captures still reach the bed.
#   The key is a project some capture runs; the dir stays under docs/examples.
#
# [leases] -> docker_host = ["<project>", ...]: a run selecting any capture of
#   these projects holds the docker host lease for its whole length, teardown
#   included -- the lock the docker e2e tests take, so the two never share the
#   docker host. --list takes no lease.
#
# [ordered] -> sets = ["<project>", ...]: each project's captures form one
#   ordered set, selected whole or not at all. Each is a project some capture
#   runs. quickstart-shell and quickstart-kmod are two: in each, the build,
#   test and coverage steps feed each other.

[snippets]
# The docker host's private build cache records, one id per line, sorted, in
# $k: the classification the docker set's preflight, prune and verify share.
# Each record is a block of buildx's verbose layout; one marked Shared is data
# an image still holds, which no prune frees, so it is left out. The totals'
# own Shared line is a size, never true or false, so it is ignored.
# The docker host's private staging root, in $s: the directory otto stages
# under for the login these commands run as (otto.host.docker_host.staging_root
# spells it; tests/unit/docs/test_quickstart_docker_example.py pins this text
# to that function). A failed or empty login read fails the chain, so no check
# below it can pass on a path that names no one's root.
docker_staging_root = '''w=$(id -un) && test -n "$w" && s=/tmp/otto-docker-$w'''
private_cache_records = '''u=$(docker buildx du --verbose) && k=$(printf '%s\n' "$u" | awk '/^ID:/{if(id!=""&&s!="true")print id; id=$2; s=""} /^Shared:/&&($2=="true"||$2=="false"){s=$2} END{if(id!=""&&s!="true")print id}' | sort)'''

[overlays]
quickstart-shell = "bed/quickstart-shell"
quickstart-kmod = "bed/quickstart-kmod"
quickstart-embedded = "bed/quickstart-embedded"
quickstart-docker = "bed/quickstart-docker"

[ordered]
sets = ["quickstart-shell", "quickstart-kmod", "quickstart-embedded", "quickstart-docker"]

[leases]
docker_host = ["quickstart-docker"]

