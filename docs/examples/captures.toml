[[capture]]
id = "session-setup-test1"
labless = false
project = "getting-started"
timeout = 300
argv = ["{otto}", "--lab", "unix", "host", "test1", "exec", "echo $APP_ENV"]
redact = [
    ["__OTTO_[0-9a-f]+_", "__OTTO_<session>_"],
    ["\\d{8}_\\d{6}_\\d{3}_exec", "<run>_exec"],
]

[[capture]]
id = "session-setup-pyrepl"
labless = false
project = "getting-started"
timeout = 300
argv = ["{otto}", "--lab", "pyrepl", "host", "test1-py", "exec", "1 + 1"]
redact = [
    ["__OTTO_[0-9a-f]+_", "__OTTO_<session>_"],
    ["\\d{8}_\\d{6}_\\d{3}_exec", "<run>_exec"],
]

[[capture]]
id = "session-setup-zephyr37-lfs"
labless = false
project = "getting-started"
timeout = 300
argv = ["{otto}", "--lab", "embedded", "host", "zephyr37-lfs", "exec", "kernel version"]
# The native_posix QEMU instance's peer socket binds an ephemeral port that
# varies every run. This is the only capture with a raw ANSI escape byte in
# its output (the device shell's own colorized prompt) rather than a textual
# "\x1b" inside a quoted debug buffer -- an invisible byte in a committed text
# file, but its trailing SGR code (e.g. "[1;32m") is printable text once the
# page renders it, so it is stripped here.
redact = [
    ["__OTTO_[0-9a-f]+_", "__OTTO_<session>_"],
    ["\\d{8}_\\d{6}_\\d{3}_exec", "<run>_exec"],
    ["<Peer 127\\.0\\.0\\.1 \\d+>", "<Peer 127.0.0.1 <port>>"],
    ["\\x1b\\[[0-9;]*m", ""],
]

# ---- Shell track (docs/setup/tracks/shell.md) --------------------------------
# One ordered set, listed under [ordered]: every entry depends on the ones
# before it, so an --only that names some of them but not all is refused. It
# builds a fresh copy of the example, makes it a git repository, installs on
# dut (test1), takes the manual tier,
# the e2e tier and the unit tier in the order the reporter accepts, reports,
# monitors, and cleans the host. record = false entries are steps no page quotes.

[[capture]]
id = "qs-shell-git-init"
project = "quickstart-shell"
record = false
argv = ["git", "-C", "{project}", "init", "-q", "-b", "main"]

[[capture]]
id = "qs-shell-cmake-configure"
project = "quickstart-shell"
record = false
timeout = 300
argv = ["cmake", "-S", "{project}", "-B", "{project}/build"]

[[capture]]
id = "qs-shell-cmake-build"
project = "quickstart-shell"
record = false
timeout = 600
argv = ["cmake", "--build", "{project}/build"]

[[capture]]
id = "qs-shell-git-add"
project = "quickstart-shell"
record = false
argv = ["git", "-C", "{project}", "add", "-A"]

[[capture]]
id = "qs-shell-git-commit"
project = "quickstart-shell"
record = false
argv = ["git", "-C", "{project}", "-c", "user.name=otto docs", "-c", "user.email=docs@example.invalid", "commit", "-qm", "quickstart-shell"]

[[capture]]
id = "qs-shell-install-dry"
project = "quickstart-shell"
argv = ["{otto}", "--lab", "example_lab", "-n", "run", "install"]
redact = [
    ["\\d{8}_\\d{6}_\\d{3}", "<run>"],
]

[[capture]]
id = "qs-shell-install"
project = "quickstart-shell"
timeout = 300
argv = ["{otto}", "--lab", "example_lab", "run", "install"]
# The transfer bar's rate and elapsed time vary, and so does its width.
redact = [
    ["\\d{8}_\\d{6}_\\d{3}", "<run>"],
    ["━+ ([\\d.]+/[\\d.]+ [kMG]?B) [\\d.]+ [kMG]?B/s \\d+:\\d{2}:\\d{2}", "━━━━ \\1 <rate>"],
]

[[capture]]
id = "qs-shell-cov-clean"
project = "quickstart-shell"
record = false
argv = ["{otto}", "--lab", "example_lab", "cov", "clean"]

[[capture]]
