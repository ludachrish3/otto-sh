# Captures the docs pages include, for every example project (spec 2026-08-27 §5).
# Artifacts: docs/examples/captures/<id>.txt -- one directory for every project.
# Refresh: python scripts/refresh_docs_captures.py [--only ID]   (bed captures need the lab)
# Check:   python scripts/refresh_docs_captures.py --check [--labless]
#
# labless = true  -> tier 2, checked in the docs gate
# labless = false -> tier 3, checked by `make docs-captures-check` only
# record = false  -> a step later captures need: run and exit-checked, no artifact
#
# Captures run in this file's order and share one scratch copy of the examples,
# so a set whose later captures depend on earlier steps must be selected whole:
# list its project under [ordered] (below), and an --only that names some of
# its captures but not all is refused.
#
# kind = "gtest"  -> argv is a GoogleTest binary: colour off, timings redacted
# [[capture.store]] -> after the run, a hit count the coverage store must hold:
#   path and file (as the store records it) may use {project}/{tmp}/{xdir};
#   line, tier, hits, and optionally product (sum over that product's runs in
#   the tier) and marker (text that line must hold in the committed example,
#   checked before any capture runs; the file is then "{project}/<path>")
# [[capture.store_sources]] -> after the run, the exact set of source files in
#   the tier, whatever their hit count (a file no run in the tier executed
#   counts for every product): path, tier, files (placeholders allowed), and
#   optionally product
#
# [overlays] -> <project> = "<dir under docs/examples>": copied over that
#   project's scratch copy. A downloadable example ships placeholder hosts; its
#   overlay carries the bed's lab data, so the captures still reach the bed.
#   The key is a project some capture runs; the dir stays under docs/examples.
#
# [ordered] -> sets = ["<project>", ...]: each project's captures form one
#   ordered set, selected whole or not at all. Each is a project some capture
#   runs. quickstart-shell and quickstart-kmod are two: in each, the build,
#   test and coverage steps feed each other.

[overlays]
quickstart-shell = "bed/quickstart-shell"
quickstart-kmod = "bed/quickstart-kmod"
quickstart-embedded = "bed/quickstart-embedded"

[ordered]
sets = ["quickstart-shell", "quickstart-kmod", "quickstart-embedded"]

[[capture]]
id = "init-all"
