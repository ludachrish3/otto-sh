[[capture]]
id = "qs-kmod-test-cov"
project = "quickstart-kmod"
timeout = 600
argv = ["{otto}", "--lab", "example_lab", "test", "--cov", "--cov-dir", "{xdir}/quickstart-kmod/e2e/cov", "--no-random", "TestWordcount"]
redact = [
    ["\\d{8}_\\d{6}_\\d{3}", "<run>"],
    ["otto-fetch-[0-9a-f]{12}", "otto-fetch-<id>"],
    ["otto-fetch-<id>\\.(?!XXXXXX)[A-Za-z0-9]{6}", "otto-fetch-<id>.<tmp>"],
    ["=+ (\\d+ passed[^=\\n]*?) in [\\d.]+s =+", "=== \\1 in <t>s ==="],
