# ---- Docker track (docs/setup/tracks/docker.md) ------------------------------
# One ordered set, listed under [ordered], run under the docker host lease
# ([leases]), on test3: the docker e2e tests' host. In a fresh copy of the
# example it builds the tools here, makes the copy a git repository, builds the
# two images on the docker host and brings the use-case up, installs, takes the
# manual tier, the e2e tier and the unit tier, and reports.
#
# Every otto command pins OTTO_COMPOSE_SUFFIX = "docs", so the names the set
# creates on the docker host are fixed, and no other session's: the compose
# project example_lab-quickstart-docs (its container and network), the
# staging trees example_lab-quickstart-docs and otto-quickstart-docker-docs
# under the login's private staging root ([snippets] docker_staging_root), the
# images quickstart-runtime and quickstart-banner, the container
# quickstart-banner, the banner's cov_dir under /tmp/quickstart-docker, and the
# build cache records the two builds add.
# tests/unit/docs/test_quickstart_docker_example.py resolves these names
# through otto and checks the texts below hold them.
#
# The preflight refuses to start when any of them is present, so the set never
# removes what it did not create. Only once all are proven absent does it write
# /tmp/quickstart-docker-baseline: the base image's id and the cache record ids.
# It arms the teardown (arms_teardown): the always tail runs only after this
# run's preflight succeeded, so a refused preflight, or a failure in an earlier
# set, leaves the docker host untouched. The tail takes the use-case down, runs
# cleanup (which removes the staging once the stack has no containers, and the
# banner's container), sweeps what otto leaves by design (the images, and the
# root-owned cov_dir the bind mount made) and anything a failure left, prunes
# only the cache records the run added, and checks that everything is gone and
# the base image unchanged. Only that check removes the baseline, so when it
# fails the baseline stays and the next preflight refuses: what is left is for
# a maintainer to look at and remove, never for a later run to guess at.
#
# cleanup runs with its lab-wide steps off: a tunnel or an impairment on the
# docker host may be another session's. The example declares no toolchain, so
# cleanup's host-global toolchain step removes nothing.
#
# The cache inventory is [snippets] private_cache_records, one text for the
# preflight, the prune and the verify. It leaves out records marked Shared:
# data an image still holds, so no prune can free it. That is how the base
# image's layers appear after buildx is installed: the first BuildKit build
# indexes alpine as a shared record, which the run did not create in any sense
# the host would notice, and which removing would mean removing alpine itself.
#
# Redactions: besides the run timestamp, the commands that reach a container
# print its id (12 hex digits, 64 in full), the staging directory otto makes
# for a transfer (a 32-digit uuid), and an otto-fetch id that wraps across a
# line at a fixed column, since every path before it has a fixed length.
#
# install, cov get and test --cov work on the parent and the container at
# once, so their log lines interleave differently on each run: they are
# unordered = true.
#
# A docker query whose status the shell ignores would pass a check it never
# made, so each one is an assignment chained with &&: an assignment takes its
# substitution's exit status.

[[capture]]
id = "qs-docker-preflight"
project = "quickstart-docker"
record = false
arms_teardown = true
env = { OTTO_COMPOSE_SUFFIX = "docs" }
argv = ["{otto}", "--lab", "example_lab", "host", "docker-host", "exec", '''test ! -e /tmp/quickstart-docker-baseline && test ! -e /tmp/quickstart-docker && {snippet:docker_staging_root} && test ! -e "$s/example_lab-quickstart-docs" && test ! -e "$s/otto-quickstart-docker-docs" && c=$(docker ps -aq --filter label=com.docker.compose.project=example_lab-quickstart-docs) && test -z "$c" && c=$(docker ps -aq --filter 'name=^/?quickstart-banner$') && test -z "$c" && n=$(docker network ls -q --filter label=com.docker.compose.project=example_lab-quickstart-docs) && test -z "$n" && i=$(docker image ls -q quickstart-runtime) && test -z "$i" && i=$(docker image ls -q quickstart-banner) && test -z "$i" && a=$(docker image inspect -f '{{.Id}}' alpine:3.20) && {snippet:private_cache_records} && mkdir /tmp/quickstart-docker-baseline && printf '%s\n' "$a" > /tmp/quickstart-docker-baseline/alpine && printf '%s\n' "$k" > /tmp/quickstart-docker-baseline/cache''']

