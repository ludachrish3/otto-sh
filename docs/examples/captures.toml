[[capture]]
id = "zephyr37-debug-run"
labless = false
project = "getting-started"
timeout = 300
argv = ["{otto}", "--log-level", "DEBUG", "--lab", "embedded", "host", "zephyr37-fat", "exec", "kernel uptime"]
# The uptime value varies every run. DEBUG logging turned out to carry five
# more things that vary run to run: the per-session random ids threaded
# through every handshake/marker/framed-write line, the local hop's ephemeral
# forwarding port, the tunnel-connect duration, the telnetlib3
# negotiation-complete duration, and the uptime response's own byte length --
# plus the per-run scratch output directory, which otto names from a non-ISO
# YYYYMMDD_HHMMSS_mmm timestamp. The repository's commit is not among them: the
# capture runs against a scratch copy, so otto's git read fails and no hash
# is ever printed. The telnet client's own "Connected to <Peer ...>" line is
# INFO, not DEBUG-only, so it appears in every Zephyr capture, ephemeral port
# and all.
redact = [
    ["Uptime: \\d+ ms", "Uptime: <n> ms"],
    ["output_len=\\d+", "output_len=<n>"],
    ["LocalSession@[0-9a-f]+", "LocalSession@<session>"],
    ["TelnetSession@[0-9a-f]+", "TelnetSession@<session>"],
    ["__OTTO_[0-9a-f]+_", "__OTTO_<session>_"],
    ["localhost:\\d+", "localhost:<port>"],
    ["<Peer 127\\.0\\.0\\.1 \\d+>", "<Peer 127.0.0.1 <port>>"],
    ["in \\d+\\.\\d+s", "in <duration>s"],
    ["after \\d+\\.\\d+s", "after <duration>s"],
    ["\\d{8}_\\d{6}_\\d{3}_exec", "<run>_exec"],
]

[[capture]]
id = "probe-bb1350"
labless = false
project = "getting-started"
timeout = 300
argv = ["{otto}", "--lab", "busybox", "host", "bb1350-qemu", "probe"]
# The protocol survey's login tier opens a telnet session through the test1
# hop to reach the guest, and that hop's local forwarded port is ephemeral --
# same nondeterminism the zephyr27-run rule below masks.
redact = [["<Peer 127\\.0\\.0\\.1 \\d+>", "<Peer 127.0.0.1 <port>>"]]

[[capture]]
id = "as-root-test1"
labless = false
project = "getting-started"
