argv = ["{otto}", "--lab", "example_lab", "host", "docker-host", "exec", '''test -f /tmp/quickstart-docker-baseline/alpine && { docker ps -aq --filter label=com.docker.compose.project=example_lab-quickstart-docs | xargs -r docker rm -f; docker ps -aq --filter 'name=^/?quickstart-banner$' | xargs -r docker rm -f; docker network ls -q --filter label=com.docker.compose.project=example_lab-quickstart-docs | xargs -r docker network rm; docker image rm quickstart-runtime:latest quickstart-banner:latest >/dev/null 2>&1; true; }''']

