# ---- Embedded track (docs/setup/tracks/embedded.md) --------------------------
# One ordered set, listed under [ordered]. In a fresh copy of the example it
# gets the embedded-gcov runtime at its pinned commit, runs init for the patch
# and the starter, builds the extension for zephyr37_llext (Zephyr 3.7, via the
# console on test4), builds the unit tests, installs on dut, takes the manual
# tier, takes the e2e tier, runs the unit tests, reports, and cleans the host.
#
# Board precondition: dut (zephyr37_llext) holds no other resident extension.
# The e2e capture quotes `llext list`, which shows every resident extension, so
# one another session left (tests/project3's cov_ext, for example) would appear
# in the page and drift --check. Unload it first: `llext unload cov_ext`.

[[capture]]
id = "qs-embedded-clone-runtime"
project = "quickstart-embedded"
record = false
argv = ["git", "clone", "-q", "{checkout}/tests/project3/third_party/embedded-gcov", "{tmp}/embedded-gcov"]

[[capture]]
id = "qs-embedded-pin-runtime"
project = "quickstart-embedded"
record = false
argv = ["git", "-C", "{tmp}/embedded-gcov", "checkout", "-q", "7cc670697d0b9fa23f7d22ed5f6776164d7732e2"]

[[capture]]
id = "qs-embedded-init"
project = "quickstart-embedded"
argv = ["{otto}", "init", "--embedded-gcov", "--path", "{project}"]
redact = [
    ["╭─ Next steps[\\s\\S]*?╰─+╯", "<next steps: shell completion, then the commands to try>"],
]

[[capture]]
id = "qs-embedded-apply-patch"
project = "quickstart-embedded"
record = false
argv = ["git", "-C", "{tmp}/embedded-gcov", "apply", "{project}/third_party/embedded-gcov-patch/embedded-gcov-zephyr-gcc12plus.patch"]

[[capture]]
id = "qs-embedded-git-init"
project = "quickstart-embedded"
record = false
argv = ["git", "-C", "{project}", "init", "-q", "-b", "main"]

[[capture]]
id = "qs-embedded-git-add"
