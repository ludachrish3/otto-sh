[[capture]]
id = "qs-docker-cache-prune"
project = "quickstart-docker"
record = false
always = true
timeout = 300
env = { OTTO_COMPOSE_SUFFIX = "docs" }
argv = ["{otto}", "--lab", "example_lab", "host", "docker-host", "exec", '''test -f /tmp/quickstart-docker-baseline/cache && {snippet:private_cache_records} && { f=0; for id in $(printf '%s\n' "$k" | comm -13 /tmp/quickstart-docker-baseline/cache -); do docker builder prune -f --filter id=$id >/dev/null || f=1; done; test "$f" = 0; }''']

# The cache check looks for additions only. The builder is shared: the
# baseline holds other sessions' records too, and they may prune theirs while
# this set runs, so a record gone from the baseline proves nothing about this
# set. What this set could remove is bounded by its own prune, which removes
# only the exact ids the run added.
[[capture]]
id = "qs-docker-verify-clean"
project = "quickstart-docker"
record = false
always = true
env = { OTTO_COMPOSE_SUFFIX = "docs" }
argv = ["{otto}", "--lab", "example_lab", "host", "docker-host", "exec", '''c=$(docker ps -aq --filter label=com.docker.compose.project=example_lab-quickstart-docs) && test -z "$c" && c=$(docker ps -aq --filter 'name=^/?quickstart-banner$') && test -z "$c" && n=$(docker network ls -q --filter label=com.docker.compose.project=example_lab-quickstart-docs) && test -z "$n" && i=$(docker image ls -q quickstart-runtime) && test -z "$i" && i=$(docker image ls -q quickstart-banner) && test -z "$i" && test ! -e /tmp/quickstart-docker && {snippet:docker_staging_root} && test ! -e "$s/example_lab-quickstart-docs" && test ! -e "$s/otto-quickstart-docker-docs" && a=$(docker image inspect -f '{{.Id}}' alpine:3.20) && b=$(cat /tmp/quickstart-docker-baseline/alpine) && test "$a" = "$b" && {snippet:private_cache_records} && d=$(printf '%s\n' "$k" | comm -13 /tmp/quickstart-docker-baseline/cache -) && test -z "$d" && rm -rf /tmp/quickstart-docker-baseline''']
