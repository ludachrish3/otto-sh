# The Getting Started worked example — a real otto project pointed at otto's
# own test bed. Pages under docs/getting-started/ include fragments of this
# file between `# doc: begin <id>` / `# doc: end <id>` markers.

# doc: begin identity
name = "gs"
version = "0.1.0"
# doc: end identity

# doc: begin libs
libs = ["libs"]
init = [
    "gs_example",           # frames, parsers, proxies, session setups
    "gs_example.actions",   # this repo's ProjectActions
]
# doc: end libs

# doc: begin lab-sources
[[lab.sources]]
backend = "json"
paths = ["lab_data"]
# doc: end lab-sources

# doc: begin project
[project]
lab_patterns = ["busybox"]
host_patterns = ["bb.*-qemu"]
# doc: end project

# doc: begin product
[[products]]
name = "agent"
class = "gs_example.products:AgentBinary"
artifact = "build/agent"
stage_dir = "/opt/agent"
uninstall = "/opt/agent/agent --uninstall; rm -rf /opt/agent"
check = "test -x /opt/agent/agent"
cov_dir = "/var/cov/agent"
match = { os_type = "unix" }
# doc: end product

# doc: begin dev-tool
[[dev_tools]]
name = "trace-probe"
kind = "shell"
artifact = "tools/probe.sh"
stage_dir = "/opt/agent/tools"
install = "chmod +x /opt/agent/tools/probe.sh"
uninstall = "rm -f /opt/agent/tools/probe.sh"
check = "test -x /opt/agent/tools/probe.sh"
match = { os_type = "unix" }
# doc: end dev-tool
