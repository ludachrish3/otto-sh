# The shell track's example project (Set up a project > Tracks > Shell).
# The track page includes the sections between `# doc: begin <id>` and
# `# doc: end <id>`.
name = "quickstart-shell"
version = "0.1.0"

# doc: begin libs
libs = ["pylib"]
init = ["quickstart_shell"]
tests = ["tests"]
# doc: end libs

[[lab.sources]]
backend = "json"
paths = ["lab_data"]

[project]
lab_patterns = ["example_lab"]

# doc: begin products
# Both tools are staged into /tmp/quickstart on dut. Each writes its coverage
# counters under its own cov_dir, /tmp/<name> by default.
[[products]]
name = "wordcount"
kind = "shell"
artifact = "build/src/wordcount/wordcount"
stage_dir = "/tmp/quickstart"
check = "test -x /tmp/quickstart/wordcount"
uninstall = "rm -rf /tmp/quickstart/wordcount {cov_dir}"
match = { id = "dut" }

[[products]]
name = "shout"
kind = "shell"
artifact = "build/src/shout/shout"
stage_dir = "/tmp/quickstart"
check = "test -x /tmp/quickstart/shout"
uninstall = "rm -rf /tmp/quickstart/shout {cov_dir}"
match = { id = "dut" }
# doc: end products

# doc: begin coverage
[coverage]
hosts = "dut"

# What the e2e tests exercised, collected by `otto test --cov`.
[coverage.tiers.system]
kind = "e2e"
precedence = 1

# What someone exercised by hand, fetched by `otto cov get --tier manual`
# and committed under .otto/coverage/manual/.
[coverage.tiers.manual]
kind = "manual"
precedence = 2

# What the unit tests exercised: their counters in the build tree, read at
# report time. Only the products' own sources count.
[coverage.tiers.unit]
kind = "unit"
precedence = 3
harvest_dirs = ["build"]
# doc: end coverage
