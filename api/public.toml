# Versioned formats (dump spec §13). Each table points at the literal lists of
# the versions otto reads and writes; the dump records the values. Dropping a
# version from either list, or removing a table, is a breaking change.

[formats.check-echo-sentinel]
reads = "otto.tunnel.model:CHECK_ECHO_READ_VERSIONS"
writes = "otto.tunnel.model:CHECK_ECHO_WRITE_VERSIONS"

[formats.check-report]
writes = "otto.check.formats:CHECK_REPORT_WRITE_VERSIONS"

[formats.coverage-capture]
reads = "otto.coverage.formats:CAPTURE_READ_VERSIONS"
writes = "otto.coverage.formats:CAPTURE_WRITE_VERSIONS"

[formats.coverage-store]
reads = "otto.coverage.formats:STORE_READ_VERSIONS"
writes = "otto.coverage.formats:STORE_WRITE_VERSIONS"

[formats.coverage-tickets]
writes = "otto.coverage.formats:TICKETS_WRITE_VERSIONS"

[formats.kmodcov-interface]
reads = "otto.kmodcov.formats:KMODCOV_INTERFACE_READ_VERSIONS"

[formats.link-impairment-sentinel]
reads = "otto.link.params:IMPAIR_SENTINEL_READ_VERSIONS"
writes = "otto.link.params:IMPAIR_SENTINEL_WRITE_VERSIONS"

[formats.monitor-database]
reads = "otto.monitor.formats:MONITOR_DB_READ_VERSIONS"
writes = "otto.monitor.formats:MONITOR_DB_WRITE_VERSIONS"

[formats.monitor-export]
reads = "otto.models.formats:MONITOR_EXPORT_READ_VERSIONS"
writes = "otto.models.formats:MONITOR_EXPORT_WRITE_VERSIONS"

[formats.monitor-live-stream]
reads = "otto.models.formats:MONITOR_STREAM_READ_VERSIONS"
writes = "otto.models.formats:MONITOR_STREAM_WRITE_VERSIONS"

[formats.reservations-file]
reads = "otto.models.formats:RESERVATIONS_READ_VERSIONS"

[formats.tunnel-sentinel]
reads = "otto.tunnel.model:TUNNEL_SENTINEL_READ_VERSIONS"
writes = "otto.tunnel.model:TUNNEL_SENTINEL_WRITE_VERSIONS"

# Per-symbol rights (keyword-only interfaces spec §4.1, §6.3, §6.4): a withdrawn
# constructor or subclass right, the default-body hooks users override, and the
# parameters that stay positional (§5, §6.2-6.6): a user-called subject the docs
# call positionally, a host verb's subject, a transfer pair, an error's first
# parameter, a registrar's name and class, an implementer-facing subject.
# Every public path to one object carries the same entry.

