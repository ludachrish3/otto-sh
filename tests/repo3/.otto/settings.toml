name = "repo3"
version = "1.0.0"
libs = [
    "pylib",
    # Shared, third-party-style module. repo3 only targets zephyr37_llext, but
    # `--lab embedded` constructs every host in the lab — including the Zephyr
    # 2.7 zephyr27_fat, whose `zephyr-inline` frame lives here. Pulling it in lets
    # repo3 load the shared lab without owning the 2.7 dialect (see
    # tests/custom_hosts).
    "../custom_hosts",
]
tests = [
    "tests",
]
init = [
    'repo3_instructions',
    'custom_hosts',
]

# Declaring [[products]] makes repo3 a providing repo, and bootstrap refuses a
# providing repo without a [project] scope. The `match` tables below already
# name the two coverage beds by id, so the scope is the match-all that keeps
# repo3 usable against any lab that carries them; match-all is spelled out
# because it is never a default.
[project]
lab_patterns = [".*"]

# Embedded coverage bed. Full design: ../../../todo/embedded_coverage.md;
# bring-up record: docs/feasibility.md.
#
# The coverage target is the `zephyr37_llext` mps2_an385 instance in the shared
# tech1 lab data — a stock Zephyr LLEXT loader base (built from
# samples/subsys/llext/shell_loader, see ../../firmware/zephyr/configs/cov_an385)
# reached over a QEMU `-serial telnet:` bridge. The instrumented product
# (product/) is loaded at runtime; the base carries no coverage code.
[[lab.sources]]
backend = "json"
paths = [
    "../_fixtures/lab_data/tech1",
]

# Reuse repo1's zephyr-* os_profiles pattern. Per embedded_cortex_m_migration.md
# the board (qemu_cortex_m3 vs qemu_x86) is a firmware-build detail, NOT an
# os_profile field, so these profiles stay board-agnostic. (The repo1 "zephyr-2.7"
# inline-retcode profile is intentionally omitted: it needs the zephyr-inline
# command frame that repo1_instructions registers, which repo3 does not carry.)
[os_profiles."zephyr-3.7"]
base = "embedded"
os_name = "Zephyr"
os_version = "3.7"
command_frame = "zephyr"
transfer = "console"
max_filename_len = 32

[os_profiles."zephyr-4.4"]
base = "embedded"
os_name = "Zephyr"
os_version = "4.4"
command_frame = "zephyr"
transfer = "console"
max_filename_len = 32

# The instrumented LLEXT extension (product/) as a product, one entry per
# Zephyr version. An `llext` product has no filesystem home: `install` IS the
# `llext load_hex` + `call_after_load`, and `uninstall` is the unload — so the
# TestEmbeddedCoverage suite drives the extension through the product rather
# than spelling the loader commands itself, and the collector dumps it through
# the same name.
#
# Two entries share one NAME on purpose. KindRegistry.build takes the first
# entry per name whose `match` admits the host, so each board gets its own
# version-matched artifact while everything downstream — the run tree's
# `cov/<host>/cov_ext/` segment, the capture's `product` field, the dump
# command — sees a single product called `cov_ext` on both beds.
#
# The artifacts are absolute paths on the dev VM where the product is built;
# they must stay in step with [coverage.embedded].builds below, whose .gcno is
# each board's report source root. The suite asserts that agreement rather than
# trusting it.
[[products]]
name = "cov_ext"
kind = "llext"
artifact = "/home/vagrant/build/cov_ext_app/zephyr/cov_ext.stripped.llext"
call_after_load = ["cov_init"]
match = { id = "zephyr37-llext" }

[[products]]
name = "cov_ext"
kind = "llext"
artifact = "/home/vagrant/build/cov_ext_app_v4_4/zephyr/cov_ext.stripped.llext"
call_after_load = ["cov_init"]
match = { id = "zephyr44-llext" }

[coverage]
# Embedded coverage uses console transport, not a remote .gcda directory, so a
# product's `cov_dir` plays no part here. The embedded path instead drives
# `llext call_fn cov_dump` over the console (EmbeddedGcdaCollector), decodes the
# hex stream to .gcda on the host, and runs a cross-gcov (arm-zephyr-eabi-gcov)
# discovered from the .gcno under [coverage.embedded].build_dir.

# Which hosts to collect coverage from: a host-id regex FULLY matched against
# each id (re.fullmatch), defaulting to every host in the lab when unset. This
# selects the coverage target(s) out of the shared `embedded` lab — keeping the
# plain embedded test hosts and the `test4` SSH hop out — so the collect-from
# set is repo-declared, not inferred from which hosts happen to emit .gcda. The
# same selector scopes the TestEmbeddedCoverage suite (which hosts it loads the
# instrumented extension onto). The alternation is load-bearing and not
# tidiness: the intent is BOTH coverage beds — zephyr37-llext (3.7) and
# zephyr44-llext (4.4) — so coverage is collected across multiple Zephyr
# versions, and a bare "zephyr37-llext" fullmatches only the 3.7 bed. That would
# not fail; it would quietly halve the collection. The two ids share no
# distinguishing prefix, so no trailing wildcard can stand in for the
# alternation — spelling both versions out is the only selector that names the
# intent. (The ids are hyphenated: the elements "zephyr37_llext"/"zephyr44_llext"
# slug their underscore to a hyphen under the host-id rules.) Future (per
# embedded_cortex_m_migration.md): when every QEMU host can emit coverage, widen
# this further (e.g. "zephyr.*").
hosts = "zephyr(37|44)-llext"

[coverage.embedded]
# The extension NAME is no longer declared here — it is the `[[products]]`
# entry's `name` above, which is also the run tree's product segment and the
# name the collector dumps through (`llext call_fn <product> <dump_fn>`).
#
# The cross-gcov is no longer named here — it is a per-host bed property declared
# in lab data (each host's ``toolchain`` dict). See the embedded host entries in
# lab_data/tech1/lab.json. (.gcno discovery remains the no-config fallback.)

# The extension's build dir: holds the .gcno + source used as the report's
# source root. Absolute, on the dev VM where the product is built. See product/.
# Retained as the single-version fallback for any coverage host whose os_version
# has no entry in the per-version [coverage.embedded.builds] table below.
build_dir = "/home/vagrant/build/cov_ext_app"

# Per-Zephyr-version product builds. Each coverage host's os_version selects its
# own build_dir (whose .gcno is that host's report source root); the cross-gcov
# comes from the host's lab-data toolchain. This is what lets coverage span
# multiple Zephyr versions: zephyr37_llext (3.7) -> cov_ext_app (built `build.sh
# <dir> v3_7`); zephyr44_llext (4.4) -> cov_ext_app_v4_4 (`build.sh <dir> v4_4`).
[coverage.embedded.builds."3.7"]
build_dir = "/home/vagrant/build/cov_ext_app"

[coverage.embedded.builds."4.4"]
build_dir = "/home/vagrant/build/cov_ext_app_v4_4"
