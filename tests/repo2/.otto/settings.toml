name = "repo2"
version = "1.0.4"
lab_data_type = "json"
labs = [
    "../_fixtures/lab_data/tech2",
]
libs = [
    "pylib",
]
tests = [
    "tests"
]
init = [
    'repo2_instructions',
]

[docker]
registry_url = "docker.io"

[[docker.images]]
name = "worker"
dockerfile = "docker/Dockerfile"
context = "docker"

[[docker.composes]]
path = "docker/compose.yml"
default_host = "grape_seed"
services = ["worker"]
