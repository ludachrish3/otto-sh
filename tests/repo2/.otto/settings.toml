name = "repo2"
version = "1.0.4"
libs = [
    "pylib",
]
tests = [
    "tests"
]
init = [
    'repo2_instructions',
]

[[lab.sources]]
backend = "json"
paths = [
    "../_fixtures/lab_data/tech2",
]

[docker]
registry_url = "docker.io"

[[docker.images]]
name = "worker"
dockerfile = "docker/Dockerfile"
context = "docker"

[[docker.composes]]
path = "docker/compose.yml"
default_host = "alt3"
services = ["worker"]
