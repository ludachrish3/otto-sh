name = "repo1"
version = "1.0.0"
libs = [
    "pylib",
    # Shared, third-party-style module providing the Zephyr 2.7 `zephyr-inline`
    # frame the `embedded` lab's zephyr27_fat declares (see tests/custom_hosts).
    "../custom_hosts",
]
tests = [
    "tests"
]
init = [
    'repo1_instructions',
    'custom_hosts',
    'repo1_monitor_uptime',
]

[[lab.sources]]
backend = "json"
paths = [
    "../_fixtures/lab_data/tech1",
]

# Named OS profiles: bundle each Zephyr version's common attributes once so a
# host entry only declares its identity + filesystem instead of repeating
# os_name / os_version / command_frame / transfer / max_filename_len. The 2.7
# profile names the `zephyr-inline` dialect (registered by the shared
# custom_hosts module this repo pulls in via libs/init), proving a data-defined
# profile can reference a code-registered command frame.
[os_profiles."zephyr-3.7"]
base = "embedded"
os_name = "Zephyr"
os_version = "3.7"
command_frame = "zephyr"
transfer = "console"
max_filename_len = 32

[os_profiles."zephyr-2.7"]
base = "embedded"
os_name = "Zephyr"
os_version = "2.7"
command_frame = "zephyr-inline"
transfer = "console"
max_filename_len = 32

[os_profiles."zephyr-4.4"]
base = "embedded"
os_name = "Zephyr"
os_version = "4.4"
command_frame = "zephyr"
transfer = "console"
max_filename_len = 32

[coverage]
gcda_remote_dir = "/var/coverage/product"

[docker]
registry_url = "docker.io"

[[docker.images]]
name = "api"
dockerfile = "docker/Dockerfile"
context = "docker"

[[docker.composes]]
name = "core"
path = "docker/compose.yml"
services = ["api"]

[[docker.use_cases]]
name = "repo1"
composes = ["core"]
role = "docker"

# The displacement pair's winner (spec §4). repo1 provides a REAL `edge` at
# priority 10; repo2's mock sits at 0 and stands down. Losing is whole-fragment,
# so a `--provide edge=repo2` invocation excludes `core` here too — which is
# what makes the pair a usable --remove-orphans fixture.
[[docker.composes]]
name = "edge"
path = "docker/edge.yml"
services = ["edge"]

[[docker.use_cases]]
name = "integration"
composes = ["core", "edge"]
role = "docker"
provides = "edge"
priority = 10
env = { EDGE_ADDR = "${otto:parent.addr}" }
